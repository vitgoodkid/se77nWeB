    colors: { bg:'#0d0a08', panel:'#15110d', panel2:'#1c1813', line:'rgba(255,255,255,0.08)', line2:'rgba(255,255,255,0.14)', ink:'#f5ede0', mute:'rgba(245,237,224,0.5)', mute2:'rgba(245,237,224,0.3)', red:'#E04545', green:'#5BA868', gold:'#D4A858', purple:'#8a4fff' },

<style>
  html, body { background: #0d0a08; color: #f5ede0; font-family: Geist, system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
  .mono { font-family: 'JetBrains Mono', ui-monospace, monospace; }
  .glow77 { text-shadow: 0 0 6px #E04545cc, 0 0 18px #E0454566, 0 0 36px #E0454533; }
  @keyframes pulse77 { 0%,100% { opacity:1; transform: scale(1); } 50% { opacity:.55; transform: scale(.82); } }
  .dot-pulse { animation: pulse77 2s ease-in-out infinite; }
  .ambient { background-image:
      radial-gradient(60% 50% at 18% 12%, #8a4fff20 0%, transparent 65%),
      radial-gradient(50% 45% at 90% 88%, #D4A85820 0%, transparent 70%); }
  .grain { background-image: radial-gradient(rgba(255,255,255,0.04) 1px, transparent 1px); background-size: 3px 3px; }
  ::-webkit-scrollbar { width: 8px; height: 8px; }
  ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.08); border-radius: 4px; }
  .tab-active { color: #f5ede0 !important; background: rgba(138,79,255,0.10); border-color: rgba(138,79,255,0.40) !important; }
  .row { transition: background 120ms ease; border: 1px solid rgba(255,255,255,0.08); border-radius: 10px; padding: 16px; background: rgba(21,17,13,0.4); }
  .row:hover { background: rgba(245,237,224,0.03); }
  .field { width: 100%; background: rgba(13,10,8,0.6); border: 1px solid rgba(255,255,255,0.08); border-radius: 8px; padding: 8px 12px; color: #f5ede0; font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 12px; }
  .field:focus { border-color: rgba(138,79,255,0.5); outline: none; }
  textarea.field { font-family: Geist, system-ui, sans-serif; font-size: 13px; line-height: 1.5; resize: vertical; }
  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; height: 32px; padding: 0 14px; border-radius: 999px; border: 1px solid rgba(255,255,255,0.12); font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 11px; letter-spacing: 0.18em; text-transform: uppercase; color: rgba(245,237,224,0.7); background: transparent; cursor: pointer; transition: all 120ms ease; }
  .btn:hover { color: #f5ede0; border-color: rgba(255,255,255,0.25); background: rgba(245,237,224,0.04); }
  .btn-primary { background: rgba(138,79,255,0.15); border-color: rgba(138,79,255,0.45); color: #f5ede0; }
  .btn-primary:hover { background: rgba(138,79,255,0.25); }
  .btn-danger { color: #E04545; border-color: rgba(224,69,69,0.30); }
  .btn-danger:hover { background: rgba(224,69,69,0.10); border-color: rgba(224,69,69,0.50); }
  .lock-badge { display: inline-block; padding: 2px 8px; border-radius: 999px; background: rgba(224,69,69,0.10); border: 1px solid rgba(224,69,69,0.30); color: #E04545; font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 9px; letter-spacing: 0.12em; text-transform: uppercase; }
  .live-badge { display: inline-block; padding: 2px 8px; border-radius: 999px; background: rgba(91,168,104,0.10); border: 1px solid rgba(91,168,104,0.30); color: #5BA868; font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 9px; letter-spacing: 0.12em; text-transform: uppercase; }
  details summary { cursor: pointer; list-style: none; }
  details summary::-webkit-details-marker { display: none; }
  details[open] summary .chev { transform: rotate(90deg); }
  .chev { display: inline-block; transition: transform 120ms ease; }
  .msg-bubble { background: rgba(21,17,13,0.55); border: 1px solid rgba(255,255,255,0.06); border-radius: 10px; padding: 12px 16px; line-height: 1.55; font-size: 14px; }
  .msg-bubble.assistant { background: rgba(138,79,255,0.04); border-color: rgba(138,79,255,0.20); }
</style>
</head>

  <div class="flex items-center gap-5">
    <a href="index.html" class="flex flex-col items-start gap-1 leading-none">
      <div class="mono text-[24px] font-extrabold tracking-[-0.025em]">se<span class="text-red glow77">77</span>n<span class="text-mute font-normal"> / kata</span></div>
      <div class="mono text-[9px] uppercase tracking-kicker text-mute">tavern · roleplay</div>

  <div class="p-5 border-b border-line">
    <div class="mono text-[10px] tracking-label uppercase text-purple">tavern</div>
    <div class="text-[14px] font-medium tracking-tight text-ink mt-1">roleplay engine</div>
    <div class="mono text-[10px] text-mute mt-1">your worlds + characters</div>
  </div>
  <nav class="px-3 py-4 mono text-[11px] tracking-label uppercase">
    <a data-tab="worlds" class="block px-3 py-2 rounded-[8px] border border-transparent text-mute hover:text-ink cursor-pointer mb-1">▸ my worlds</a>

<main class="relative z-10 pt-20 pb-16 pl-[244px] pr-8">

  <div class="flex items-end justify-between gap-6 mb-6">
    <div>
      <div class="mono text-[10px] uppercase tracking-kicker text-purple mb-2">TAVERN / <span id="page-tag">WORLDS</span></div>
      <h1 class="mono text-[36px] leading-none font-extrabold tracking-[-0.035em] lowercase">tavern<span id="page-tab-label" class="text-purple font-extrabold"> · my worlds</span><span class="text-purple glow77">.</span></h1>
      <div id="page-counts" class="mono text-[11px] text-mute mt-3">—</div>
    </div>
    <div id="page-actions" class="flex items-center gap-2"></div>
  </div>

  <div id="auth-warning" class="hidden mb-6 p-5 border border-line rounded-[12px] bg-panel">
    <div class="mono text-[10px] uppercase tracking-kicker text-red mb-2">không thể tải</div>
    <div id="auth-warning-msg" class="text-[14px] text-mute">—</div>
    <a id="auth-login-btn" href="/api/auth/discord/start" class="hidden mt-4 btn">đăng nhập discord</a>
  </div>

  <div id="content"></div>
</main>

<script>
const TABS = ['worlds', 'characters', 'defaults'];
const params = new URLSearchParams(location.search);
let currentTab = TABS.includes(params.get('tab')) ? params.get('tab') : 'worlds';
let isOwner = false;
let me = null;

const elTag = document.getElementById('page-tag');
const elLabel = document.getElementById('page-tab-label');
const elBcTab = document.getElementById('bc-tab');
const elCounts = document.getElementById('page-counts');
const elContent = document.getElementById('content');
const elActions = document.getElementById('page-actions');
const elAuthWarn = document.getElementById('auth-warning');
const elAuthMsg = document.getElementById('auth-warning-msg');
const elAuthLogin = document.getElementById('auth-login-btn');
const elNavDefaults = document.getElementById('nav-defaults');

const TAB_LABEL = { worlds: 'my worlds', characters: 'characters', defaults: 'tavern defaults' };

function setTabUI() {
  document.querySelectorAll('[data-tab]').forEach(a => {
    a.classList.toggle('tab-active', a.dataset.tab === currentTab);
  });
  elTag.textContent = currentTab.toUpperCase();
  elLabel.textContent = ` · ${TAB_LABEL[currentTab] ?? currentTab}`;
  elBcTab.textContent = TAB_LABEL[currentTab] ?? currentTab;
}

function escapeHtml(s) {
  return String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
}
function fmtTime(d) {
  if (!d) return '—';
  const date = new Date(d); const diff = (Date.now() - date.getTime()) / 1000;
  if (diff < 60) return `${Math.floor(diff)}s`;
  if (diff < 3600) return `${Math.floor(diff/60)}m`;
  if (diff < 86400) return `${Math.floor(diff/3600)}h`;
  if (diff < 604800) return `${Math.floor(diff/86400)}d`;
  return date.toISOString().slice(0,10);
}
function fmtNum(n) { return Number(n ?? 0).toLocaleString(); }

async function fetchJson(url, opts = {}) {
  const init = { credentials: 'include', ...opts };
  if (init.body && typeof init.body !== 'string') {
    init.body = JSON.stringify(init.body);
    init.headers = { 'Content-Type': 'application/json', ...(init.headers || {}) };
  }
  const r = await fetch(url, init);
  let body = null;
  try { body = await r.json(); } catch {}
  if (!r.ok) {
    if (body?.error === 'unauthenticated') {
      elAuthMsg.textContent = 'Cần đăng nhập Discord để dùng tavern.';
      elAuthLogin.classList.remove('hidden');
    } else if (body?.error === 'forbidden') {
      elAuthMsg.textContent = body?.message || 'Bạn không có quyền vào trang này.';
    } else if (body?.error === 'discord_required') {
      elAuthMsg.textContent = 'Cần login bằng Discord.';
      elAuthLogin.classList.remove('hidden');
    } else {
      const det = body?.details ? ' · ' + body.details.join('; ') : '';
      elAuthMsg.textContent = (body?.message || body?.error || `lỗi ${r.status}`) + det;
    }
    elAuthWarn.classList.remove('hidden');
    return null;
  }
  return body;
}
function clearAuthWarn() {
  elAuthWarn.classList.add('hidden');
  elAuthLogin.classList.add('hidden');
}

// ── Bootstrap: detect owner & gate the defaults nav ────────────
async function bootstrap() {
  const r = await fetch('/api/kata/me', { credentials: 'include' });
  if (r.ok) {
    me = await r.json();
    isOwner = !!me?.isOwner;
    if (isOwner) elNavDefaults.classList.remove('hidden');
  }
  if (!isOwner && currentTab === 'defaults') currentTab = 'worlds';
  setTabUI();
  switchTab(currentTab);
}

function switchTab(tab) {
  currentTab = tab;
  setTabUI();
  history.replaceState(null, '', `?tab=${tab}`);
  elActions.innerHTML = '';
  if (tab === 'worlds') return renderWorlds();
  if (tab === 'characters') return renderCharacters();
  if (tab === 'defaults') return renderDefaults();
}

document.querySelectorAll('[data-tab]').forEach(a => {
  a.addEventListener('click', (e) => { e.preventDefault(); switchTab(a.dataset.tab); });
});

// ── My Worlds ─────────────────────────────────────────────────
async function renderWorlds() {
  const detailId = params.get('world');
  if (detailId) return renderWorldDetail(detailId);
  elContent.innerHTML = '<div class="mono text-[11px] text-mute">loading…</div>';
  const data = await fetchJson('/api/kata/tavern/me/worlds');
  if (!data) return;
  clearAuthWarn();
  const worlds = data.worlds ?? [];
  elCounts.textContent = `${worlds.length} world${worlds.length === 1 ? '' : 's'}`;

  if (worlds.length === 0) {
    elContent.innerHTML = `
      <div class="row text-center py-12">
        <div class="text-[14px] text-mute">Chưa có world nào.</div>
        <div class="mono text-[10px] text-mute2 mt-2">Tạo trên Discord bằng <code class="text-ink">/worldcreate</code></div>
      </div>`;
    return;
  }

  const rowsHtml = worlds.map((w) => {
    const status = w.isLocked
      ? '<span class="lock-badge">🔒 locked</span>'
      : '<span class="live-badge">▶ live</span>';
    return `
      <div class="row flex items-center gap-4 cursor-pointer" data-world-id="${escapeHtml(w._id)}">
        <div class="flex-1 min-w-0">
          <div class="flex items-center gap-3 flex-wrap">
            <div class="text-[15px] font-semibold tracking-tight">${escapeHtml(w.name)}</div>
            ${status}
            <span class="mono text-[9px] tracking-label uppercase text-mute2">${escapeHtml(w.mode)} · ${escapeHtml(w.difficulty)}</span>
          </div>
          <div class="mono text-[10px] text-mute mt-1">
            ${fmtNum(w.messageCount)} turns · last ${escapeHtml(fmtTime(w.lastActiveAt))} · guild ${escapeHtml(w.guildId)}
          </div>
        </div>
        <div class="text-right">
          <div class="mono text-[10px] tracking-label uppercase text-mute">${w.imageGenEnabled ? 'images on' : 'images off'}</div>
          <div class="mono text-[10px] text-mute">${escapeHtml(w.imageStyle || '—')}</div>
          <button class="btn mt-1">edit →</button>
        </div>
      </div>`;
  }).join('');
  elContent.innerHTML = `<div class="space-y-2">${rowsHtml}</div>`;
  elContent.querySelectorAll('[data-world-id]').forEach((el) => {
    el.addEventListener('click', () => {
      const id = el.dataset.worldId;
      params.set('world', id);
      history.replaceState(null, '', `?tab=worlds&world=${id}`);
      renderWorldDetail(id);
    });
  });
}

async function renderWorldDetail(id) {
  elContent.innerHTML = '<div class="mono text-[11px] text-mute">loading world…</div>';
  const data = await fetchJson(`/api/kata/tavern/world/${id}`);
  if (!data) return;
  clearAuthWarn();
  const w = data.world;
  elCounts.textContent = `${escapeHtml(w.name)} · ${data.messageCount} turns`;

  const ovs = w.overrides ?? {};
  function ovField(name, label, hint, big) {
    const tag = big ? 'textarea' : 'input';
    const valAttr = big ? '' : ` value="${escapeHtml(ovs[name] ?? '')}"`;
    const inner = big ? escapeHtml(ovs[name] ?? '') : '';
    const rows = big ? ' rows="6"' : '';
    return `
      <label class="block">
        <div class="mono text-[10px] tracking-label uppercase text-mute mb-1">${escapeHtml(label)}</div>
        <${tag} class="field" data-ov="${escapeHtml(name)}"${valAttr}${rows} placeholder="${escapeHtml(hint)}">${inner}</${tag}>
      </label>`;
  }

  const messagesHtml = (data.messages ?? []).map((m) => {
    const who = m.role === 'assistant' ? 'narrator' : m.role === 'user' ? 'player' : 'system';
    const ts = m.timestamp ? new Date(m.timestamp).toISOString().slice(0,19).replace('T',' ') : '';
    const klass = m.role === 'assistant' ? 'msg-bubble assistant' : 'msg-bubble';
    const img = m.imageUrl ? `<div class="mt-2"><img src="${escapeHtml(m.imageUrl)}" alt="" class="rounded-[8px] max-h-[300px]" /></div>` : '';
    return `
      <div class="${klass}">
        <div class="mono text-[9px] tracking-label uppercase text-mute2 mb-1">${who} · ${escapeHtml(ts)}</div>
        <div style="white-space: pre-wrap">${escapeHtml(m.content)}</div>
        ${img}
      </div>`;
  }).join('');

  elContent.innerHTML = `
    <div class="mb-4">
      <button id="back-to-worlds" class="btn">← back to worlds</button>
    </div>
    <div class="grid grid-cols-12 gap-4">
      <div class="col-span-7 space-y-3">
        <div class="row">
          <div class="mono text-[10px] tracking-label uppercase text-purple mb-3">world</div>
          <div class="space-y-3">
            <label class="block"><div class="mono text-[10px] tracking-label uppercase text-mute mb-1">name</div>
              <input class="field" data-w="name" value="${escapeHtml(w.name)}" maxlength="100" /></label>
            <label class="block"><div class="mono text-[10px] tracking-label uppercase text-mute mb-1">setting</div>
              <textarea class="field" data-w="setting" rows="3" maxlength="1500">${escapeHtml(w.setting ?? '')}</textarea></label>
            <label class="block"><div class="mono text-[10px] tracking-label uppercase text-mute mb-1">lore</div>
              <textarea class="field" data-w="lore" rows="8" maxlength="30000">${escapeHtml(w.lore ?? '')}</textarea></label>
            <div class="flex gap-2">
              <button class="btn" data-ai-target="lore">AI rewrite (FIX)</button>
              <button class="btn" data-ai-target="lore-gen">AI write from brief…</button>
            </div>
            <label class="block"><div class="mono text-[10px] tracking-label uppercase text-mute mb-1">rules</div>
              <textarea class="field" data-w="rules" rows="4" maxlength="1500">${escapeHtml(w.rules ?? '')}</textarea></label>
            <div class="flex gap-2">
              <button class="btn" data-ai-target="rules">AI rewrite (FIX)</button>
              <button class="btn" data-ai-target="rules-gen">AI write from brief…</button>
            </div>
            <div class="grid grid-cols-2 gap-3">
              <label class="block"><div class="mono text-[10px] tracking-label uppercase text-mute mb-1">image style</div>
                <input class="field" data-w="imageStyle" value="${escapeHtml(w.imageStyle ?? '')}" maxlength="200" /></label>
              <label class="block"><div class="mono text-[10px] tracking-label uppercase text-mute mb-1">images</div>
                <select class="field" data-w="imageGenEnabled">
                  <option value="true" ${w.imageGenEnabled ? 'selected' : ''}>on</option>
                  <option value="false" ${!w.imageGenEnabled ? 'selected' : ''}>off</option>
                </select></label>
            </div>
            <div class="grid grid-cols-2 gap-3">
              <label class="block"><div class="mono text-[10px] tracking-label uppercase text-mute mb-1">difficulty</div>
                <select class="field" data-w="difficulty">
                  ${['easy','normal','hard'].map(d => `<option value="${d}" ${w.difficulty===d?'selected':''}>${d}</option>`).join('')}
                </select></label>
              <label class="block"><div class="mono text-[10px] tracking-label uppercase text-mute mb-1">participation</div>
                <select class="field" data-w="participation">
                  ${['creator_only','anyone'].map(p => `<option value="${p}" ${w.participation===p?'selected':''}>${p}</option>`).join('')}
                </select></label>
            </div>
          </div>
          <div class="flex justify-between items-center mt-4 pt-3 border-t border-line">
            <div class="flex gap-2">
              <button id="save-world" class="btn btn-primary">save</button>
              ${!w.isLocked ? '<button id="end-world" class="btn btn-danger">/endstory</button>' : ''}
            </div>
            <div class="mono text-[10px] text-mute2">_id ${escapeHtml(w._id)}</div>
          </div>
        </div>

        <details class="row">
          <summary class="flex items-center gap-2">
            <span class="chev mono text-mute">▸</span>
            <div class="mono text-[10px] tracking-label uppercase text-purple">overrides · advanced</div>
            <span class="mono text-[9px] text-mute2 ml-auto">leave blank → use global / engine default</span>
          </summary>
          <div class="space-y-3 mt-4">
            ${ovField('storytellerSystemPrompt', 'storyteller system prompt', 'Replaces the entire novelist skeleton for this world.', true)}
            <div class="grid grid-cols-2 gap-3">
              ${ovField('modeInstructionChat', 'mode · chat', 'Instruction injected when world.mode=chat.', true)}
              ${ovField('modeInstructionRpg', 'mode · rpg', 'Instruction injected when world.mode=rpg.', true)}
            </div>
            <div class="grid grid-cols-3 gap-3">
              ${ovField('difficultyEasy', 'difficulty · easy', '', true)}
              ${ovField('difficultyNormal', 'difficulty · normal', '', true)}
              ${ovField('difficultyHard', 'difficulty · hard', '', true)}
            </div>
            ${ovField('outputRules', 'output rules', 'No-prefix / pacing rules block.', true)}
            <div class="grid grid-cols-2 gap-3">
              ${ovField('imagePromptTemplate', 'image prompt template', '{character_base}, {keywords}, {style}', false)}
              ${ovField('imageNegativePrompt', 'image negative prompt', 'low quality, deformed, ...', false)}
            </div>
            <button id="save-overrides" class="btn btn-primary">save overrides</button>
          </div>
        </details>
      </div>

      <div class="col-span-5">
        <div class="row sticky top-20" style="max-height: calc(100vh - 120px); overflow-y: auto">
          <div class="mono text-[10px] tracking-label uppercase text-purple mb-3">story log · last ${data.messages?.length ?? 0}</div>
          ${data.summary ? `<div class="row mb-3" style="background:rgba(212,168,88,0.05);border-color:rgba(212,168,88,0.20)">
            <div class="mono text-[9px] tracking-label uppercase text-gold mb-1">story so far</div>
            <div class="text-[13px] leading-relaxed">${escapeHtml(data.summary)}</div>
          </div>` : ''}
          <div class="space-y-2">${messagesHtml || '<div class="mono text-[11px] text-mute2">— story chưa bắt đầu —</div>'}</div>
        </div>
      </div>
    </div>`;

  document.getElementById('back-to-worlds').addEventListener('click', () => {
    params.delete('world');
    history.replaceState(null, '', '?tab=worlds');
    renderWorlds();
  });

  document.getElementById('save-world').addEventListener('click', async () => {
    const body = {};
    elContent.querySelectorAll('[data-w]').forEach((el) => {
      const k = el.dataset.w;
      let v = el.value;
      if (k === 'imageGenEnabled') v = v === 'true';
      body[k] = v;
    });
    const r = await fetchJson(`/api/kata/tavern/world/${id}`, { method: 'PATCH', body });
    if (r) flash('saved');
  });

  document.getElementById('save-overrides').addEventListener('click', async () => {
    const overrides = {};
    elContent.querySelectorAll('[data-ov]').forEach((el) => {
      const k = el.dataset.ov; const v = el.value;
      if (v && v.trim()) overrides[k] = v;
    });
    const r = await fetchJson(`/api/kata/tavern/world/${id}`, { method: 'PATCH', body: { overrides } });
    if (r) flash('overrides saved');
  });

  const endBtn = document.getElementById('end-world');
  if (endBtn) endBtn.addEventListener('click', async () => {
    if (!confirm('Lock world này? Story persist vĩnh viễn nhưng bot sẽ không reply nữa.')) return;
    const r = await fetchJson(`/api/kata/tavern/world/${id}/end`, { method: 'POST' });
    if (r) renderWorldDetail(id);
  });

  // AI rewrite buttons (FIX = improve current text; gen = brief → write)
  elContent.querySelectorAll('[data-ai-target]').forEach((btn) => {
    btn.addEventListener('click', async () => {
      const target = btn.dataset.aiTarget;
      const isGen = target.endsWith('-gen');
      const kind = target.startsWith('rules') ? 'rules' : 'lore';
      const ta = elContent.querySelector(`[data-w="${kind}"]`);
      if (isGen) {
        const brief = prompt(`Brief cho ${kind} (1-3 câu mô tả):`);
        if (!brief) return;
        btn.textContent = 'thinking…'; btn.disabled = true;
        const r = await fetchJson('/api/kata/tavern/lore/generate', {
          method: 'POST',
          body: { brief, kind, mode: w.mode, difficulty: w.difficulty },
        });
        btn.textContent = 'AI write from brief…'; btn.disabled = false;
        if (r?.text) ta.value = r.text;
      } else {
        const draft = ta.value.trim();
        if (!draft) { alert('Field rỗng — không có gì để FIX.'); return; }
        btn.textContent = 'thinking…'; btn.disabled = true;
        const r = await fetchJson('/api/kata/tavern/lore/improve', {
          method: 'POST',
          body: { draft, kind },
        });
        btn.textContent = 'AI rewrite (FIX)'; btn.disabled = false;
        if (r?.text) ta.value = r.text;
      }
    });
  });
}

// ── Characters ───────────────────────────────────────────────
async function renderCharacters() {
  elContent.innerHTML = '<div class="mono text-[11px] text-mute">loading…</div>';
  const data = await fetchJson('/api/kata/tavern/character');
  if (!data) return;
  clearAuthWarn();
  const chars = data.characters ?? [];
  elCounts.textContent = `${chars.length} character${chars.length === 1 ? '' : 's'}`;

  elActions.innerHTML = '<button id="char-new" class="btn btn-primary">+ new</button>';
  document.getElementById('char-new').addEventListener('click', () => openCharForm(null));

  if (chars.length === 0) {
    elContent.innerHTML = `
      <div class="row text-center py-12">
        <div class="text-[14px] text-mute">Chưa có character nào.</div>
        <div class="mono text-[10px] text-mute2 mt-2">Hoặc tạo trên Discord bằng <code class="text-ink">/charcreate</code></div>
      </div>`;
    return;
  }

  const rowsHtml = chars.map((c) => `
    <div class="row flex items-start gap-4">
      <div class="flex-1 min-w-0">
        <div class="text-[15px] font-semibold tracking-tight">${escapeHtml(c.name)}</div>
        ${c.appearance ? `<div class="text-[12px] text-mute mt-1 truncate-2">${escapeHtml(c.appearance)}</div>` : ''}
        ${c.imageBasePrompt ? `<div class="mono text-[10px] text-mute2 mt-1 truncate">img base: ${escapeHtml(c.imageBasePrompt)}</div>` : ''}
      </div>
      <div class="flex flex-col gap-1">
        <button class="btn" data-char-edit="${escapeHtml(c._id)}">edit</button>
        <button class="btn btn-danger" data-char-del="${escapeHtml(c._id)}">delete</button>
      </div>
    </div>`).join('');
  elContent.innerHTML = `<div class="space-y-2">${rowsHtml}</div>`;

  elContent.querySelectorAll('[data-char-edit]').forEach((b) => {
    b.addEventListener('click', () => {
      const c = chars.find((x) => x._id === b.dataset.charEdit);
      openCharForm(c);
    });
  });
  elContent.querySelectorAll('[data-char-del]').forEach((b) => {
    b.addEventListener('click', async () => {
      if (!confirm('Xoá character?')) return;
      const r = await fetchJson(`/api/kata/tavern/character/${b.dataset.charDel}`, { method: 'DELETE' });
      if (r) renderCharacters();
    });
  });
}

function openCharForm(existing) {
  const isEdit = !!existing;
  const c = existing || { name: '', persona: '', appearance: '', greeting: '', imageBasePrompt: '' };
  elContent.innerHTML = `
    <div class="row max-w-2xl">
      <div class="mono text-[10px] tracking-label uppercase text-purple mb-3">${isEdit ? 'edit character' : 'new character'}</div>
      <div class="space-y-3">
        <label class="block"><div class="mono text-[10px] tracking-label uppercase text-mute mb-1">name *</div>
          <input class="field" data-c="name" value="${escapeHtml(c.name)}" maxlength="100" /></label>
        <label class="block"><div class="mono text-[10px] tracking-label uppercase text-mute mb-1">persona</div>
          <textarea class="field" data-c="persona" rows="3" maxlength="1500">${escapeHtml(c.persona ?? '')}</textarea></label>
        <label class="block"><div class="mono text-[10px] tracking-label uppercase text-mute mb-1">appearance</div>
          <textarea class="field" data-c="appearance" rows="3" maxlength="1500">${escapeHtml(c.appearance ?? '')}</textarea></label>
        <label class="block"><div class="mono text-[10px] tracking-label uppercase text-mute mb-1">greeting (chat mode)</div>
          <textarea class="field" data-c="greeting" rows="2" maxlength="600">${escapeHtml(c.greeting ?? '')}</textarea></label>
        <label class="block"><div class="mono text-[10px] tracking-label uppercase text-mute mb-1">image base prompt</div>
          <textarea class="field" data-c="imageBasePrompt" rows="2" maxlength="600" placeholder="1girl, pink hair, school uniform, anime style, detailed">${escapeHtml(c.imageBasePrompt ?? '')}</textarea></label>
      </div>
      <div class="flex justify-between items-center mt-4 pt-3 border-t border-line">
        <button id="char-cancel" class="btn">cancel</button>
        <button id="char-save" class="btn btn-primary">${isEdit ? 'save' : 'create'}</button>
      </div>
    </div>`;
  document.getElementById('char-cancel').addEventListener('click', renderCharacters);
  document.getElementById('char-save').addEventListener('click', async () => {
    const body = {};
    elContent.querySelectorAll('[data-c]').forEach((el) => { body[el.dataset.c] = el.value; });
    if (!body.name?.trim()) return alert('Name bắt buộc');
    const url = isEdit ? `/api/kata/tavern/character/${existing._id}` : '/api/kata/tavern/character';
    const method = isEdit ? 'PATCH' : 'POST';
    const r = await fetchJson(url, { method, body });
    if (r) renderCharacters();
  });
}

// ── Tavern Defaults (owner-only) ─────────────────────────────
async function renderDefaults() {
  if (!isOwner) {
    elContent.innerHTML = '<div class="row text-mute">Owner only.</div>';
    return;
  }
  elContent.innerHTML = '<div class="mono text-[11px] text-mute">loading…</div>';
  const data = await fetchJson('/api/kata/admin/tavern-config');
  if (!data) return;
  clearAuthWarn();
  const t = data.tavern ?? {};
  elCounts.textContent = 'global tavern defaults · áp dụng cho mọi world (per-world override vẫn thắng)';

  function fld(name, label, hint, big) {
    const tag = big ? 'textarea' : 'input';
    const valAttr = big ? '' : ` value="${escapeHtml(t[name] ?? '')}"`;
    const inner = big ? escapeHtml(t[name] ?? '') : '';
    const rows = big ? ' rows="8"' : '';
    return `
      <label class="block">
        <div class="flex items-center justify-between mb-1">
          <div class="mono text-[10px] tracking-label uppercase text-mute">${escapeHtml(label)}</div>
          <span class="mono text-[9px] text-mute2">${escapeHtml(hint)}</span>
        </div>
        <${tag} class="field" data-t="${escapeHtml(name)}"${valAttr}${rows}>${inner}</${tag}>
      </label>`;
  }

  elContent.innerHTML = `
    <div class="row max-w-4xl space-y-4">
      <div class="mono text-[11px] text-mute">
        Bỏ trống / xoá rỗng → field đó rơi xuống engine code default. Per-world override luôn thắng. Mọi roleplay turn dùng giá trị resolved này.
      </div>
      ${fld('storytellerSystemPrompt', 'storyteller system prompt', 'thay nguyên skeleton novelist', true)}
      <div class="grid grid-cols-2 gap-3">
        ${fld('modeInstructionChat', 'mode · chat', '', true)}
        ${fld('modeInstructionRpg', 'mode · rpg', '', true)}
      </div>
      <div class="grid grid-cols-3 gap-3">
        ${fld('difficultyEasy', 'difficulty · easy', '', true)}
        ${fld('difficultyNormal', 'difficulty · normal', '', true)}
        ${fld('difficultyHard', 'difficulty · hard', '', true)}
      </div>
      ${fld('outputRules', 'output rules', 'no-prefix, pacing, length...', true)}
      <div class="grid grid-cols-2 gap-3">
        ${fld('imagePromptTemplate', 'image prompt template', '{character_base}, {keywords}, {style}', false)}
        ${fld('imageNegativePrompt', 'image negative prompt', 'low quality, blurry...', false)}
      </div>
      <div class="flex justify-end pt-3 border-t border-line">
        <button id="defaults-save" class="btn btn-primary">save defaults</button>
      </div>
    </div>`;

  document.getElementById('defaults-save').addEventListener('click', async () => {
    const body = {};
    elContent.querySelectorAll('[data-t]').forEach((el) => {
      // Empty string → null sentinel = unset on server (drop back to engine default).
      const v = el.value;
      body[el.dataset.t] = v.trim() ? v : null;
    });
    const r = await fetchJson('/api/kata/admin/tavern-config', { method: 'PATCH', body });
    if (r) flash('defaults saved');
  });
}

function flash(msg) {
  const el = document.createElement('div');
  el.textContent = msg;
  el.style.cssText = 'position:fixed;bottom:24px;right:24px;background:rgba(138,79,255,0.20);border:1px solid rgba(138,79,255,0.45);color:#f5ede0;padding:10px 16px;border-radius:999px;font-family:JetBrains Mono,monospace;font-size:11px;letter-spacing:0.18em;text-transform:uppercase;z-index:100';
  document.body.appendChild(el);
  setTimeout(() => el.remove(), 2200);
}

bootstrap();
</script>
