<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8" />

<title>tavern · katas</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700;800&family=Pixelify+Sans:wght@500;700&family=Silkscreen:wght@400;700&family=VT323&display=swap" rel="stylesheet" />
<script src="https://cdn.tailwindcss.com"></script>
<script>
  // B · Pixel Lobby palette: colour channels come from _shell.js (light + dark).
  tailwind.config = { theme: { extend: {
    colors: {
      bg:'rgb(var(--c-bg) / <alpha-value>)', panel:'rgb(var(--c-panel) / <alpha-value>)', panel2:'rgb(var(--c-panel2) / <alpha-value>)',
      ink:'rgb(var(--c-ink) / <alpha-value>)', red:'rgb(var(--c-red) / <alpha-value>)', green:'rgb(var(--c-green) / <alpha-value>)',
      gold:'rgb(var(--c-gold) / <alpha-value>)', info:'rgb(var(--c-info) / <alpha-value>)', warn:'rgb(var(--c-warn) / <alpha-value>)',
      err:'rgb(var(--c-err) / <alpha-value>)', purple:'rgb(var(--c-purple) / <alpha-value>)',
      line:'var(--c-line)', line2:'var(--c-line2)', mute:'var(--c-mute)', mute2:'var(--c-mute2)',
    },
    fontFamily: { sans:['"JetBrains Mono"','ui-monospace','monospace'], mono:['"JetBrains Mono"','ui-monospace','monospace'], pixel:['"Pixelify Sans"','monospace'], sk:['Silkscreen','monospace'] },
    letterSpacing: { kicker:'0.22em', label:'0.18em', tag:'0.12em' },
  }}};
</script>
<style>
  /* tavern · B · Pixel Lobby chrome over the tavern's own nebula scene (#bg).
     Palette, fonts and the k-* kit come from _shell.js; the scene canvas and
     world cover art stay as they are. */
  :root { --ring4: 0 -4px 0 0 var(--ink),0 4px 0 0 var(--ink),-4px 0 0 0 var(--ink),4px 0 0 0 var(--ink);
          --ring3: 0 -3px 0 0 var(--ink),0 3px 0 0 var(--ink),-3px 0 0 0 var(--ink),3px 0 0 0 var(--ink);
          --tv-panel: color-mix(in srgb, var(--paper) 94%, transparent); --tv-well: var(--field); }
  [data-theme="dark"] { --tv-panel: color-mix(in srgb, var(--paper) 86%, transparent); }
  .sk, .set-flabel .l, .set-sec-h, .rv-kicker, .rv-bh, .rv-rl, .rv-sl, .chain-prov, .rv-rp { font-family: var(--k-sk); font-size-adjust: var(--k-fsa); font-weight: 700; letter-spacing: .03em; text-transform: uppercase; }
  @keyframes cardIn { from { transform: translateY(14px); opacity: 0; } to { transform: none; opacity: 1; } }

  .tab-active { color: var(--strip-text) !important; background: var(--strip) !important; }
  .row { padding: 18px; background: var(--tv-panel); box-shadow: var(--ring3), 6px 7px 0 3px var(--shadow); }
  .row:hover { background: var(--paper); }
  .field { width: 100%; padding: 9px 12px; font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 13px; color: var(--text); background: var(--tv-well); border: 0; box-shadow: var(--ring3); }
  .field:focus { outline: none; background: var(--paper); box-shadow: 0 -3px 0 0 #e04545,0 3px 0 0 #e04545,-3px 0 0 0 #e04545,3px 0 0 0 #e04545; }
  textarea.field { font-size: 13px; line-height: 1.55; resize: vertical; }

  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; height: 36px; padding: 0 14px; border: 0; cursor: pointer; text-decoration: none;
    font-family: var(--k-sk); font-size-adjust: var(--k-fsa); font-size: 11px; font-weight: 700; letter-spacing: .03em; text-transform: uppercase; color: var(--text); background: var(--paper);
    box-shadow: var(--ring3), 4px 5px 0 3px var(--ink); transition: transform 60ms, box-shadow 60ms; }
  .btn:hover { transform: translate(-1px,-1px); }
  .btn:active { transform: translate(4px,5px); box-shadow: var(--ring3); }
  .btn:disabled { opacity: .45; cursor: not-allowed; transform: none; }
  .btn-primary { color: #1b1410; background: #b9a2ff; }
  .btn-danger { color: #1b1410; background: #ff7a7a; }
  .lock-badge, .live-badge { display: inline-flex; align-items: center; gap: 5px; padding: 3px 8px; font-family: var(--k-sk); font-size-adjust: var(--k-fsa); font-size: 10px; font-weight: 700; text-transform: uppercase; color: #1b1410; box-shadow: 0 0 0 2px var(--ink); }
  .lock-badge { background: #ff7a7a; }
  .live-badge { background: #7fd18b; }

  /* worlds landing */
  .wcard { background: var(--tv-panel) !important; border: 0 !important; box-shadow: var(--ring4), 10px 10px 0 4px var(--shadow) !important; transition: transform .1s steps(2); animation-timing-function: steps(4) !important; }
  .wcard:hover { transform: translate(-3px,-4px); }
  .wcard-world > div:first-child { border-right: 4px solid var(--ink); }
  .wcard .mono[style*="border-radius:99px"] { border: 0 !important; color: #1b1410 !important; background: #b9a2ff !important; box-shadow: 0 0 0 2px var(--ink); font-family: var(--k-sk); font-size-adjust: var(--k-fsa); font-size: 10px !important; }
  .wcover { transition: transform .3s steps(4); }
  .wcard:hover .wcover { transform: scale(1.04); }
  .createtile { border: 3px dashed var(--ink) !important; background: var(--tv-panel) !important; transition: transform .1s steps(2); }
  .createtile:hover { transform: translate(-3px,-4px); background: var(--paper) !important; }
  .wcard span[title="world locked"] { gap: 6px; }
  .createtile > span:first-child { background: #b9a2ff !important; color: #1b1410 !important; box-shadow: var(--ring3) !important; font-weight: 700; }
  .createtile .mono[style*="color:#a87aff"] { font-family: var(--k-sk); font-size-adjust: var(--k-fsa); }
  .pbtn { border: 0 !important; color: #1b1410 !important; background: #b9a2ff !important; box-shadow: var(--ring3), 4px 5px 0 3px var(--ink) !important; font-family: var(--k-sk) !important; font-size-adjust: var(--k-fsa); transition: transform 60ms, box-shadow 60ms; }
  .pbtn:hover { transform: translate(-1px,-1px); }
  .pbtn:active { transform: translate(4px,5px); box-shadow: var(--ring3) !important; }
  .gbtn { border: 0 !important; color: var(--text) !important; background: var(--paper) !important; box-shadow: var(--ring3), 4px 5px 0 3px var(--ink) !important; font-family: var(--k-sk) !important; font-size-adjust: var(--k-fsa); transition: transform 60ms, box-shadow 60ms; }
  .gbtn:hover { transform: translate(-1px,-1px); }
  .gbtn:active { transform: translate(4px,5px); box-shadow: var(--ring3) !important; }
  details summary { cursor: pointer; list-style: none; }
  details summary::-webkit-details-marker { display: none; }
  details[open] summary .chev { transform: rotate(90deg); }
  .chev { display: inline-block; transition: transform .1s steps(2); }
  .msg-bubble { padding: 12px 16px; font-size: 14px; line-height: 1.55; color: var(--text); background: var(--paper-2); box-shadow: 0 0 0 2px var(--rule); }
  .msg-bubble.assistant { background: var(--paper); box-shadow: 0 0 0 2px #b9a2ff; }

  /* Tavern Setting (owner) — two-column editor + live resolved rail */
  .set-grid { display: grid; grid-template-columns: minmax(0,1fr) 380px; gap: 36px; align-items: start; }
  .set-main { display: flex; flex-direction: column; gap: 32px; }
  .set-card { padding: 24px; background: var(--tv-panel); box-shadow: var(--ring4), 10px 10px 0 4px var(--shadow); }
  .set-segnav { display: flex; gap: 12px; padding: 12px; background: var(--tv-panel); box-shadow: var(--ring4); }
  .segtab { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 12px 8px; border: 0; cursor: pointer; font-family: inherit; color: var(--text); background: var(--paper); box-shadow: var(--ring3); transition: background .08s steps(2); }
  .segtab:hover { background: var(--paper-2); }
  .segtab .ico { font-size: 17px; line-height: 1; }
  .segtab .lbl { display: flex; align-items: center; gap: 6px; font-family: var(--k-sk); font-size-adjust: var(--k-fsa); font-size: 10px; font-weight: 700; letter-spacing: .03em; text-transform: uppercase; }
  .segtab .dot { width: 6px; height: 6px; background: transparent; }
  .segtab .dot.cust { background: #ffd25e; box-shadow: 0 0 0 1px var(--ink); }
  .segtab.on { color: #1b1410; background: #b9a2ff; }
  .set-panel { display: none; animation: k-rise .2s steps(3); }
  .set-panel.on { display: block; }
  .set-panel.set-panel-imagery.on { display: flex; flex-direction: column; gap: 32px; }
  .set-narr-head { display: flex; align-items: center; gap: 13px; margin-bottom: 18px; }
  .set-narr-ico { width: 40px; height: 40px; display: grid; place-items: center; flex: none; font-size: 16px; color: #1b1410; background: #b9a2ff; box-shadow: var(--ring3); }
  .set-narr-t { font-family: var(--k-pf); font-size-adjust: var(--k-fsa); font-size: 20px; font-weight: 700; }
  .set-narr-s { margin-top: 3px; font-size: 11px; color: var(--muted); }
  .set-sec { display: flex; align-items: center; gap: 11px; margin-bottom: 18px; }
  .set-num { flex: 0 0 auto; width: 26px; height: 26px; display: grid; place-items: center; font-family: var(--k-sk); font-size-adjust: var(--k-fsa); font-size: 11px; color: #1b1410; background: #b9a2ff; box-shadow: 0 0 0 2px var(--ink); }
  .set-sec-h { font-size: 12px; color: var(--text); }
  .set-rule { height: 0; margin: 22px 0; border-top: 3px dashed var(--rule); }
  .set-grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; }
  .set-grid3 { display: grid; grid-template-columns: repeat(3,1fr); gap: 16px; }
  .set-flabel { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; margin-bottom: 9px; }
  .set-flabel .l { font-size: 10px; color: var(--muted); }
  .set-flabel .h { font-size: 10px; color: var(--muted); text-align: right; }

  /* model trigger reuses .field; just add affordance */
  .mp-trigger { cursor: pointer; }
  .mp-trigger:hover { background: var(--paper); }

  /* image fallback chain builder */
  .chain { display: flex; flex-direction: column; gap: 12px; padding: 3px; }
  .chain-row { display: flex; align-items: center; gap: 10px; padding: 9px 11px; background: var(--paper-2); box-shadow: var(--ring3); }
  .chain-rank { flex: 0 0 auto; width: 22px; height: 22px; display: grid; place-items: center; font-family: var(--k-sk); font-size-adjust: var(--k-fsa); font-size: 10px; color: #1b1410; background: #b9a2ff; box-shadow: 0 0 0 2px var(--ink); }
  .chain-model { flex: 1; min-width: 0; font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--text); }
  .chain-prov { flex: 0 0 auto; font-size: 9px; color: var(--text); padding: 3px 6px; background: var(--paper); box-shadow: 0 0 0 2px var(--ink); }
  .chain-ctl { flex: 0 0 auto; display: flex; gap: 4px; }
  .chain-ctl button { width: 26px; height: 26px; display: grid; place-items: center; font-size: 12px; color: var(--text); border: 0; background: var(--paper); box-shadow: 0 0 0 2px var(--ink); cursor: pointer; }
  .chain-ctl button:hover { background: #b9a2ff; color: #1b1410; }
  .chain-ctl button:disabled { opacity: 0.3; cursor: default; }
  .chain-ctl .x:hover { background: #ff7a7a; }
  .chain-empty { padding: 11px 13px; font-size: 11px; color: var(--muted); border: 3px dashed var(--rule); }
  .chain-add { display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%; padding: 10px; margin-top: 2px; cursor: pointer;
    font-family: var(--k-sk); font-size-adjust: var(--k-fsa); font-size: 11px; font-weight: 700; color: var(--text); background: transparent; border: 3px dashed var(--ink); }
  .chain-add:hover { background: #b9a2ff; color: #1b1410; border-style: solid; }

  /* live resolved preview rail */
  .resolved { position: sticky; top: calc(var(--kh) + 24px); display: flex; flex-direction: column; gap: 16px; max-height: calc(100vh - var(--kh) - 48px); overflow-y: auto; padding: 20px; background: var(--tv-panel); box-shadow: var(--ring4), 10px 10px 0 4px var(--shadow); }
  .rv-head { display: flex; flex-direction: column; gap: 4px; padding-bottom: 12px; border-bottom: 3px solid var(--ink); }
  .rv-kicker { font-size: 10px; color: var(--k-purple); }
  .rv-title { font-family: var(--k-pf); font-size-adjust: var(--k-fsa); font-size: 18px; font-weight: 700; color: var(--text); }
  .rv-block { display: flex; flex-direction: column; gap: 8px; }
  .rv-bh { display: flex; justify-content: space-between; align-items: center; font-size: 10px; color: var(--muted); }
  .rv-bh .c { color: var(--k-purple); }
  .rv-prompt { margin: 0; max-height: 140px; overflow-y: auto; padding: 10px 12px; font-size: 12.5px; line-height: 1.55; white-space: pre-wrap; color: #fffaf0; background: #1b1410; border-left: 4px solid #b9a2ff; }
  .rv-empty { margin: 0; padding: 10px 12px; font-size: 11px; color: var(--muted); border: 3px dashed var(--rule); }
  .rv-route { display: flex; flex-direction: column; gap: 8px; }
  .rv-rrow { display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 4px 10px; padding: 8px 11px; background: var(--paper-2); box-shadow: 0 0 0 2px var(--rule); }
  .rv-rl { grid-column: 1; font-size: 9px; color: var(--muted); }
  .rv-rv { grid-column: 1; font-size: 11.5px; color: var(--text); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .rv-rp { grid-row: 1/3; grid-column: 2; align-self: center; font-size: 9px; color: var(--text); padding: 3px 6px; box-shadow: 0 0 0 2px var(--ink); }
  .rv-chain { display: flex; flex-direction: column; gap: 6px; }
  .rv-cnode { display: flex; align-items: center; gap: 8px; padding: 6px 10px; font-size: 11px; color: var(--text); background: var(--paper-2); box-shadow: 0 0 0 2px var(--rule); }
  .rv-cnode b { flex: 0 0 auto; width: 18px; height: 18px; display: grid; place-items: center; font-size: 9px; color: #1b1410; background: #b9a2ff; }
  .rv-cnode .m { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .rv-stats { display: grid; grid-template-columns: repeat(3,1fr); gap: 8px; padding-top: 14px; border-top: 3px dashed var(--rule); }
  .rv-stat { display: flex; flex-direction: column; gap: 4px; }
  .rv-sv { font-family: var(--k-pf); font-size-adjust: var(--k-fsa); font-size: 22px; font-weight: 700; color: var(--text); line-height: 1; }
  .rv-sl { font-size: 9px; color: var(--muted); }
  .set-savebar { position: sticky; bottom: 12px; display: flex; align-items: center; justify-content: space-between; gap: 14px; padding: 14px 18px; background: var(--paper); box-shadow: var(--ring4), 6px 7px 0 3px var(--shadow); }
  .set-savenote { font-size: 11px; color: var(--muted); }

  @media (max-width: 1180px) {
    .set-grid { grid-template-columns: 1fr; }
    .resolved { position: static; max-height: none; }
  }

  /* ── Mobile (≤768px): sidebar becomes a slide-in drawer, content goes single-column ── */
  #nav-toggle { display: none; }
  #nav-scrim { display: none; }
  @media (max-width: 768px) {
    #hdr-breadcrumb { display: none; }
    #nav-toggle { display: inline-grid; place-items: center; width: 36px; height: 36px; }
    body > aside.fixed {
      top: var(--kh) !important; left: 0 !important; bottom: 0 !important;
      transform: translateX(-110%);
      transition: transform 200ms steps(5);
      width: 280px !important; max-width: 86vw;
    }
    body.nav-open aside { transform: none; }
    #nav-scrim { position: fixed; inset: 0; z-index: 39; background: rgba(27,20,16,0.55); }
    body.nav-open #nav-scrim { display: block; }
    main { padding-left: 16px !important; padding-right: 16px !important; }
    /* title + page action stack instead of overflowing off-screen */
    main > .flex.items-end { flex-direction: column; align-items: flex-start; gap: 12px; }
    /* every 2/3/12-col grid collapses to one column */
    main .grid { grid-template-columns: 1fr !important; }
    .set-grid2, .set-grid3 { grid-template-columns: 1fr; }
    /* world cards stack: cover on top (fixed height), content below */
    .wcard-world { flex-direction: column; }
    .wcard-world > div:last-child > div:first-child { flex-wrap: wrap; }
    .wcard-world > div:last-child > div:first-child > span[style*="flex:1"] { display: none; }
    .wcard-world > div:first-child { width: 100% !important; height: 150px; align-self: auto !important; border-right: 0; border-bottom: 4px solid var(--ink); }
    /* story log unsticks + uncaps so it flows under the editor instead of overlapping */
    .row.sticky { position: static !important; max-height: none !important; }
  }
</style>
</head>
<body class="bg-bg text-ink min-h-screen overflow-x-hidden">
<script src="_strings.js"></script>

<script>
const TABS = ['worlds', 'characters', 'defaults'];
const params = new URLSearchParams(location.search);
let currentTab = TABS.includes(params.get('tab')) ? params.get('tab') : 'worlds';
let isOwner = false;
let me = null;
const WORLD_DETAIL_LIMIT = 80;
const PLAY_WORLD_LIMIT = 120;
let worldsCache = null;
let worldsPromise = null;
let worldsPromiseSilent = false;
let characterCache = null;
let characterPromise = null;
let characterPromiseSilent = false;
let worldDetailSeq = 0;
const worldPreviewCache = new Map();
const worldDetailCache = new Map();

const elTag = document.getElementById('page-tag');
const elLabel = document.getElementById('page-tab-label');
const elBcTab = document.getElementById('bc-tab');
const elCounts = document.getElementById('page-counts');
const elContent = document.getElementById('content');
const elActions = document.getElementById('page-actions');
const elAuthWarn = document.getElementById('auth-warning');
const elAuthMsg = document.getElementById('auth-warning-msg');
const elAuthLogin = document.getElementById('auth-login-btn');
const elNavDefaults = document.getElementById('nav-defaults');

const TAB_LABEL = { worlds: 'my worlds', characters: 'characters', defaults: 'tavern setting' };

// Sidebar nav — built dynamically so the active state + live counts (worlds /
// characters) can repaint without reflowing the layout.
const NAV_ITEMS = [
  { id: 'worlds', icon: '◳', label: 'my worlds', countKey: 'worlds' },
  { id: 'characters', icon: '☻', label: 'characters', countKey: 'characters' },
  { id: 'defaults', icon: '⚙', label: 'tavern setting', owner: true },
];
const navCounts = { worlds: null, characters: null };

function renderNav() {
  const navEl = document.getElementById('tav-nav');
  if (!navEl) return;
  navEl.innerHTML = NAV_ITEMS.map((n) => {
    const on = currentTab === n.id;
    const count = n.countKey ? navCounts[n.countKey] : null;
    const bg = on ? 'linear-gradient(135deg, rgba(138,79,255,0.9), rgba(95,51,184,0.85))' : 'transparent';
    const color = on ? '#ffffff' : 'rgba(245,237,224,0.5)';
    const iconColor = on ? '#ffffff' : 'rgba(245,237,224,0.4)';
    const border = on ? 'rgba(138,79,255,0.5)' : 'transparent';
    const shadow = on ? '0 10px 24px rgba(138,79,255,0.4)' : 'none';
    const countColor = on ? '#ffffff' : 'rgba(245,237,224,0.55)';
    const countBg = on ? 'rgba(255,255,255,0.2)' : 'rgba(255,255,255,0.07)';
    return `<a data-tab="${n.id}" class="navitem mono${on ? ' on' : ''}"${on ? ' aria-current="page"' : ''} style="display:flex;align-items:center;gap:11px;padding:12px 13px;border-radius:11px;font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;font-weight:800;cursor:pointer;background:${bg};color:${color};border:1px solid ${border};box-shadow:${shadow}">
      <span style="font-size:15px;line-height:1;color:${iconColor}">${n.icon}</span>
      <span style="flex:1">${escapeHtml(n.label)}</span>
      ${count != null ? `<span style="font-size:10px;font-weight:800;color:${countColor};background:${countBg};border-radius:99px;min-width:20px;text-align:center;padding:2px 7px">${count}</span>` : ''}
      ${n.owner ? '<span style="font-size:8px;font-weight:800;letter-spacing:.1em;color:#D4A858;border:1px solid rgba(212,168,88,0.35);border-radius:99px;padding:2px 6px">OWNER</span>' : ''}
    </a>`;
  }).join('');
}

function setTabUI() {
  renderNav();
  elTag.textContent = currentTab.toUpperCase();
  elLabel.textContent = ` · ${TAB_LABEL[currentTab] ?? currentTab}`;
  elBcTab.textContent = TAB_LABEL[currentTab] ?? currentTab;

// Seed nav badge counts without tripping the auth warning (silent fetch).
async function seedNavCounts() {
  const [w, c] = await Promise.all([
    fetchWorldsCached({ silent: true }),
    fetchCharactersCached({ silent: true }),
  ]);
  if (Array.isArray(w?.worlds)) navCounts.worlds = w.worlds.length;
  if (Array.isArray(c?.characters)) navCounts.characters = c.characters.length;
  renderNav();
}

function escapeHtml(s) {
  return String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
}
function fmtTime(d) {
  if (!d) return '—';
  const date = new Date(d); const diff = (Date.now() - date.getTime()) / 1000;
  if (diff < 60) return `${Math.floor(diff)}s`;
  if (diff < 3600) return `${Math.floor(diff/60)}m`;
  if (diff < 86400) return `${Math.floor(diff/3600)}h`;
  if (diff < 604800) return `${Math.floor(diff/86400)}d`;
  return date.toISOString().slice(0,10);
}
function fmtNum(n) { return Number(n ?? 0).toLocaleString(); }

async function fetchJson(url, opts = {}) {
  const init = { credentials: 'include', ...opts };
  if (init.body && typeof init.body !== 'string') {
    init.body = JSON.stringify(init.body);
    init.headers = { 'Content-Type': 'application/json', ...(init.headers || {}) };
  }
  const r = await fetch(url, init);
  let body = null;
  try { body = await r.json(); } catch {}
  if (!r.ok) {
    if (body?.error === 'unauthenticated') {
      elAuthMsg.textContent = 'Cần đăng nhập Discord để dùng tavern.';
      elAuthLogin.classList.remove('hidden');
    } else if (body?.error === 'forbidden') {
      elAuthMsg.textContent = body?.message || 'Bạn không có quyền vào trang này.';
    } else if (body?.error === 'discord_required') {
      elAuthMsg.textContent = 'Cần login bằng Discord.';
      elAuthLogin.classList.remove('hidden');
    } else {
      const det = body?.details ? ' · ' + body.details.join('; ') : '';
      elAuthMsg.textContent = (body?.message || body?.error || `lỗi ${r.status}`) + det;
    }
    elAuthWarn.classList.remove('hidden');
    return null;
  }
  return body;
}

async function fetchJsonQuiet(url) {
  const r = await fetch(url, { credentials: 'include' });
  if (!r.ok) return null;
  try { return await r.json(); } catch { return null; }
}

function worldSnapshotKey(id) {
  return `kata.tavern.world.${id}`;
}

function rememberWorldSnapshot(id, data, full = false) {
  try {
    sessionStorage.setItem(worldSnapshotKey(id), JSON.stringify({ ts: Date.now(), full, data }));
  } catch {}
}

function rememberWorldPreview(w) {
  const id = String(w?._id || '');
  if (!id) return;
  worldPreviewCache.set(id, w);
  rememberWorldSnapshot(id, { world: w, messages: [], messageCount: w.messageCount ?? 0 }, false);
}

function invalidateWorldCaches(id) {
  const sid = String(id || '');
  worldsCache = null;
  worldsPromise = null;
  worldPreviewCache.delete(sid);
  for (const key of worldDetailCache.keys()) {
    if (key.startsWith(`${sid}:`)) worldDetailCache.delete(key);
  }
  try { sessionStorage.removeItem(worldSnapshotKey(sid)); } catch {}
}

function invalidateCharacterCache() {
  characterCache = null;
  characterPromise = null;
}

async function fetchWorldsCached({ silent = false, force = false } = {}) {
  if (!force && worldsCache) return worldsCache;
  if (!force && worldsPromise && (silent || !worldsPromiseSilent)) return worldsPromise;
  worldsPromiseSilent = silent;
  const loader = silent ? fetchJsonQuiet : fetchJson;
  worldsPromise = loader('/api/kata/tavern/me/worlds').then((data) => {
    if (Array.isArray(data?.worlds)) {
      worldsCache = data;
      data.worlds.forEach(rememberWorldPreview);
    }
    return data;
  }).finally(() => { worldsPromise = null; });
  return worldsPromise;
}

async function fetchCharactersCached({ silent = false, force = false } = {}) {
  if (!force && characterCache) return characterCache;
  if (!force && characterPromise && (silent || !characterPromiseSilent)) return characterPromise;
  characterPromiseSilent = silent;
  const loader = silent ? fetchJsonQuiet : fetchJson;
  characterPromise = loader('/api/kata/tavern/character').then((data) => {
    if (Array.isArray(data?.characters)) characterCache = data;
    return data;
  }).finally(() => { characterPromise = null; });
  return characterPromise;
}

async function fetchWorldDetailCached(id, { limit = WORLD_DETAIL_LIMIT, silent = false, force = false } = {}) {
  const key = `${id}:${limit}`;
  const cached = worldDetailCache.get(key);
  if (!force && cached?.data) return cached.data;
  if (!force && cached?.promise && (silent || !cached.silent)) return cached.promise;
  const loader = silent ? fetchJsonQuiet : fetchJson;
  const promise = loader(`/api/kata/tavern/world/${id}?limit=${limit}`).then((data) => {
    if (data?.world) {
      worldDetailCache.set(key, { data, silent: false });
      rememberWorldPreview({ ...data.world, messageCount: data.messageCount ?? 0 });
      rememberWorldSnapshot(id, data, true);
    }
    return data;
  }).catch((err) => {
    worldDetailCache.delete(key);
    if (!silent) throw err;
    return null;
  });
  worldDetailCache.set(key, { promise, silent });
  return promise;
}

function prefetchWorldDetail(id, limit = WORLD_DETAIL_LIMIT) {
  if (!id) return;
  fetchWorldDetailCached(id, { limit, silent: true }).catch(() => {});
}

// ── Bootstrap: detect owner ─────────────────────────────────
//
// Defaults tab is rendered into the nav unconditionally so the layout
// doesn't reflow when /me resolves. Server rejects PATCH /admin/tavern-config
// from non-owners with 403; the GET endpoint also gates owner-only, so a
// regular user clicking the tab will see an "owner only" message rather
// than the form.
async function bootstrap() {
  const r = await fetch('/api/kata/me', { credentials: 'include' });
  if (r.ok) {
    me = await r.json();
    // /api/kata/me wraps the owner flag inside `user`. The earlier check
    // read `me.isOwner` (top level) which never existed, so isOwner stayed
    // false even for the real owner.
    isOwner = !!(me?.user?.isOwner);
  }
  setTabUI();
  switchTab(currentTab);
  seedNavCounts();
}

function switchTab(tab) {
  currentTab = tab;
  // Leaving a world detail/create sub-view: drop those params so the list shows.
  params.delete('world');
  params.delete('new');
  setTabUI();
  history.replaceState(null, '', `?tab=${tab}`);
  elActions.innerHTML = '';
  if (tab === 'worlds') return renderWorlds();
  if (tab === 'characters') return renderCharacters();
  if (tab === 'defaults') return renderDefaults();
}

// Delegated so the dynamically-rendered nav items keep working after repaint.
document.getElementById('tav-nav')?.addEventListener('click', (e) => {
  const a = e.target.closest('[data-tab]');
  if (!a) return;
  e.preventDefault();
  switchTab(a.dataset.tab);
});

  function backToList() {
    params.delete('new');
    history.replaceState(null, '', '?tab=worlds');
    renderWorlds();
  }
  document.getElementById('cancel-new').addEventListener('click', backToList);
  document.getElementById('create-cancel').addEventListener('click', backToList);

  // AI helpers — reuse the same /lore/* endpoints used by world detail.
  elContent.querySelectorAll('[data-ai]').forEach((btn) => {
    btn.addEventListener('click', async () => {
      const tag = btn.dataset.ai; // "lore-fix" | "lore-gen" | "rules-fix" | "rules-gen"
      const [kind, op] = tag.split('-');
      const ta = elContent.querySelector(`[data-n="${kind}"]`);
      if (op === 'gen') {
        const brief = await window.KataShell.prompt(`Brief cho ${kind} (1-3 câu mô tả):`, '', {
          title: kind === 'lore' ? 'AI write lore' : 'AI write rules',
          placeholder: 'Vd: học viện thần thoại, NPC chính là một con rồng già đã giả người',
        });
        if (!brief) return;
        btn.textContent = 'thinking…'; btn.disabled = true;
        const mode = elContent.querySelector('[data-n="mode"]').value;
        const difficulty = elContent.querySelector('[data-n="difficulty"]').value;
        const r = await fetchJson('/api/kata/tavern/lore/generate', {
          method: 'POST',
          body: { brief, kind, mode, difficulty },
        });
        btn.disabled = false; btn.textContent = 'AI write from brief…';
        if (r?.text) ta.value = r.text;
      } else {
        const draft = ta.value.trim();
        if (!draft) { window.KataShell.alert('Field rỗng — không có gì để FIX.'); return; }
        btn.textContent = 'thinking…'; btn.disabled = true;
        const r = await fetchJson('/api/kata/tavern/lore/improve', {
          method: 'POST',
          body: { draft, kind },
        });
        btn.disabled = false; btn.textContent = 'AI rewrite (FIX)';
        if (r?.text) ta.value = r.text;
      }
    });
  });

  // Cover-art AI gen button — uses whatever lore/setting is in the form right now.
  const coverAi = document.getElementById('create-cover-ai');
  const coverPreview = document.getElementById('cover-preview');
  const coverInput = elContent.querySelector('[data-n="coverImageUrl"]');
  function paintCoverPreview(url) {
    if (!coverPreview) return;
    coverPreview.innerHTML = url
      ? `<img src="${escapeHtml(url)}" alt="" class="rounded-[10px]" style="width:140px;aspect-ratio:1/1;object-fit:cover" />`
      : `<div class="rounded-[10px] grid place-items-center text-mute2 mono text-[10px] tracking-label uppercase" style="width:140px;aspect-ratio:1/1;background:rgba(138,79,255,0.05);border:1px dashed rgba(138,79,255,0.30)">no cover</div>`;
  }

      method: 'POST',
      body: {
        name: get('name'),
        setting: get('setting'),
        lore: get('lore'),
        imageStyle: get('imageStyle'),
      },
    });
    coverAi.disabled = false; coverAi.textContent = '✦ AI gen';
    if (r?.url) {
      if (coverInput) coverInput.value = r.url;
      paintCoverPreview(r.url);
    }
  });

  document.getElementById('create-submit').addEventListener('click', async () => {
    const get = (k) => elContent.querySelector(`[data-n="${k}"]`)?.value ?? '';
    const body = {
      name: get('name').trim(),
      setting: get('setting').trim(),
      lore: get('lore').trim(),
      rules: get('rules').trim(),
      mode: get('mode'),
      difficulty: get('difficulty'),
      participation: get('participation'),
      imageStyle: get('imageStyle').trim() || 'cinematic detailed',
      imageGenEnabled: get('imageGenEnabled') === 'true',
      guildId: get('guildId').trim() || 'web',
    };
    const coverUrl = get('coverImageUrl').trim();
    if (coverUrl) body.coverImageUrl = coverUrl;
    if (!body.name) return window.KataShell.alert('Name bắt buộc');
    if (!body.setting) return window.KataShell.alert('Setting bắt buộc');
    const charId = get('characterId');
    if (charId) body.characterId = charId;
    const inlineName = get('inlineName').trim();
    const inlineAppearance = get('inlineAppearance').trim();
    if (!charId && (inlineName || inlineAppearance)) {
      body.characterInline = {
        name: inlineName || null,
        appearance: inlineAppearance || null,
      };
    }
    const submitBtn = document.getElementById('create-submit');
    submitBtn.disabled = true; submitBtn.textContent = 'creating…';
    const r = await fetchJson('/api/kata/tavern/world', { method: 'POST', body });
    submitBtn.disabled = false; submitBtn.textContent = 'create world';
    if (r?.world) {
      // Drop straight into the new world's detail.
      invalidateWorldCaches(r.world._id);
      params.delete('new');
      params.set('world', r.world._id);
      history.replaceState(null, '', `?tab=worlds&world=${r.world._id}`);
      renderWorldDetail(r.world._id);
    }
  });
}

      body: { coverImageUrl: url || null },
    });
    if (r) { invalidateWorldCaches(id); flash('cover saved'); renderWorldDetail(id); }
  });
  const coverGenBtn = document.getElementById('cover-ai-gen');
  if (coverGenBtn) coverGenBtn.addEventListener('click', async () => {
    coverGenBtn.disabled = true;
    coverGenBtn.textContent = 'generating…';
    const gen = await fetchJson('/api/kata/tavern/cover/generate', {
      method: 'POST',
      body: {
        name: w.name,
        setting: w.setting,
        lore: w.lore,
        imageStyle: w.imageStyle,
      },
    });
    if (gen?.url) {
      const r = await fetchJson(`/api/kata/tavern/world/${id}`, {
        method: 'PATCH',
        body: { coverImageUrl: gen.url },
      });
      if (r) { invalidateWorldCaches(id); flash('cover generated'); renderWorldDetail(id); return; }
    }
    coverGenBtn.disabled = false;
    coverGenBtn.textContent = '✦ AI gen từ lore';
  });
  const coverClearBtn = document.getElementById('cover-clear');
  if (coverClearBtn) coverClearBtn.addEventListener('click', async () => {
    const r = await fetchJson(`/api/kata/tavern/world/${id}`, {
      method: 'PATCH',
      body: { coverImageUrl: null },
    });
    if (r) { invalidateWorldCaches(id); flash('cover cleared'); renderWorldDetail(id); }
  });

  const endBtn = document.getElementById('end-world');
  if (endBtn) endBtn.addEventListener('click', async () => {
    const ok = await window.KataShell.confirm(
      'Lock world này? Story persist vĩnh viễn nhưng bot sẽ không reply nữa.',
      { title: 'End story', okLabel: 'lock world', danger: true },
    );
    if (!ok) return;
    const r = await fetchJson(`/api/kata/tavern/world/${id}/end`, { method: 'POST' });
    if (r) { invalidateWorldCaches(id); renderWorldDetail(id); }
  });

  // AI rewrite buttons (FIX = improve current text; gen = brief → write)
  elContent.querySelectorAll('[data-ai-target]').forEach((btn) => {
    btn.addEventListener('click', async () => {
      const target = btn.dataset.aiTarget;
      const isGen = target.endsWith('-gen');
      const kind = target.startsWith('rules') ? 'rules' : 'lore';
      const ta = elContent.querySelector(`[data-w="${kind}"]`);
      if (isGen) {
        const brief = await window.KataShell.prompt(`Brief cho ${kind} (1-3 câu mô tả):`, '', {
          title: kind === 'lore' ? 'AI write lore' : 'AI write rules',
          placeholder: 'Vd: học viện thần thoại, NPC chính là một con rồng già đã giả người',
        });
        if (!brief) return;
        btn.textContent = 'thinking…'; btn.disabled = true;
        const r = await fetchJson('/api/kata/tavern/lore/generate', {
          method: 'POST',
          body: { brief, kind, mode: w.mode, difficulty: w.difficulty },
        });
        btn.textContent = 'AI write from brief…'; btn.disabled = false;
        if (r?.text) ta.value = r.text;
      } else {
        const draft = ta.value.trim();
        if (!draft) { window.KataShell.alert('Field rỗng — không có gì để FIX.'); return; }
        btn.textContent = 'thinking…'; btn.disabled = true;
        const r = await fetchJson('/api/kata/tavern/lore/improve', {
          method: 'POST',
          body: { draft, kind },
        });
        btn.textContent = 'AI rewrite (FIX)'; btn.disabled = false;
        if (r?.text) ta.value = r.text;
      }
    });
  });
}

async function renderCharacters() {
  elContent.innerHTML = '<div class="mono text-[11px] text-mute">loading…</div>';
  const data = await fetchCharactersCached();
  if (!data) return;
  clearAuthWarn();
  const chars = data.characters ?? [];
  elCounts.textContent = `${chars.length} character${chars.length === 1 ? '' : 's'}`;
  navCounts.characters = chars.length; renderNav();

  elActions.innerHTML = '<button id="char-new" class="btn btn-primary">+ new character</button>';
  document.getElementById('char-new').addEventListener('click', () => openCharForm(null));

  // Deterministic avatar gradient from the name so each card reads distinctly.
  const AV_GRADS = [
    'linear-gradient(135deg, #8a4fff, #4a2a8a)', 'linear-gradient(135deg, #D4A858, #8a6a2e)',
    'linear-gradient(135deg, #5bd0a8, #2e7a5e)', 'linear-gradient(135deg, #E04545, #7a1e1e)',
    'linear-gradient(135deg, #5b9bd0, #2e4f7a)', 'linear-gradient(135deg, #c97ad0, #6a2e7a)',
  ];
  const avGrad = (s) => AV_GRADS[[...String(s || '?')].reduce((a, ch) => a + ch.charCodeAt(0), 0) % AV_GRADS.length];
  const initials = (s) => String(s || '?').replace(/[^A-Za-z0-9À-ỹ ]/g, '').trim().split(/\s+/).map((w) => w[0]).slice(0, 2).join('').toUpperCase() || '?';

  const cardsHtml = chars.map((c, i) => {
    const id = escapeHtml(c._id);
    const tagline = c.appearance?.trim() || c.persona?.trim() || '';
    const taglineHtml = tagline
      ? escapeHtml(tagline)
      : '<span style="color:rgba(245,237,224,0.3)">— chưa có mô tả —</span>';
    return `
      <div class="wcard" style="background:rgba(21,17,13,0.5);border:1px solid rgba(255,255,255,0.09);border-radius:16px;padding:20px;display:flex;flex-direction:column;animation:cardIn .3s ease backwards;animation-delay:${(i * 0.05).toFixed(2)}s">
        <div style="display:flex;align-items:center;gap:13px">
          <span style="width:50px;height:50px;border-radius:13px;background:${avGrad(c.name)};display:grid;place-items:center;font-size:16px;font-weight:800;color:rgba(255,255,255,0.92);flex:none">${escapeHtml(initials(c.name))}</span>
          <div style="min-width:0">
            <div style="font-size:15px;font-weight:700;letter-spacing:-.01em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${escapeHtml(c.name)}</div>
            ${c.imageBasePrompt ? `<div class="mono" style="font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:#8a4fff;margin-top:4px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">img base set</div>` : '<div class="mono" style="font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:rgba(245,237,224,0.3);margin-top:4px">character</div>'}
          </div>
        </div>
        <p style="margin:14px 0 0;font-size:12.5px;line-height:1.55;color:rgba(245,237,224,0.6);display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden">${taglineHtml}</p>
        <div style="flex:1;min-height:10px"></div>
        <div style="display:flex;align-items:center;gap:8px;margin-top:16px;padding-top:14px;border-top:1px solid rgba(255,255,255,0.07)">
          <button class="gbtn mono" data-char-del="${id}" style="font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;font-weight:700;color:#E04545;border:1px solid rgba(224,69,69,0.30);border-radius:8px;padding:6px 12px;background:transparent;cursor:pointer">delete</button>
          <span style="flex:1"></span>
          <button class="gbtn mono" data-char-edit="${id}" style="font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;font-weight:700;color:rgba(245,237,224,0.6);border:1px solid rgba(255,255,255,0.14);border-radius:8px;padding:6px 12px;background:transparent;cursor:pointer">edit</button>
        </div>
      </div>`;
  }).join('');
  const newTile = `
    <div class="createtile" id="char-create-tile" style="display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;min-height:168px;border:1.5px dashed rgba(138,79,255,0.3);border-radius:16px;background:transparent;cursor:pointer">
      <span style="width:46px;height:46px;border-radius:13px;background:linear-gradient(135deg,#8a4fff,#5a2fb0);display:grid;place-items:center;font-size:22px;color:#fff;box-shadow:0 8px 22px rgba(138,79,255,0.4)">+</span>
      <div class="mono" style="font-size:11px;letter-spacing:.16em;text-transform:uppercase;font-weight:800;color:#a87aff">new character</div>
    </div>`;
  elContent.innerHTML = `<div class="grid grid-cols-3 gap-[18px]">${cardsHtml}${newTile}</div>`;
  document.getElementById('char-create-tile')?.addEventListener('click', () => openCharForm(null));

  elContent.querySelectorAll('[data-char-edit]').forEach((b) => {
    b.addEventListener('click', () => {
      const c = chars.find((x) => x._id === b.dataset.charEdit);
      openCharForm(c);
    });
  });
  elContent.querySelectorAll('[data-char-del]').forEach((b) => {
    b.addEventListener('click', async () => {
      const ok = await window.KataShell.confirm('Xoá character?', { title: 'Xoá character', danger: true, okLabel: 'xoá' });
      if (!ok) return;
      const r = await fetchJson(`/api/kata/tavern/character/${b.dataset.charDel}`, { method: 'DELETE' });
      if (r) { invalidateCharacterCache(); renderCharacters(); }
    });
  });
}

function openCharForm(existing) {
  const isEdit = !!existing;
  const c = existing || { name: '', persona: '', appearance: '', greeting: '', imageBasePrompt: '' };
  elContent.innerHTML = `
    <div class="row max-w-2xl">
      <div class="mono text-[10px] tracking-label uppercase text-purple mb-3">${isEdit ? 'edit character' : 'new character'}</div>
      <div class="space-y-3">
        <label class="block"><div class="mono text-[10px] tracking-label uppercase text-mute mb-1">name *</div>
          <input class="field" data-c="name" value="${escapeHtml(c.name)}" maxlength="100" /></label>
        <label class="block"><div class="mono text-[10px] tracking-label uppercase text-mute mb-1">persona</div>
          <textarea class="field" data-c="persona" rows="3" maxlength="1500">${escapeHtml(c.persona ?? '')}</textarea></label>
        <label class="block"><div class="mono text-[10px] tracking-label uppercase text-mute mb-1">appearance</div>
          <textarea class="field" data-c="appearance" rows="3" maxlength="1500">${escapeHtml(c.appearance ?? '')}</textarea></label>
        <label class="block"><div class="mono text-[10px] tracking-label uppercase text-mute mb-1">greeting (chat mode)</div>
          <textarea class="field" data-c="greeting" rows="2" maxlength="600">${escapeHtml(c.greeting ?? '')}</textarea></label>
        <label class="block"><div class="mono text-[10px] tracking-label uppercase text-mute mb-1">image base prompt</div>
          <textarea class="field" data-c="imageBasePrompt" rows="2" maxlength="600" placeholder="1girl, pink hair, school uniform, anime style, detailed">${escapeHtml(c.imageBasePrompt ?? '')}</textarea></label>
      </div>
      <div class="flex justify-between items-center mt-4 pt-3 border-t border-line">
        <button id="char-cancel" class="btn">cancel</button>
        <button id="char-save" class="btn btn-primary">${isEdit ? 'save' : 'create'}</button>
      </div>
    </div>`;
  document.getElementById('char-cancel').addEventListener('click', renderCharacters);
  document.getElementById('char-save').addEventListener('click', async () => {
    const body = {};
    elContent.querySelectorAll('[data-c]').forEach((el) => { body[el.dataset.c] = el.value; });
    if (!body.name?.trim()) return window.KataShell.alert('Name bắt buộc');
    const url = isEdit ? `/api/kata/tavern/character/${existing._id}` : '/api/kata/tavern/character';
    const method = isEdit ? 'PATCH' : 'POST';
    const r = await fetchJson(url, { method, body });
    if (r) { invalidateCharacterCache(); renderCharacters(); }
  });
}

// Redesigned per the Claude Design handoff:
//   - system prompt as a free textarea

//   - scene / cover image as an ordered fal.ai fallback CHAIN (add/reorder/remove)

// Mode-chat / mode-rpg / output-rules were removed from the UI on purpose
// (they fall through to engine defaults; the PATCH simply omits them, so any

  { key: 'chatModel', label: 'storyteller', hint: 'drives every roleplay turn' },
  { key: 'loreModel', label: 'lore / rules', hint: 'keeps canon & rules straight' },
  { key: 'worldGenModel', label: 'whole-world', hint: 'expands the world between scenes' },
  { key: 'subjectModel', label: 'scene subject', hint: 'pulls subjects for image prompts' },
];

    elContent.querySelectorAll('[data-panel]').forEach((x) => x.classList.toggle('on', x.dataset.panel === p));

  if (sysEl) { sysEl.addEventListener('input', updSysCount); updSysCount(); }

  // ── live resolved preview ───────────────────────────────────

    const sys = (elContent.querySelector('[data-t="storytellerSystemPrompt"]')?.value ?? '').trim();

        <div class="rv-route">${routeRows}</div>
      </div>
      <div class="rv-block">
        <div class="rv-bh">scene image chain</div>
        <div class="rv-chain">${chainHtml}</div>
      </div>
      <div class="rv-stats">
        <div class="rv-stat"><span class="rv-sv">${escapeHtml(numVal('turnTemperature'))}</span><span class="rv-sl">temperature</span></div>
        <div class="rv-stat"><span class="rv-sv">${escapeHtml(numVal('turnMaxTokens'))}</span><span class="rv-sl">max tokens</span></div>
        <div class="rv-stat"><span class="rv-sv">${escapeHtml(numVal('memoryWindowSize'))}</span><span class="rv-sl">memory</span></div>
      </div>`;
  }

  // ── image fallback chain builder ────────────────────────────
  function renderChain(key) {
    const host = elContent.querySelector(`[data-chain="${key}"]`);
    if (!host) return;
    const arr = chains[key];
    const rows = arr.map((m, i) => `
      <div class="chain-row">
        <span class="chain-rank">${i + 1}</span>
        <span class="chain-model">${escapeHtml(m)}</span>
        <span class="chain-prov">fal.ai</span>
        <div class="chain-ctl">
          <button type="button" data-mv="up" data-i="${i}" ${i === 0 ? 'disabled' : ''} aria-label="up">↑</button>
          <button type="button" data-mv="down" data-i="${i}" ${i === arr.length - 1 ? 'disabled' : ''} aria-label="down">↓</button>
          <button type="button" class="x" data-rm="${i}" aria-label="remove">×</button>
        </div>
      </div>`).join('');
    host.innerHTML = `
      <div class="chain">${arr.length ? rows : '<div class="chain-empty">no models · engine default sẽ được dùng</div>'}</div>
      <button type="button" class="chain-add" data-add="${key}">+ add image model</button>`;

    host.querySelectorAll('[data-rm]').forEach((b) => b.addEventListener('click', () => {
      chains[key].splice(Number(b.dataset.rm), 1); renderChain(key); refreshPreview();
    }));
    host.querySelectorAll('[data-mv]').forEach((b) => b.addEventListener('click', () => {
      const i = Number(b.dataset.i); const j = b.dataset.mv === 'up' ? i - 1 : i + 1;
      if (j < 0 || j >= chains[key].length) return;
      const a = chains[key]; [a[i], a[j]] = [a[j], a[i]]; renderChain(key); refreshPreview();
    }));
    const addBtn = host.querySelector('[data-add]');
    if (addBtn) addBtn.addEventListener('click', () => {
      window.KataShell.modelPicker(addBtn, {
        byProvider: TAVERN_FAL_IMAGE_MODELS_BY_PROVIDER,
        placeholder: '',
        onApply: (v) => {
          const id = (v || '').trim();
          if (!id || chains[key].includes(id)) return;
          if (chains[key].length >= 8) { flash('tối đa 8 model / chain', 'error'); return; }
          chains[key].push(id); renderChain(key); refreshPreview();
        },
      });
    });
  }

  renderChain('sceneImageModels');
  renderChain('coverImageModels');
  wireModelPickers(refreshPreview);
  elContent.querySelectorAll('[data-t], [data-tnum]').forEach((el) => el.addEventListener('input', refreshPreview));
  refreshPreview();

  // ── save ────────────────────────────────────────────────────
  document.getElementById('defaults-save').addEventListener('click', async () => {
    const body = {};
    elContent.querySelectorAll('[data-t]').forEach((el) => {
      const v = el.value;
      body[el.dataset.t] = v.trim() ? v : null;
    });
    elContent.querySelectorAll('[data-tmp]').forEach((el) => {
      const v = (el.value ?? '').trim();
      body[el.dataset.tmp] = v || null;
    });
    body.sceneImageModels = chains.sceneImageModels.length ? chains.sceneImageModels.slice() : null;
    body.coverImageModels = chains.coverImageModels.length ? chains.coverImageModels.slice() : null;
    elContent.querySelectorAll('[data-tnum]').forEach((el) => {
      const v = el.value.trim();
      if (!v) { body[el.dataset.tnum] = null; return; }
      const n = Number(v);
      body[el.dataset.tnum] = Number.isFinite(n) ? n : null;
    });
    const btn = document.getElementById('defaults-save');
    btn.disabled = true; btn.textContent = 'saving…';
    const r = await fetchJson('/api/kata/admin/tavern-config', { method: 'PATCH', body });
    btn.disabled = false; btn.textContent = 'save setting';
    if (r) {
      flash('setting saved', 'success');
      const note = document.getElementById('set-savenote');
      if (note) note.textContent = '✓ saved · applied to every world';
    }
  });
}

function flash(msg, kind) { window.KataShell?.toast(msg, kind ? { kind } : undefined); }

// Tavern model lists — fal openrouter/router (FAL key). Only ids fal's router
// actually serves; it rejects "-latest" aliases and some newer/deprecated ids.
const TAVERN_CHAT_MODELS_BY_PROVIDER = {
  fal: [
    'fal:google/gemini-2.5-pro',
    'fal:google/gemini-2.5-flash',
  ],
};
// Cheap visual-extractor pool — fast + light.
const TAVERN_SUBJECT_MODELS_BY_PROVIDER = {
  fal: [
    'fal:google/gemini-2.5-flash',
  ],
};
const TAVERN_FAL_IMAGE_MODELS_BY_PROVIDER = {
  'fal.ai': [
    'fal-ai/flux/schnell',
    'fal-ai/fast-sdxl',
    'fal-ai/flux/dev',
    'fal-ai/nano-banana-pro',
    'fal-ai/gpt-image-2',
    'wan/v2.6/image-to-image',
  ],
};

// Render a "model picker" control wired against KataShell.modelPicker.
function modelPickerHtml(field, currentValue, placeholder, byProvider) {
  const cur = (currentValue ?? '').toString();
  const display = cur.includes(':') ? cur.split(':').slice(1).join(':') : cur;
  const label = display || `(default · ${placeholder})`;
  const providers = JSON.stringify(byProvider).replace(/"/g, '&quot;');
  return `
    <div class="flex gap-2 items-center">
      <input type="hidden" data-${field.scope}="${escapeHtml(field.key)}" value="${escapeHtml(cur)}" />
      <button type="button" data-mp-trigger="${escapeHtml(field.key)}"
              data-mp-providers="${providers}"
              data-mp-placeholder="${escapeHtml(placeholder)}"
              data-mp-scope="${field.scope}"
              class="field flex-1 text-left flex items-center justify-between gap-2"
              style="cursor:pointer">
        <span data-mp-label>${escapeHtml(label)}</span>
        <span class="text-mute text-[10px]">▾</span>
      </button>
    </div>`;
}

// Wire all model-picker triggers in elContent (idempotent).
// `onApply` (optional) fires after a pick so callers (e.g. the Setting page's
// live preview) can react; the picker still writes hiddenInput + labelEl itself.
function wireModelPickers(onApply) {
  elContent.querySelectorAll('[data-mp-trigger]').forEach((btn) => {
    if (btn.dataset.mpWired) return;
    btn.dataset.mpWired = '1';
    btn.addEventListener('click', (e) => {
      e.stopPropagation();
      const key = btn.dataset.mpTrigger;
      const scope = btn.dataset.mpScope;
      const hiddenInput = elContent.querySelector(`input[data-${scope}="${key}"]`);
      const labelEl = btn.querySelector('[data-mp-label]');
      let byProvider = {};
      try { byProvider = JSON.parse(btn.dataset.mpProviders.replace(/&quot;/g, '"')); } catch {}
      window.KataShell.modelPicker(btn, {
        byProvider,
        placeholder: btn.dataset.mpPlaceholder || '',
        hiddenInput,
        labelEl,
        onApply: typeof onApply === 'function' ? onApply : undefined,
      });
    });
  });
}

// ── Mobile drawer toggle ─────────────────────────────────────
(function () {
  const btn = document.getElementById('nav-toggle');
  const scrim = document.getElementById('nav-scrim');
  const close = () => document.body.classList.remove('nav-open');
  if (btn) btn.addEventListener('click', () => document.body.classList.toggle('nav-open'));
  if (scrim) scrim.addEventListener('click', close);
  // Close after picking a nav entry or leaving to servers.
  document.querySelectorAll('aside [data-tab], aside a[href="index.html"]').forEach((a) => {
    a.addEventListener('click', close);
  });
  window.addEventListener('keydown', (e) => { if (e.key === 'Escape') close(); });
})();

bootstrap();
</script>
