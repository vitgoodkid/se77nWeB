  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; height: 32px; padding: 0 14px; border-radius: 999px; border: 1px solid rgba(255,255,255,0.12); font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 11px; letter-spacing: 0.18em; text-transform: uppercase; color: rgba(245,237,224,0.7); background: transparent; cursor: pointer; transition: all 120ms ease; }

  .live-badge { display: inline-block; padding: 2px 8px; border-radius: 999px; background: rgba(91,168,104,0.10); border: 1px solid rgba(91,168,104,0.30); color: #5BA868; font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 9px; letter-spacing: 0.12em; text-transform: uppercase; }
  details summary { cursor: pointer; list-style: none; }
  details summary::-webkit-details-marker { display: none; }
  details[open] summary .chev { transform: rotate(90deg); }
  .chev { display: inline-block; transition: transform 120ms ease; }
  .msg-bubble { background: rgba(21,17,13,0.55); border: 1px solid rgba(255,255,255,0.06); border-radius: 10px; padding: 12px 16px; line-height: 1.55; font-size: 14px; }

<script>
const TABS = ['worlds', 'characters', 'defaults'];
const params = new URLSearchParams(location.search);
let currentTab = TABS.includes(params.get('tab')) ? params.get('tab') : 'worlds';
let isOwner = false;
let me = null;

const elTag = document.getElementById('page-tag');
const elLabel = document.getElementById('page-tab-label');
const elBcTab = document.getElementById('bc-tab');
const elCounts = document.getElementById('page-counts');
const elContent = document.getElementById('content');
const elActions = document.getElementById('page-actions');
const elAuthWarn = document.getElementById('auth-warning');
const elAuthMsg = document.getElementById('auth-warning-msg');
const elAuthLogin = document.getElementById('auth-login-btn');
const elNavDefaults = document.getElementById('nav-defaults');

const TAB_LABEL = { worlds: 'my worlds', characters: 'characters', defaults: 'tavern defaults' };

function setTabUI() {
  document.querySelectorAll('[data-tab]').forEach(a => {
    a.classList.toggle('tab-active', a.dataset.tab === currentTab);
  });
  elTag.textContent = currentTab.toUpperCase();
  elLabel.textContent = ` · ${TAB_LABEL[currentTab] ?? currentTab}`;
  elBcTab.textContent = TAB_LABEL[currentTab] ?? currentTab;
}

function escapeHtml(s) {
  return String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
}
function fmtTime(d) {
  if (!d) return '—';
  const date = new Date(d); const diff = (Date.now() - date.getTime()) / 1000;
  if (diff < 60) return `${Math.floor(diff)}s`;
  if (diff < 3600) return `${Math.floor(diff/60)}m`;
  if (diff < 86400) return `${Math.floor(diff/3600)}h`;
  if (diff < 604800) return `${Math.floor(diff/86400)}d`;
  return date.toISOString().slice(0,10);
}
function fmtNum(n) { return Number(n ?? 0).toLocaleString(); }

async function fetchJson(url, opts = {}) {
  const init = { credentials: 'include', ...opts };
  if (init.body && typeof init.body !== 'string') {
    init.body = JSON.stringify(init.body);
    init.headers = { 'Content-Type': 'application/json', ...(init.headers || {}) };
  }
  const r = await fetch(url, init);
  let body = null;
  try { body = await r.json(); } catch {}
  if (!r.ok) {
    if (body?.error === 'unauthenticated') {
      elAuthMsg.textContent = 'Cần đăng nhập Discord để dùng tavern.';
      elAuthLogin.classList.remove('hidden');
    } else if (body?.error === 'forbidden') {
      elAuthMsg.textContent = body?.message || 'Bạn không có quyền vào trang này.';
    } else if (body?.error === 'discord_required') {
      elAuthMsg.textContent = 'Cần login bằng Discord.';
      elAuthLogin.classList.remove('hidden');
    } else {
      const det = body?.details ? ' · ' + body.details.join('; ') : '';
      elAuthMsg.textContent = (body?.message || body?.error || `lỗi ${r.status}`) + det;
    }
    elAuthWarn.classList.remove('hidden');
    return null;
  }
  return body;
}
function clearAuthWarn() {
  elAuthWarn.classList.add('hidden');
  elAuthLogin.classList.add('hidden');
}

// ── Bootstrap: detect owner & gate the defaults nav ────────────
async function bootstrap() {
  const r = await fetch('/api/kata/me', { credentials: 'include' });
  if (r.ok) {
    me = await r.json();
    isOwner = !!me?.isOwner;
    if (isOwner) elNavDefaults.classList.remove('hidden');
  }
  if (!isOwner && currentTab === 'defaults') currentTab = 'worlds';
  setTabUI();
  switchTab(currentTab);
}

function switchTab(tab) {
  currentTab = tab;
  setTabUI();
  history.replaceState(null, '', `?tab=${tab}`);
  elActions.innerHTML = '';
  if (tab === 'worlds') return renderWorlds();
  if (tab === 'characters') return renderCharacters();
  if (tab === 'defaults') return renderDefaults();
}

document.querySelectorAll('[data-tab]').forEach(a => {
  a.addEventListener('click', (e) => { e.preventDefault(); switchTab(a.dataset.tab); });
});

// ── My Worlds ─────────────────────────────────────────────────
async function renderWorlds() {
  const detailId = params.get('world');
  if (detailId) return renderWorldDetail(detailId);
  const isNew = params.get('new') === '1';
  if (isNew) return renderWorldCreate();
  elContent.innerHTML = '<div class="mono text-[11px] text-mute">loading…</div>';
  const data = await fetchJson('/api/kata/tavern/me/worlds');
  if (!data) return;
  clearAuthWarn();
  const worlds = data.worlds ?? [];
  elCounts.textContent = `${worlds.length} world${worlds.length === 1 ? '' : 's'}`;

  elActions.innerHTML = '<a href="?tab=worlds&new=1" id="world-new-btn" class="btn btn-primary">+ new world</a>';
  document.getElementById('world-new-btn').addEventListener('click', (e) => {
    e.preventDefault();
    params.set('new', '1');
    history.replaceState(null, '', '?tab=worlds&new=1');
    renderWorldCreate();
  });

  if (worlds.length === 0) {
    elContent.innerHTML = `
      <div class="row text-center py-12">
        <div class="text-[14px] text-mute">Chưa có world nào.</div>
        <div class="mono text-[10px] text-mute2 mt-2">Tạo trên web bằng <a href="?tab=worlds&new=1" class="text-purple hover:underline" data-go-new>+ new world</a> hoặc trên Discord bằng <code class="text-ink">/worldcreate</code></div>
      </div>`;
    document.querySelectorAll('[data-go-new]').forEach((a) => {
      a.addEventListener('click', (e) => {
        e.preventDefault();
        params.set('new', '1');
        history.replaceState(null, '', '?tab=worlds&new=1');
        renderWorldCreate();
      });
    });
    return;
  }

  const rowsHtml = worlds.map((w) => {
    const status = w.isLocked
      ? '<span class="lock-badge">🔒 locked</span>'
      : '<span class="live-badge">▶ live</span>';
    const cover = w.coverImageUrl
      ? `<img src="${escapeHtml(w.coverImageUrl)}" alt="" class="rounded-[8px] object-cover" style="width:64px;height:64px;flex:0 0 64px" />`
      : `<div class="rounded-[8px] grid place-items-center mono text-[10px] tracking-label uppercase text-mute2" style="width:64px;height:64px;flex:0 0 64px;background:rgba(138,79,255,0.06);border:1px solid rgba(138,79,255,0.18)">⌑</div>`;
    return `
      <div class="row flex items-center gap-4">
        ${cover}
        <div class="flex-1 min-w-0 cursor-pointer" data-world-id="${escapeHtml(w._id)}">
          <div class="flex items-center gap-3 flex-wrap">
            <div class="text-[15px] font-semibold tracking-tight">${escapeHtml(w.name)}</div>
            ${status}
            <span class="mono text-[9px] tracking-label uppercase text-mute2">${escapeHtml(w.mode)} · ${escapeHtml(w.difficulty)}</span>
          </div>
          <div class="mono text-[10px] text-mute mt-1">
            ${fmtNum(w.messageCount)} turns · last ${escapeHtml(fmtTime(w.lastActiveAt))} · guild ${escapeHtml(w.guildId)}
          </div>
        </div>
        <div class="flex flex-col gap-1">
          <a href="tavern-play.html?world=${escapeHtml(w._id)}" class="btn btn-primary" ${w.isLocked ? 'style="opacity:0.5;pointer-events:none"' : ''}>▶ play</a>
          <button class="btn" data-world-id="${escapeHtml(w._id)}">edit</button>
        </div>
      </div>`;
  }).join('');
  elContent.innerHTML = `<div class="space-y-2">${rowsHtml}</div>`;
  elContent.querySelectorAll('[data-world-id]').forEach((el) => {
    el.addEventListener('click', () => {
      const id = el.dataset.worldId;
      params.set('world', id);
      history.replaceState(null, '', `?tab=worlds&world=${id}`);
      renderWorldDetail(id);
    });
  });
}

async function renderWorldCreate() {
  elContent.innerHTML = '<div class="mono text-[11px] text-mute">loading character library…</div>';
  elActions.innerHTML = '';
  elCounts.textContent = 'tạo world mới';
  // Pull character library so user can pick a protagonist.
  const charData = await fetchJson('/api/kata/tavern/character');
  if (!charData) return;
  clearAuthWarn();
  const chars = charData.characters ?? [];

  elContent.innerHTML = `
    <div class="row max-w-3xl">
      <div class="flex items-center justify-between mb-4">
        <div class="mono text-[10px] tracking-label uppercase text-purple">new world · web</div>
        <button id="cancel-new" class="btn">cancel</button>
      </div>

      <div class="space-y-3">
        <label class="block">
          <div class="mono text-[10px] tracking-label uppercase text-mute mb-1">name *</div>
          <input class="field" data-n="name" maxlength="100" placeholder="Vd: Học viện Chân Lực" />
        </label>

        <div class="grid grid-cols-3 gap-3">
          <label class="block">
            <div class="mono text-[10px] tracking-label uppercase text-mute mb-1">mode *</div>
            <select class="field" data-n="mode">
              <option value="chat">chat (1-1 NPC)</option>
              <option value="rpg">rpg (narrator)</option>
            </select>
          </label>
          <label class="block">
            <div class="mono text-[10px] tracking-label uppercase text-mute mb-1">difficulty</div>
            <select class="field" data-n="difficulty">
              <option value="easy">easy</option>
              <option value="normal" selected>normal</option>
              <option value="hard">hard</option>
            </select>
          </label>
          <label class="block">
            <div class="mono text-[10px] tracking-label uppercase text-mute mb-1">participation</div>
            <select class="field" data-n="participation">
              <option value="creator_only" selected>creator_only</option>
              <option value="anyone">anyone</option>
            </select>
          </label>
        </div>

        <label class="block">
          <div class="mono text-[10px] tracking-label uppercase text-mute mb-1">setting *</div>
          <textarea class="field" data-n="setting" rows="3" maxlength="1500" placeholder="Bối cảnh nơi câu chuyện diễn ra (1-3 đoạn)."></textarea>
        </label>

        <label class="block">
          <div class="mono text-[10px] tracking-label uppercase text-mute mb-1">lore</div>
          <textarea class="field" data-n="lore" rows="8" maxlength="30000" placeholder="Lịch sử, các phe phái, sự kiện đã xảy ra. Có thể để trống."></textarea>
        </label>
        <div class="flex gap-2">
          <button class="btn" data-ai="lore-fix">AI rewrite (FIX)</button>
          <button class="btn" data-ai="lore-gen">AI write from brief…</button>
        </div>

        <label class="block">
          <div class="mono text-[10px] tracking-label uppercase text-mute mb-1">rules</div>
          <textarea class="field" data-n="rules" rows="4" maxlength="1500" placeholder="Vd: phép thuật cần năng lượng, đàn ông không được mặc trắng."></textarea>
        </label>
        <div class="flex gap-2">
          <button class="btn" data-ai="rules-fix">AI rewrite (FIX)</button>
          <button class="btn" data-ai="rules-gen">AI write from brief…</button>
        </div>

        <div class="grid grid-cols-2 gap-3">
          <label class="block">
            <div class="mono text-[10px] tracking-label uppercase text-mute mb-1">main character (library)</div>
            <select class="field" data-n="characterId">
              <option value="">— anonymous / inline —</option>
              ${chars.map((c) => `<option value="${escapeHtml(c._id)}">${escapeHtml(c.name)}</option>`).join('')}
            </select>
          </label>
          <label class="block">
            <div class="mono text-[10px] tracking-label uppercase text-mute mb-1">guild (tag)</div>
            <input class="field" data-n="guildId" maxlength="40" value="web" placeholder="web (default)" />
          </label>
        </div>

        <details class="row" style="margin-top: 4px">
          <summary class="flex items-center gap-2">
            <span class="chev mono text-mute">▸</span>
            <div class="mono text-[10px] tracking-label uppercase text-mute">inline character (nếu không pick từ library)</div>
          </summary>
          <div class="space-y-3 mt-3">
            <label class="block">
              <div class="mono text-[10px] tracking-label uppercase text-mute mb-1">name</div>
              <input class="field" data-n="inlineName" maxlength="200" />
            </label>
            <label class="block">
              <div class="mono text-[10px] tracking-label uppercase text-mute mb-1">appearance</div>
              <textarea class="field" data-n="inlineAppearance" rows="3" maxlength="1500" placeholder="Mô tả ngoại hình + tính cách ngắn."></textarea>
            </label>
          </div>
        </details>

        <div class="grid grid-cols-2 gap-3">
          <label class="block">
            <div class="mono text-[10px] tracking-label uppercase text-mute mb-1">image style</div>
            <input class="field" data-n="imageStyle" maxlength="200" value="cinematic detailed" />
          </label>
          <label class="block">
            <div class="mono text-[10px] tracking-label uppercase text-mute mb-1">scene images</div>
            <select class="field" data-n="imageGenEnabled">
              <option value="false" selected>off (web default — fal cost)</option>
              <option value="true">on</option>
            </select>
          </label>
        </div>

        <div class="row" style="background:rgba(138,79,255,0.04);border-color:rgba(138,79,255,0.25)">
          <div class="mono text-[10px] tracking-label uppercase text-purple mb-2">cover art</div>
          <div class="flex gap-3 items-start">
            <div id="cover-preview" style="flex:0 0 140px">
              <div class="rounded-[10px] grid place-items-center text-mute2 mono text-[10px] tracking-label uppercase" style="width:140px;aspect-ratio:1/1;background:rgba(138,79,255,0.05);border:1px dashed rgba(138,79,255,0.30)">no cover</div>
            </div>
            <div class="flex-1 space-y-2">
              <input class="field" data-n="coverImageUrl" placeholder="https://… (paste URL hoặc bấm AI gen)" />
              <div class="flex gap-2 flex-wrap">
                <button type="button" id="create-cover-ai" class="btn btn-primary">🎨 AI gen</button>
              </div>
              <div class="mono text-[10px] text-mute2">AI gen dùng setting + lore vừa nhập làm prompt seed.</div>
            </div>
          </div>
        </div>
      </div>

      <div class="flex justify-end gap-2 mt-5 pt-4 border-t border-line">
        <button id="create-cancel" class="btn">cancel</button>
        <button id="create-submit" class="btn btn-primary">create world</button>
      </div>
    </div>`;

  function backToList() {
    params.delete('new');
    history.replaceState(null, '', '?tab=worlds');
    renderWorlds();
  }
  document.getElementById('cancel-new').addEventListener('click', backToList);
  document.getElementById('create-cancel').addEventListener('click', backToList);

  // AI helpers — reuse the same /lore/* endpoints used by world detail.
  elContent.querySelectorAll('[data-ai]').forEach((btn) => {
    btn.addEventListener('click', async () => {
      const tag = btn.dataset.ai; // "lore-fix" | "lore-gen" | "rules-fix" | "rules-gen"
      const [kind, op] = tag.split('-');
      const ta = elContent.querySelector(`[data-n="${kind}"]`);
      if (op === 'gen') {
        const brief = await window.KataShell.prompt(`Brief cho ${kind} (1-3 câu mô tả):`, '', {
          title: kind === 'lore' ? 'AI write lore' : 'AI write rules',
          placeholder: 'Vd: học viện thần thoại, NPC chính là một con rồng già đã giả người',
        });
        if (!brief) return;
        btn.textContent = 'thinking…'; btn.disabled = true;
        const mode = elContent.querySelector('[data-n="mode"]').value;
        const difficulty = elContent.querySelector('[data-n="difficulty"]').value;
        const r = await fetchJson('/api/kata/tavern/lore/generate', {
          method: 'POST',
          body: { brief, kind, mode, difficulty },
        });
        btn.disabled = false; btn.textContent = 'AI write from brief…';
        if (r?.text) ta.value = r.text;
      } else {
        const draft = ta.value.trim();
        if (!draft) { window.KataShell.alert('Field rỗng — không có gì để FIX.'); return; }
        btn.textContent = 'thinking…'; btn.disabled = true;
        const r = await fetchJson('/api/kata/tavern/lore/improve', {
          method: 'POST',
          body: { draft, kind },
        });
        btn.disabled = false; btn.textContent = 'AI rewrite (FIX)';
        if (r?.text) ta.value = r.text;
      }
    });
  });

  // Cover-art AI gen button — uses whatever lore/setting is in the form right now.
  const coverAi = document.getElementById('create-cover-ai');
  const coverPreview = document.getElementById('cover-preview');
  const coverInput = elContent.querySelector('[data-n="coverImageUrl"]');
  function paintCoverPreview(url) {
    if (!coverPreview) return;
    coverPreview.innerHTML = url
      ? `<img src="${escapeHtml(url)}" alt="" class="rounded-[10px]" style="width:140px;aspect-ratio:1/1;object-fit:cover" />`
      : `<div class="rounded-[10px] grid place-items-center text-mute2 mono text-[10px] tracking-label uppercase" style="width:140px;aspect-ratio:1/1;background:rgba(138,79,255,0.05);border:1px dashed rgba(138,79,255,0.30)">no cover</div>`;
  }
  if (coverInput) coverInput.addEventListener('input', () => paintCoverPreview(coverInput.value.trim()));
  if (coverAi) coverAi.addEventListener('click', async () => {
    coverAi.disabled = true; coverAi.textContent = 'generating…';
    const get = (k) => elContent.querySelector(`[data-n="${k}"]`)?.value ?? '';
    const r = await fetchJson('/api/kata/tavern/cover/generate', {
      method: 'POST',
      body: {
        name: get('name'),
        setting: get('setting'),
        lore: get('lore'),
        imageStyle: get('imageStyle'),
      },
    });
    coverAi.disabled = false; coverAi.textContent = '🎨 AI gen';
    if (r?.url) {
      if (coverInput) coverInput.value = r.url;
      paintCoverPreview(r.url);
    }
  });

  document.getElementById('create-submit').addEventListener('click', async () => {
    const get = (k) => elContent.querySelector(`[data-n="${k}"]`)?.value ?? '';
    const body = {
      name: get('name').trim(),
      setting: get('setting').trim(),
      lore: get('lore').trim(),
      rules: get('rules').trim(),
      mode: get('mode'),
      difficulty: get('difficulty'),
      participation: get('participation'),
      imageStyle: get('imageStyle').trim() || 'cinematic detailed',
      imageGenEnabled: get('imageGenEnabled') === 'true',
      guildId: get('guildId').trim() || 'web',
    };
    const coverUrl = get('coverImageUrl').trim();
    if (coverUrl) body.coverImageUrl = coverUrl;
    if (!body.name) return window.KataShell.alert('Name bắt buộc');
    if (!body.setting) return window.KataShell.alert('Setting bắt buộc');
    const charId = get('characterId');
    if (charId) body.characterId = charId;
    const inlineName = get('inlineName').trim();
    const inlineAppearance = get('inlineAppearance').trim();
    if (!charId && (inlineName || inlineAppearance)) {
      body.characterInline = {
        name: inlineName || null,
        appearance: inlineAppearance || null,
      };
    }
    const submitBtn = document.getElementById('create-submit');
    submitBtn.disabled = true; submitBtn.textContent = 'creating…';
    const r = await fetchJson('/api/kata/tavern/world', { method: 'POST', body });
    submitBtn.disabled = false; submitBtn.textContent = 'create world';
    if (r?.world) {
      // Drop straight into the new world's detail.
      params.delete('new');
      params.set('world', r.world._id);
      history.replaceState(null, '', `?tab=worlds&world=${r.world._id}`);
      renderWorldDetail(r.world._id);
    }
  });
}

            <div class="row" style="background:rgba(138,79,255,0.04);border-color:rgba(138,79,255,0.25)">

              <div class="grid grid-cols-2 gap-3">
                ${ovField('chatModel', 'storyteller model', 'kr/claude-opus-4.7 · ...', false)}
                ${ovField('loreModel', 'lore/rules AI model', 'grok-4-fast', false)}
              </div>
              <div class="grid grid-cols-2 gap-3 mt-3">
                ${ovField('worldGenModel', 'whole-world AI model', 'grok-4-fast', false)}
                ${ovField('subjectModel', 'scene-subject extractor', 'openrouter:google/gemini-2.5-flash-lite', false)}
              </div>
              <label class="block mt-3">
                <div class="mono text-[10px] tracking-label uppercase text-mute mb-1">scene image fal models (chain)</div>
                <input class="field" data-ovarr="sceneImageModels" value="${escapeHtml((ovs.sceneImageModels ?? []).join(', '))}" placeholder="fal-ai/flux/schnell, fal-ai/fast-sdxl" />

                  <div class="mono text-[10px] tracking-label uppercase text-mute mb-1">memory window (turns)</div>
                  <input class="field" data-ovnum="memoryWindowSize" type="number" min="1" max="500" value="${typeof ovs.memoryWindowSize === 'number' ? ovs.memoryWindowSize : ''}" placeholder="50" />

    const body = {};
    elContent.querySelectorAll('[data-w]').forEach((el) => {
      const k = el.dataset.w;
      let v = el.value;
      if (k === 'imageGenEnabled') v = v === 'true';
      body[k] = v;
    });
    const r = await fetchJson(`/api/kata/tavern/world/${id}`, { method: 'PATCH', body });
    if (r) flash('saved');
  });

  document.getElementById('save-overrides').addEventListener('click', async () => {
    const overrides = {};
    elContent.querySelectorAll('[data-ov]').forEach((el) => {
      const k = el.dataset.ov; const v = el.value;
      if (v && v.trim()) overrides[k] = v;
    });
    elContent.querySelectorAll('[data-ovarr]').forEach((el) => {
      const arr = el.value.split(',').map((s) => s.trim()).filter(Boolean);
      if (arr.length) overrides[el.dataset.ovarr] = arr;
    });
    elContent.querySelectorAll('[data-ovnum]').forEach((el) => {
      const v = el.value.trim();
      if (!v) return;
      const n = Number(v);
      if (Number.isFinite(n)) overrides[el.dataset.ovnum] = n;
    });
    const r = await fetchJson(`/api/kata/tavern/world/${id}`, { method: 'PATCH', body: { overrides } });
    if (r) flash('overrides saved', 'success');
  });

  // Cover art handlers.
  const coverSaveBtn = document.getElementById('cover-save-url');
  if (coverSaveBtn) coverSaveBtn.addEventListener('click', async () => {
    const url = document.getElementById('cover-url-input').value.trim();
    const r = await fetchJson(`/api/kata/tavern/world/${id}`, {
      method: 'PATCH',
      body: { coverImageUrl: url || null },
    });
    if (r) { flash('cover saved'); renderWorldDetail(id); }
  });
  const coverGenBtn = document.getElementById('cover-ai-gen');
  if (coverGenBtn) coverGenBtn.addEventListener('click', async () => {
    coverGenBtn.disabled = true;
    coverGenBtn.textContent = 'generating…';
    const gen = await fetchJson('/api/kata/tavern/cover/generate', {
      method: 'POST',
      body: {
        name: w.name,
        setting: w.setting,
        lore: w.lore,
        imageStyle: w.imageStyle,
      },
    });
    if (gen?.url) {
      const r = await fetchJson(`/api/kata/tavern/world/${id}`, {
        method: 'PATCH',
        body: { coverImageUrl: gen.url },
      });
      if (r) { flash('cover generated'); renderWorldDetail(id); return; }
    }
    coverGenBtn.disabled = false;
    coverGenBtn.textContent = '🎨 AI gen từ lore';
  });
  const coverClearBtn = document.getElementById('cover-clear');
  if (coverClearBtn) coverClearBtn.addEventListener('click', async () => {
    const r = await fetchJson(`/api/kata/tavern/world/${id}`, {
      method: 'PATCH',
      body: { coverImageUrl: null },
    });
    if (r) { flash('cover cleared'); renderWorldDetail(id); }
  });

  const endBtn = document.getElementById('end-world');
  if (endBtn) endBtn.addEventListener('click', async () => {
    const ok = await window.KataShell.confirm(
      'Lock world này? Story persist vĩnh viễn nhưng bot sẽ không reply nữa.',
      { title: 'End story', okLabel: 'lock world', danger: true },
    );
    if (!ok) return;
    const r = await fetchJson(`/api/kata/tavern/world/${id}/end`, { method: 'POST' });
    if (r) renderWorldDetail(id);
  });

  // AI rewrite buttons (FIX = improve current text; gen = brief → write)
  elContent.querySelectorAll('[data-ai-target]').forEach((btn) => {
    btn.addEventListener('click', async () => {
      const target = btn.dataset.aiTarget;
      const isGen = target.endsWith('-gen');
      const kind = target.startsWith('rules') ? 'rules' : 'lore';
      const ta = elContent.querySelector(`[data-w="${kind}"]`);
      if (isGen) {
        const brief = await window.KataShell.prompt(`Brief cho ${kind} (1-3 câu mô tả):`, '', {
          title: kind === 'lore' ? 'AI write lore' : 'AI write rules',
          placeholder: 'Vd: học viện thần thoại, NPC chính là một con rồng già đã giả người',
        });
        if (!brief) return;
        btn.textContent = 'thinking…'; btn.disabled = true;
        const r = await fetchJson('/api/kata/tavern/lore/generate', {
          method: 'POST',
          body: { brief, kind, mode: w.mode, difficulty: w.difficulty },
        });
        btn.textContent = 'AI write from brief…'; btn.disabled = false;
        if (r?.text) ta.value = r.text;
      } else {
        const draft = ta.value.trim();
        if (!draft) { window.KataShell.alert('Field rỗng — không có gì để FIX.'); return; }
        btn.textContent = 'thinking…'; btn.disabled = true;
        const r = await fetchJson('/api/kata/tavern/lore/improve', {
          method: 'POST',
          body: { draft, kind },
        });
        btn.textContent = 'AI rewrite (FIX)'; btn.disabled = false;
        if (r?.text) ta.value = r.text;
      }
    });
  });
}

async function renderCharacters() {
  elContent.innerHTML = '<div class="mono text-[11px] text-mute">loading…</div>';
  const data = await fetchJson('/api/kata/tavern/character');
  if (!data) return;
  clearAuthWarn();
  const chars = data.characters ?? [];
  elCounts.textContent = `${chars.length} character${chars.length === 1 ? '' : 's'}`;

  elActions.innerHTML = '<button id="char-new" class="btn btn-primary">+ new</button>';
  document.getElementById('char-new').addEventListener('click', () => openCharForm(null));

  if (chars.length === 0) {
    elContent.innerHTML = `
      <div class="row text-center py-12">
        <div class="text-[14px] text-mute">Chưa có character nào.</div>
        <div class="mono text-[10px] text-mute2 mt-2">Hoặc tạo trên Discord bằng <code class="text-ink">/charcreate</code></div>
      </div>`;
    return;
  }

  const rowsHtml = chars.map((c) => `
    <div class="row flex items-start gap-4">
      <div class="flex-1 min-w-0">
        <div class="text-[15px] font-semibold tracking-tight">${escapeHtml(c.name)}</div>
        ${c.appearance ? `<div class="text-[12px] text-mute mt-1 truncate-2">${escapeHtml(c.appearance)}</div>` : ''}
        ${c.imageBasePrompt ? `<div class="mono text-[10px] text-mute2 mt-1 truncate">img base: ${escapeHtml(c.imageBasePrompt)}</div>` : ''}
      </div>
      <div class="flex flex-col gap-1">
        <button class="btn" data-char-edit="${escapeHtml(c._id)}">edit</button>
        <button class="btn btn-danger" data-char-del="${escapeHtml(c._id)}">delete</button>
      </div>
    </div>`).join('');
  elContent.innerHTML = `<div class="space-y-2">${rowsHtml}</div>`;

  elContent.querySelectorAll('[data-char-edit]').forEach((b) => {
    b.addEventListener('click', () => {
      const c = chars.find((x) => x._id === b.dataset.charEdit);
      openCharForm(c);
    });
  });
  elContent.querySelectorAll('[data-char-del]').forEach((b) => {
    b.addEventListener('click', async () => {
      const ok = await window.KataShell.confirm('Xoá character?', { title: 'Xoá character', danger: true, okLabel: 'xoá' });
      if (!ok) return;
      const r = await fetchJson(`/api/kata/tavern/character/${b.dataset.charDel}`, { method: 'DELETE' });
      if (r) renderCharacters();
    });
  });
}

function openCharForm(existing) {
  const isEdit = !!existing;
  const c = existing || { name: '', persona: '', appearance: '', greeting: '', imageBasePrompt: '' };
  elContent.innerHTML = `
    <div class="row max-w-2xl">
      <div class="mono text-[10px] tracking-label uppercase text-purple mb-3">${isEdit ? 'edit character' : 'new character'}</div>
      <div class="space-y-3">
        <label class="block"><div class="mono text-[10px] tracking-label uppercase text-mute mb-1">name *</div>
          <input class="field" data-c="name" value="${escapeHtml(c.name)}" maxlength="100" /></label>
        <label class="block"><div class="mono text-[10px] tracking-label uppercase text-mute mb-1">persona</div>
          <textarea class="field" data-c="persona" rows="3" maxlength="1500">${escapeHtml(c.persona ?? '')}</textarea></label>
        <label class="block"><div class="mono text-[10px] tracking-label uppercase text-mute mb-1">appearance</div>
          <textarea class="field" data-c="appearance" rows="3" maxlength="1500">${escapeHtml(c.appearance ?? '')}</textarea></label>
        <label class="block"><div class="mono text-[10px] tracking-label uppercase text-mute mb-1">greeting (chat mode)</div>
          <textarea class="field" data-c="greeting" rows="2" maxlength="600">${escapeHtml(c.greeting ?? '')}</textarea></label>
        <label class="block"><div class="mono text-[10px] tracking-label uppercase text-mute mb-1">image base prompt</div>
          <textarea class="field" data-c="imageBasePrompt" rows="2" maxlength="600" placeholder="1girl, pink hair, school uniform, anime style, detailed">${escapeHtml(c.imageBasePrompt ?? '')}</textarea></label>
      </div>
      <div class="flex justify-between items-center mt-4 pt-3 border-t border-line">
        <button id="char-cancel" class="btn">cancel</button>
        <button id="char-save" class="btn btn-primary">${isEdit ? 'save' : 'create'}</button>
      </div>
    </div>`;
  document.getElementById('char-cancel').addEventListener('click', renderCharacters);
  document.getElementById('char-save').addEventListener('click', async () => {
    const body = {};
    elContent.querySelectorAll('[data-c]').forEach((el) => { body[el.dataset.c] = el.value; });
    if (!body.name?.trim()) return window.KataShell.alert('Name bắt buộc');
    const url = isEdit ? `/api/kata/tavern/character/${existing._id}` : '/api/kata/tavern/character';
    const method = isEdit ? 'PATCH' : 'POST';
    const r = await fetchJson(url, { method, body });
    if (r) renderCharacters();
  });
}

// ── Tavern Defaults (owner-only) ─────────────────────────────
async function renderDefaults() {
  if (!isOwner) {
    elContent.innerHTML = '<div class="row text-mute">Owner only.</div>';
    return;
  }
  elContent.innerHTML = '<div class="mono text-[11px] text-mute">loading…</div>';
  const data = await fetchJson('/api/kata/admin/tavern-config');
  if (!data) return;
  clearAuthWarn();
  const t = data.tavern ?? {};
  elCounts.textContent = 'global tavern defaults · áp dụng cho mọi world (per-world override vẫn thắng)';

  function fld(name, label, hint, big) {
    const tag = big ? 'textarea' : 'input';
    const valAttr = big ? '' : ` value="${escapeHtml(t[name] ?? '')}"`;
    const inner = big ? escapeHtml(t[name] ?? '') : '';
    const rows = big ? ' rows="8"' : '';
    return `
      <label class="block">
        <div class="flex items-center justify-between mb-1">
          <div class="mono text-[10px] tracking-label uppercase text-mute">${escapeHtml(label)}</div>
          <span class="mono text-[9px] text-mute2">${escapeHtml(hint)}</span>
        </div>
        <${tag} class="field" data-t="${escapeHtml(name)}"${valAttr}${rows}>${inner}</${tag}>
      </label>`;
  }

  elContent.innerHTML = `
    <div class="row max-w-4xl space-y-4">
      <div class="mono text-[11px] text-mute">
        Bỏ trống / xoá rỗng → field đó rơi xuống engine code default. Per-world override luôn thắng. Mọi roleplay turn dùng giá trị resolved này.
      </div>
      ${fld('storytellerSystemPrompt', 'storyteller system prompt', 'thay nguyên skeleton novelist', true)}
      <div class="grid grid-cols-2 gap-3">
        ${fld('modeInstructionChat', 'mode · chat', '', true)}
        ${fld('modeInstructionRpg', 'mode · rpg', '', true)}
      </div>
      <div class="grid grid-cols-3 gap-3">
        ${fld('difficultyEasy', 'difficulty · easy', '', true)}
        ${fld('difficultyNormal', 'difficulty · normal', '', true)}
        ${fld('difficultyHard', 'difficulty · hard', '', true)}
      </div>
      ${fld('outputRules', 'output rules', 'no-prefix, pacing, length...', true)}
      <div class="grid grid-cols-2 gap-3">
        ${fld('imagePromptTemplate', 'image prompt template', '{character_base}, {keywords}, {style}', false)}
        ${fld('imageNegativePrompt', 'image negative prompt', 'low quality, blurry...', false)}
      </div>

      <div class="row" style="background:rgba(138,79,255,0.04);border-color:rgba(138,79,255,0.25)">
        <div class="mono text-[10px] tracking-label uppercase text-purple mb-3">models · mặc định grok-4-fast / flux-schnell</div>
        <div class="space-y-3">
          <div class="grid grid-cols-2 gap-3">
            ${fld('chatModel', 'storyteller model (engine default: grok-4-fast)', 'kr/claude-opus-4.7 · openrouter:google/gemini-2.5-pro · ...', false)}
            ${fld('loreModel', 'lore/rules AI model', 'grok-4-fast', false)}
          </div>
          <div class="grid grid-cols-2 gap-3">
            ${fld('worldGenModel', 'whole-world AI model', 'grok-4-fast', false)}
            ${fld('subjectModel', 'scene-subject extractor', 'openrouter:google/gemini-2.5-flash-lite', false)}
          </div>
          <label class="block">
            <div class="flex items-center justify-between mb-1">
              <div class="mono text-[10px] tracking-label uppercase text-mute">scene image fal models (comma-separated chain, fallback in order)</div>
              <span class="mono text-[9px] text-mute2">default: fal-ai/flux/schnell, fal-ai/fast-sdxl</span>
            </div>
            <input class="field" data-tarr="sceneImageModels" value="${escapeHtml((t.sceneImageModels ?? []).join(', '))}" placeholder="fal-ai/flux/schnell, fal-ai/fast-sdxl" />
          </label>
          <label class="block">
            <div class="flex items-center justify-between mb-1">
              <div class="mono text-[10px] tracking-label uppercase text-mute">cover image fal models</div>
              <span class="mono text-[9px] text-mute2">default: fal-ai/flux/schnell, fal-ai/fast-sdxl</span>
            </div>
            <input class="field" data-tarr="coverImageModels" value="${escapeHtml((t.coverImageModels ?? []).join(', '))}" placeholder="fal-ai/flux/schnell, fal-ai/fast-sdxl" />
          </label>
        </div>
      </div>

      <div class="row" style="background:rgba(138,79,255,0.04);border-color:rgba(138,79,255,0.25)">
        <div class="mono text-[10px] tracking-label uppercase text-purple mb-3">tuning</div>
        <div class="grid grid-cols-3 gap-3">
          <label class="block">
            <div class="mono text-[10px] tracking-label uppercase text-mute mb-1">turn temperature (0..2)</div>
            <input class="field" data-tnum="turnTemperature" type="number" step="0.05" min="0" max="2" value="${typeof t.turnTemperature === 'number' ? t.turnTemperature : ''}" placeholder="0.85" />
          </label>
          <label class="block">
            <div class="mono text-[10px] tracking-label uppercase text-mute mb-1">turn max tokens</div>
            <input class="field" data-tnum="turnMaxTokens" type="number" min="1" max="32000" value="${typeof t.turnMaxTokens === 'number' ? t.turnMaxTokens : ''}" placeholder="1200" />
          </label>
          <label class="block">
            <div class="mono text-[10px] tracking-label uppercase text-mute mb-1">memory window (turns)</div>
            <input class="field" data-tnum="memoryWindowSize" type="number" min="1" max="500" value="${typeof t.memoryWindowSize === 'number' ? t.memoryWindowSize : ''}" placeholder="50" />
          </label>
        </div>
      </div>

      <div class="flex justify-end pt-3 border-t border-line">
        <button id="defaults-save" class="btn btn-primary">save defaults</button>
      </div>
    </div>`;

  document.getElementById('defaults-save').addEventListener('click', async () => {
    const body = {};
    elContent.querySelectorAll('[data-t]').forEach((el) => {
      const v = el.value;
      body[el.dataset.t] = v.trim() ? v : null;
    });
    elContent.querySelectorAll('[data-tarr]').forEach((el) => {
      const arr = el.value.split(',').map((s) => s.trim()).filter(Boolean);
      body[el.dataset.tarr] = arr.length ? arr : null;
    });
    elContent.querySelectorAll('[data-tnum]').forEach((el) => {
      const v = el.value.trim();
      if (!v) { body[el.dataset.tnum] = null; return; }
      const n = Number(v);
      body[el.dataset.tnum] = Number.isFinite(n) ? n : null;
    });
    const r = await fetchJson('/api/kata/admin/tavern-config', { method: 'PATCH', body });
    if (r) flash('defaults saved', 'success');
  });
}

function flash(msg, kind) { window.KataShell?.toast(msg, kind ? { kind } : undefined); }

bootstrap();
</script>
</body>
</html>
