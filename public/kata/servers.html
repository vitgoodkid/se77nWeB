<script>
// Phase 11 — servers list wired to /api/kata/me
//
// Auth gate: 401 → redirect to /api/auth/discord/start (forces re-login if
// token pre-dates the guilds scope upgrade). 403 with reauth_required → same.
//
// Search filter is client-side over both managed + invite lists.

const ACCENTS = ['#E04545','#D4A858','#5BA868','#7a9eb5','#9bb4ff','#c46868','#c9a653'];

function avatarBlock(g, size) {
  const px = size === 'lg' ? 12 : 10;
  const fontPx = size === 'lg' ? 16 : 13;
  const radius = size === 'lg' ? 10 : 8;
  if (g.iconUrl) {
    return `<img src="${g.iconUrl}" alt="" style="width:${px*4}px;height:${px*4}px;border-radius:${radius}px;object-fit:cover;flex-shrink:0;border:1px solid rgba(255,255,255,0.08)" />`;
  }
  // Two-char initial fallback. Pick a stable accent from guildId hash so the
  // colour doesn't reshuffle on refresh.
  const seed = [...g.id].reduce((a, c) => a + c.charCodeAt(0), 0);
  const accent = ACCENTS[seed % ACCENTS.length];
  const initials = g.name.replace(/[^A-Za-z0-9À-ỹ]/g, '').slice(0, 2).toUpperCase() || '??';
  return `<div class="grid place-items-center flex-shrink-0 mono font-extrabold" style="width:${px*4}px;height:${px*4}px;border-radius:${radius}px;background:linear-gradient(135deg,${accent},${accent}55);color:#0d0a08;font-size:${fontPx}px">${initials}</div>`;
}

function managedCard(g) {
  const badge = g.botOwnerView
    ? '<span class="mono text-[9px] tracking-label uppercase px-2 py-0.5 rounded-full" style="background:#7a9eb518;border:1px solid #7a9eb540;color:#7a9eb5">BOT OWNER VIEW</span>'
    : (g.isOwner ? '<span class="mono text-[9px] tracking-label uppercase px-2 py-0.5 rounded-full" style="background:#D4A85818;border:1px solid #D4A85840;color:#D4A858">OWNER</span>' : '');
  return `<a href="overview.html?guild=${encodeURIComponent(g.id)}" class="server-card flex items-center gap-5 p-5 rounded-[14px] border border-line bg-panel" data-name="${(g.name||'').toLowerCase()}">
    ${avatarBlock(g, 'lg')}
    <div class="flex-1 min-w-0">
      <div class="flex items-baseline gap-3">
        <div class="text-[17px] font-medium tracking-[-0.01em] text-ink truncate">${escapeHtml(g.name)}</div>
        <div class="mono text-[9px] tracking-label uppercase text-mute2">${g.id}</div>
        ${badge}
      </div>
      <div class="mono text-[11px] text-mute mt-1.5 flex items-center gap-3">
        <span class="flex items-center gap-1.5"><span class="w-1.5 h-1.5 rounded-full bg-green dot-pulse"></span><span>online</span></span>
      </div>
    </div>
    <div class="mono text-[10px] tracking-label uppercase text-red flex items-center gap-1">manage <span>→</span></div>
  </a>`;
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, (c) => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
}

function emptyManaged() {
  return `<div class="rounded-[14px] border border-line bg-panel/40 p-8 text-center">
    <div class="mono text-[11px] text-mute">Bạn không có server nào để quản lý.</div>
    <div class="mono text-[10px] text-mute2 mt-2">Cần là admin/owner của server có bot KataS đang ở.</div>
  </div>`;
}

async function loadKata() {
  const counts = document.getElementById('kata-counts');
  const managedList = document.getElementById('kata-managed-list');
  const managedLabel = document.getElementById('kata-managed-label');

  managedList.innerHTML = '';
  counts.textContent = 'Đang tải…';

  try {
    const r = await fetch('/api/kata/me', { credentials: 'same-origin' });
    if (r.status === 401) {
      renderLoginRequired('Đăng nhập với Discord để xem các server bạn quản lý.');
      return;
    }
    if (r.status === 403) {
      const data = await r.json().catch(() => ({}));
      if (data.error === 'reauth_required') {
        renderLoginRequired('Phiên đăng nhập cũ chưa có quyền xem server. Đăng nhập lại để cấp quyền.');
        return;
      }
      if (data.error === 'discord_required') {
        renderLoginRequired('Cần đăng nhập bằng Discord (không phải Google) để xem server.');
        return;
      }
      counts.innerHTML = `<span class="text-err">${escapeHtml(data.message || 'Forbidden')}</span>`;
      return;
    }
    if (!r.ok) throw new Error('http ' + r.status);
    const data = await r.json();

    const chip = document.getElementById('kata-user-chip');
    if (chip && data.user) {
      const initial = (data.user.displayName || data.user.username || '?').slice(0, 1).toUpperCase();
      chip.innerHTML = (data.user.avatarUrl
        ? `<img src="${data.user.avatarUrl}" alt="" style="width:26px;height:26px;border-radius:9999px;object-fit:cover;border:1px solid rgba(255,255,255,0.08)" />`
        : `<span class="w-[26px] h-[26px] rounded-full grid place-items-center text-[11px] font-extrabold" style="background:#E0454522;color:#E04545">${initial}</span>`)
        + `<span class="max-w-[96px] truncate">${escapeHtml(data.user.displayName || data.user.username || '—')}</span>`
        + `<span class="text-mute text-[9px]">▾</span>`;
    }

    const ownerExtras = data.managed.filter((g) => g.botOwnerView).length;
    const ownerNote = data.user?.isOwner && ownerExtras > 0
      ? ` · <span class="text-info">${ownerExtras} bot-owner view</span>`
      : '';
    counts.innerHTML = `Bạn quản lý <span class="text-ink">${data.counts.managed}</span> server${ownerNote}`;

    // Reveal the admin → link in the header for the bot owner only.
    if (data.user?.isOwner) {
      const adminLink = document.getElementById('admin-link');
      if (adminLink) adminLink.classList.remove('hidden');
    }

    managedLabel.textContent = `managed · ${data.managed.length} server${data.managed.length === 1 ? '' : 's'}`;

    managedList.innerHTML = data.managed.length ? data.managed.map(managedCard).join('') : emptyManaged();
  } catch (e) {
    console.error('kata load failed', e);
    counts.innerHTML = `<span class="text-err">Lỗi tải dữ liệu — thử refresh.</span>`;
  }
}

function renderLoginRequired(reason) {
  const counts = document.getElementById('kata-counts');
  const managedList = document.getElementById('kata-managed-list');
  const managedLabel = document.getElementById('kata-managed-label');

  if (counts) counts.innerHTML = `<span class="text-mute">Bạn chưa đăng nhập.</span>`;
  if (managedLabel) managedLabel.textContent = 'managed';
  if (!managedList) return;

  managedList.innerHTML = `
    <div class="rounded-[14px] border border-line bg-panel p-10 text-center" style="background:linear-gradient(180deg,rgba(224,69,69,0.04),transparent)">
      <div class="mx-auto w-12 h-12 rounded-[12px] grid place-items-center mb-5" style="background:#5865F222;border:1px solid #5865F255">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="#5865F2"><path d="M20.317 4.37a19.79 19.79 0 0 0-4.885-1.515.074.074 0 0 0-.079.037c-.21.375-.444.865-.608 1.25a18.27 18.27 0 0 0-5.487 0 12.64 12.64 0 0 0-.617-1.25.077.077 0 0 0-.079-.037A19.74 19.74 0 0 0 3.677 4.37a.07.07 0 0 0-.032.028C.533 9.046-.32 13.58.099 18.058a.082.082 0 0 0 .031.056 19.9 19.9 0 0 0 5.993 3.03.078.078 0 0 0 .084-.028c.462-.63.873-1.295 1.226-1.994a.076.076 0 0 0-.041-.106 13.1 13.1 0 0 1-1.872-.892.077.077 0 0 1-.008-.128c.126-.094.252-.192.372-.291a.074.074 0 0 1 .078-.01c3.928 1.793 8.18 1.793 12.061 0a.074.074 0 0 1 .079.01c.12.099.246.197.373.291a.077.077 0 0 1-.006.128 12.3 12.3 0 0 1-1.873.891.076.076 0 0 0-.04.107c.36.698.772 1.363 1.225 1.993a.076.076 0 0 0 .084.028 19.84 19.84 0 0 0 6.002-3.03.077.077 0 0 0 .032-.054c.5-5.177-.838-9.674-3.549-13.66a.061.061 0 0 0-.031-.029zM8.02 15.33c-1.183 0-2.157-1.085-2.157-2.419 0-1.333.955-2.419 2.157-2.419 1.21 0 2.176 1.095 2.157 2.42 0 1.333-.956 2.418-2.157 2.418zm7.975 0c-1.183 0-2.157-1.085-2.157-2.419 0-1.333.955-2.419 2.157-2.419 1.21 0 2.176 1.095 2.157 2.42 0 1.333-.946 2.418-2.157 2.418z"/></svg>
      </div>
      <div class="text-[16px] font-medium text-ink mb-2">Cần đăng nhập</div>
      <div class="mono text-[12px] text-mute mb-6 max-w-md mx-auto">${escapeHtml(reason)}</div>
      <a href="/api/auth/discord/start" class="mono inline-flex items-center gap-2 h-10 px-5 rounded-[10px] uppercase tracking-label text-[11px] font-bold text-bg" style="background:#5865F2">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><path d="M20.317 4.37a19.79 19.79 0 0 0-4.885-1.515.074.074 0 0 0-.079.037c-.21.375-.444.865-.608 1.25a18.27 18.27 0 0 0-5.487 0 12.64 12.64 0 0 0-.617-1.25.077.077 0 0 0-.079-.037A19.74 19.74 0 0 0 3.677 4.37a.07.07 0 0 0-.032.028C.533 9.046-.32 13.58.099 18.058a.082.082 0 0 0 .031.056 19.9 19.9 0 0 0 5.993 3.03.078.078 0 0 0 .084-.028c.462-.63.873-1.295 1.226-1.994a.076.076 0 0 0-.041-.106 13.1 13.1 0 0 1-1.872-.892.077.077 0 0 1-.008-.128c.126-.094.252-.192.372-.291a.074.074 0 0 1 .078-.01c3.928 1.793 8.18 1.793 12.061 0a.074.074 0 0 1 .079.01c.12.099.246.197.373.291a.077.077 0 0 1-.006.128 12.3 12.3 0 0 1-1.873.891.076.076 0 0 0-.04.107c.36.698.772 1.363 1.225 1.993a.076.076 0 0 0 .084.028 19.84 19.84 0 0 0 6.002-3.03.077.077 0 0 0 .032-.054c.5-5.177-.838-9.674-3.549-13.66a.061.061 0 0 0-.031-.029zM8.02 15.33c-1.183 0-2.157-1.085-2.157-2.419 0-1.333.955-2.419 2.157-2.419 1.21 0 2.176 1.095 2.157 2.42 0 1.333-.956 2.418-2.157 2.418zm7.975 0c-1.183 0-2.157-1.085-2.157-2.419 0-1.333.955-2.419 2.157-2.419 1.21 0 2.176 1.095 2.157 2.42 0 1.333-.946 2.418-2.157 2.418z"/></svg>
        Đăng nhập với Discord
      </a>
    </div>`;
}

document.getElementById('kata-refresh')?.addEventListener('click', loadKata);

document.getElementById('kata-search')?.addEventListener('input', (e) => {
  const q = e.target.value.trim().toLowerCase();
  for (const el of document.querySelectorAll('[data-name]')) {
    el.style.display = !q || el.dataset.name.includes(q) ? '' : 'none';
  }
});

// Make this configurable per deploy — Vercel env or inline. Falls back to the
// KataS production app id used in PLAN.md / Discord Developer Portal.
window.KATA_BOT_CLIENT_ID = window.KATA_BOT_CLIENT_ID || '1505598795738644701';

loadKata();
</script>
