<link rel="preconnect" href="https://fonts.googleapis.com" />

<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700;800&family=Pixelify+Sans:wght@500;700&family=Silkscreen:wght@400;700&family=VT323&display=swap" rel="stylesheet" />
<script src="https://cdn.tailwindcss.com"></script>
<script>
  // B · Pixel Lobby palette: colour channels come from _shell.js (light + dark).
  tailwind.config = { theme: { extend: {
    colors: {
      bg:'rgb(var(--c-bg) / <alpha-value>)', panel:'rgb(var(--c-panel) / <alpha-value>)', panel2:'rgb(var(--c-panel2) / <alpha-value>)',
      ink:'rgb(var(--c-ink) / <alpha-value>)', red:'rgb(var(--c-red) / <alpha-value>)', green:'rgb(var(--c-green) / <alpha-value>)',
      gold:'rgb(var(--c-gold) / <alpha-value>)', info:'rgb(var(--c-info) / <alpha-value>)', warn:'rgb(var(--c-warn) / <alpha-value>)',
      err:'rgb(var(--c-err) / <alpha-value>)', purple:'rgb(var(--c-purple) / <alpha-value>)',
      line:'var(--c-line)', line2:'var(--c-line2)', mute:'var(--c-mute)', mute2:'var(--c-mute2)',
    },
    fontFamily: { sans:['"JetBrains Mono"','ui-monospace','monospace'], mono:['"JetBrains Mono"','ui-monospace','monospace'], pixel:['"Pixelify Sans"','monospace'], sk:['Silkscreen','monospace'] },
    letterSpacing: { kicker:'0.22em', label:'0.18em', tag:'0.12em' },
  }}};
</script>
<style>
  /* servers · page pieces. Chrome, palette and the k-* kit come from _shell.js. */
  .sv-wrap { max-width: 1200px; margin: 0 auto; }
  .sv-head { display:flex; flex-wrap:wrap; align-items:flex-end; justify-content:space-between; gap:20px; margin-bottom:30px; }
  .sv-table { padding: 10px 26px 14px; }
  .sv-th { display:flex; align-items:center; gap:16px; padding:14px 6px 12px; border-bottom:3px solid var(--ink); }
  .server-card { display:flex; align-items:center; gap:16px; padding:16px 6px; color:inherit; text-decoration:none; border-bottom:3px dashed var(--rule); }
  .server-card:last-child { border-bottom:0; }
  .server-card:hover { background: var(--cream); }
  .server-card:hover .sv-go { transform: translate(-1px,-1px); }
  .sv-av { width:44px; height:44px; flex:none; display:grid; place-items:center; font-family:var(--k-pf);font-size-adjust:var(--k-fsa); font-size:17px; font-weight:700; color:#1b1410; box-shadow:0 0 0 3px var(--ink); object-fit:cover; }
  .sv-go { flex:none; height:38px; padding:0 14px; background:var(--ka)!important; color:#1b1410!important; }
  .sv-hlink { height:34px!important; padding:0 12px!important; }

  @media (max-width: 768px) {
    .sv-table { padding: 6px 14px 10px; }
    .server-card { flex-wrap: wrap; }
    .sv-go { margin-left: 60px; }
    footer { grid-template-columns: 1fr !important; gap: 6px !important; }
    footer span { text-align: center !important; }
  }
</style>
</head>
<body class="bg-bg text-ink min-h-screen overflow-x-hidden">
<script src="_strings.js"></script>
<script src="_shell.js"></script>

<!-- top bar (HUD) -->
<header class="fixed top-0 inset-x-0 h-16 z-50 flex items-center justify-between px-6">
  <div class="flex items-center gap-5">
    <a href="/" class="k-logo" title="Về se77n.com">
      <span class="k-word">se<span class="k-77">77</span>n<span class="k-sfx">/ kata</span></span>
      <span class="k-sub">Experiment 007 · katas dashboard</span>
    </a>
    <a href="/" class="k-lobby" aria-label="Back to the se77n lobby"><svg width="9" height="15" viewBox="0 0 3 5" shape-rendering="crispEdges" aria-hidden="true"><path d="M2 0h1v5H2V4H1V3H0V2h1V1h1z" fill="currentColor"/></svg><span class="k-lobby-t">LOBBY</span></a>
    <!-- breadcrumb -->
    <div class="k-bc flex items-center gap-2 mono text-[10px] tracking-label uppercase">
      <a href="index.html" class="text-mute hover:text-ink">se77n</a>
      <span class="text-mute2">›</span>
      <a href="index.html" class="text-mute hover:text-ink">kata</a>
      <span class="text-mute2">›</span>
      <span class="text-ink" data-i18n="bc.servers">servers</span>
    </div>
    <a href="me-history.html" class="k-sbtn sv-hlink" data-i18n="btn.my-history">my history →</a>
    <a id="admin-link" href="admin.html" class="k-sbtn sv-hlink" style="background:#ffd25e!important;color:#1b1410!important" data-i18n="btn.admin">admin →</a>
  </div>

  <div id="kata-header-actions" class="flex items-center gap-2.5"></div>
</header>

<main class="relative z-10 pt-20 pb-16 px-8">
 <div class="sv-wrap">

  <!-- page header -->
  <div class="sv-head">
    <div>
      <div class="mono text-[10px] uppercase tracking-kicker text-mute mb-2">SECTION · SERVERS</div>
      <h1 class="text-[46px] leading-none lowercase">servers<span style="color:#e04545">.</span></h1>
      <div id="kata-counts" class="mono text-[13px] text-mute mt-3">Đang tải…</div>
    </div>
    <div class="flex flex-wrap items-center gap-5" style="padding:3px 8px 8px 3px">
      <div class="relative">
        <label for="kata-search" class="sr-only">search</label>
        <input id="kata-search" placeholder="tìm server…" class="mono h-9 pl-10 pr-3 w-[280px] text-[13px] text-ink focus:outline-none" data-i18n="btn.search-servers" data-i18n-attr="placeholder" />
        <svg class="absolute left-3 top-3 text-mute" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="square" aria-hidden="true"><rect x="4" y="4" width="12" height="12"/><path d="M16 16l5 5"/></svg>
      </div>
      <button id="kata-refresh" class="mono h-9 px-3.5 rounded-[10px] border border-line text-mute hover:text-ink text-[10px] tracking-label uppercase" data-i18n="btn.refresh">↻ refresh</button>
    </div>
  </div>

  <!-- ════════ MANAGED SERVERS ════════ -->
  <div class="mb-5 flex items-baseline gap-4">
    <div class="mono text-[10px] uppercase tracking-kicker text-mute flex flex-wrap items-center gap-3">
      <span id="kata-managed-label" class="text-ink">managed</span>
      <span class="dot-pulse w-2 h-2 bg-green"></span>
      <span class="text-mute normal-case">(admin/owner · bot trong server)</span>
    </div>
  </div>

  <div id="kata-managed-list" class="mb-12"></div>

  <!-- footer -->
  <footer class="grid grid-cols-3 items-center mono text-[10px] tracking-kicker text-mute mt-14 pt-5 border-t border-line">
    <span class="text-left">KATAS · V0.3.1 · UPTIME 7D 04H</span>
    <span class="text-center flex items-center gap-2 justify-center"><span class="w-2 h-2 bg-green dot-pulse"></span>STATUS · OK</span>
    <span class="text-right">© SE77N</span>
  </footer>
 </div>
</main>

<script>
// Phase 11 — servers list wired to /api/kata/me
//
// Auth gate: 401 → redirect to /api/auth/discord/start (forces re-login if
// token pre-dates the guilds scope upgrade). 403 with reauth_required → same.
//
// Search filter is client-side over both managed + invite lists.

// Arcade accent fills (always ink text on top).
const ACCENTS = ['#ff7a7a','#ffd25e','#7fd18b','#9fd8ff','#b9a2ff','#ff9ad5','#66d9d2','#ffa764'];
const DISCORD_SVG = '<svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"currentColor\" aria-hidden=\"true\"><path d=\"M20.317 4.37a19.79 19.79 0 0 0-4.885-1.515.074.074 0 0 0-.079.037c-.21.375-.444.865-.608 1.25a18.27 18.27 0 0 0-5.487 0 12.64 12.64 0 0 0-.617-1.25.077.077 0 0 0-.079-.037A19.74 19.74 0 0 0 3.677 4.37a.07.07 0 0 0-.032.028C.533 9.046-.32 13.58.099 18.058a.082.082 0 0 0 .031.056 19.9 19.9 0 0 0 5.993 3.03.078.078 0 0 0 .084-.028c.462-.63.873-1.295 1.226-1.994a.076.076 0 0 0-.041-.106 13.1 13.1 0 0 1-1.872-.892.077.077 0 0 1-.008-.128c.126-.094.252-.192.372-.291a.074.074 0 0 1 .078-.01c3.928 1.793 8.18 1.793 12.061 0a.074.074 0 0 1 .079.01c.12.099.246.197.373.291a.077.077 0 0 1-.006.128 12.3 12.3 0 0 1-1.873.891.076.076 0 0 0-.04.107c.36.698.772 1.363 1.225 1.993a.076.076 0 0 0 .084.028 19.84 19.84 0 0 0 6.002-3.03.077.077 0 0 0 .032-.054c.5-5.177-.838-9.674-3.549-13.66a.061.061 0 0 0-.031-.029zM8.02 15.33c-1.183 0-2.157-1.085-2.157-2.419 0-1.333.955-2.419 2.157-2.419 1.21 0 2.176 1.095 2.157 2.42 0 1.333-.956 2.418-2.157 2.418zm7.975 0c-1.183 0-2.157-1.085-2.157-2.419 0-1.333.955-2.419 2.157-2.419 1.21 0 2.176 1.095 2.157 2.42 0 1.333-.946 2.418-2.157 2.418z\"/></svg>';

function avatarBlock(g, size) {
  const px = size === 'lg' ? 12 : 10;
  const fontPx = size === 'lg' ? 16 : 13;
  const radius = size === 'lg' ? 10 : 8;
  // Two-char initial fallback. Pick a stable accent from guildId hash so the
  // colour doesn't reshuffle on refresh.
  const seed = [...g.id].reduce((a, c) => a + c.charCodeAt(0), 0);
  const accent = ACCENTS[seed % ACCENTS.length];
  const initials = g.name.replace(/[^A-Za-z0-9À-ỹ]/g, '').slice(0, 2).toUpperCase() || '??';
  void px; void fontPx; void radius;
  const initialsTile = (display) => `<div class="sv-av" aria-hidden="true" style="display:${display};background:${accent}">${initials}</div>`;
  if (g.iconUrl) {
    // onerror: the stored icon hash can go stale (server changed its icon
    // since the bot last synced) — swap to initials instead of a broken img.
    return `<img src="${g.iconUrl}" alt="" loading="lazy" class="sv-av" onerror="this.style.display='none';this.nextElementSibling.style.display='grid'" />${initialsTile('none')}`;
  }
  return initialsTile('grid');
}

function managedCard(g) {
  const badge = g.botOwnerView
    ? '<span class="k-badge" style="background:#9fd8ff">BOT OWNER VIEW</span>'
    : (g.isOwner ? '<span class="k-badge" style="background:#ffd25e">OWNER</span>' : '');
  return `<a href="overview.html?guild=${encodeURIComponent(g.id)}" class="server-card" data-name="${(g.name||'').toLowerCase()}">
    ${avatarBlock(g, 'lg')}
    <div class="flex-1 min-w-0">
      <div class="flex flex-wrap items-center gap-3">
        <div class="text-[16px] font-bold text-ink truncate">${escapeHtml(g.name)}</div>
        ${badge}
      </div>
      <div class="mono text-[12px] text-mute mt-2 flex flex-wrap items-center gap-3">
        <span>${g.id}</span><span>·</span>
        <span class="flex items-center gap-2 text-green font-bold"><span class="w-2 h-2 bg-green dot-pulse"></span><span>online</span></span>
      </div>
    </div>
    <span class="k-sbtn sv-go">manage →</span>
  </a>`;
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, (c) => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
}

function emptyManaged() {
  return `<div class="k-say max-w-2xl mt-8">
    <span class="k-tag">KATAS SAYS:</span>
    <p class="k-kicker">NO SAVE DATA</p>
    <div class="text-[15px] text-ink mt-3">Bạn không có server nào để quản lý.</div>
    <div class="mono text-[12px] text-mute mt-2">Cần là admin/owner của server có bot KataS đang ở.</div>
    <span class="k-more k-bob" aria-hidden="true"></span>
  </div>`;
}

async function loadKata() {
  const counts = document.getElementById('kata-counts');
  const managedList = document.getElementById('kata-managed-list');
  const managedLabel = document.getElementById('kata-managed-label');

  managedList.innerHTML = '';
  counts.textContent = 'Đang tải…';

  try {
    const r = await fetch('/api/kata/me', { credentials: 'same-origin' });
    if (r.status === 401) {
      renderLoginRequired('Đăng nhập với Discord để xem các server bạn quản lý.');
      return;
    }
    if (r.status === 403) {
      const data = await r.json().catch(() => ({}));
      if (data.error === 'reauth_required') {
        renderLoginRequired('Phiên đăng nhập cũ chưa có quyền xem server. Đăng nhập lại để cấp quyền.');
        return;
      }
      if (data.error === 'discord_required') {
        renderLoginRequired('Cần đăng nhập bằng Discord (không phải Google) để xem server.');
        return;
      }
      counts.innerHTML = `<span class="text-err">${escapeHtml(data.message || 'Forbidden')}</span>`;
      return;
    }
    if (!r.ok) throw new Error('http ' + r.status);
    const data = await r.json();

    const chip = document.getElementById('kata-user-chip');
    if (chip && data.user) {
      const initial = (data.user.displayName || data.user.username || '?').slice(0, 1).toUpperCase();
      chip.innerHTML = (data.user.avatarUrl
        ? `<img src="${data.user.avatarUrl}" alt="" />`
        : `<span aria-hidden="true">${initial}</span>`)
        + `<span class="max-w-[96px] truncate">${escapeHtml(data.user.displayName || data.user.username || '—')}</span>`
        + `<span class="text-mute text-[9px]">▾</span>`;
    }

    const ownerExtras = data.managed.filter((g) => g.botOwnerView).length;
    const ownerNote = data.user?.isOwner && ownerExtras > 0
      ? ` · <span class="text-info">${ownerExtras} bot-owner view</span>`
      : '';
    counts.innerHTML = `Bạn quản lý <span class="text-ink">${data.counts.managed}</span> server${ownerNote}`;

    // Reveal the admin → link in the header for the bot owner only.
    if (data.user?.isOwner) {
      const adminLink = document.getElementById('admin-link');
      if (adminLink) adminLink.classList.remove('hidden');
    }

    managedLabel.textContent = `managed · ${data.managed.length} server${data.managed.length === 1 ? '' : 's'}`;

    managedList.innerHTML = data.managed.length
      ? `<div class="sv-table k-px bg-panel k-rise"><div class="sv-th k-kicker" aria-hidden="true"><span style="width:44px"></span><span class="flex-1">server</span><span>action</span></div>${data.managed.map(managedCard).join('')}</div>`
      : emptyManaged();
  } catch (e) {
    console.error('kata load failed', e);
    counts.innerHTML = `<span class="text-err font-bold">Lỗi tải dữ liệu — thử refresh.</span>`;
    managedList.innerHTML = `<div class="k-say max-w-2xl mt-8">
      <span class="k-tag">KATAS SAYS:</span>
      <p class="k-kicker">CONTINUE? · LINK LOST</p>
      <div class="text-[15px] text-ink mt-3">Lỗi tải dữ liệu — thử refresh.</div>
      <span class="k-more k-bob" aria-hidden="true"></span>
    </div>`;
  }
}

function renderLoginRequired(reason) {
  const counts = document.getElementById('kata-counts');
  const managedList = document.getElementById('kata-managed-list');
  const managedLabel = document.getElementById('kata-managed-label');

  if (counts) counts.innerHTML = `<span class="text-mute">Bạn chưa đăng nhập.</span>`;
  if (managedLabel) managedLabel.textContent = 'managed';
  if (!managedList) return;

  managedList.innerHTML = `
    <div class="k-say max-w-2xl mt-8 k-rise">
      <span class="k-tag">KATAS SAYS:</span>
      <div class="flex items-start gap-5">
        <span class="grid place-items-center flex-none" style="width:52px;height:52px;background:#b9a2ff;color:#1b1410;box-shadow:0 0 0 3px var(--ink)" aria-hidden="true">${DISCORD_SVG.replace('width="16" height="16"', 'width="26" height="26"')}</span>
        <div class="min-w-0">
          <p class="k-kicker">INSERT COIN · PLAYER 1</p>
          <div class="text-[20px] font-bold text-ink mt-2" style="font-family:var(--k-pf);font-size-adjust:var(--k-fsa)">Cần đăng nhập</div>
          <div class="mono text-[13px] text-mute mt-2 max-w-md">${escapeHtml(reason)}</div>
        </div>
      </div>
      <div class="flex flex-wrap gap-5 mt-7" style="padding:0 6px 6px 3px">
        <a href="/api/auth/discord/start" class="k-sbtn k-pri" style="height:44px;padding:0 18px">${DISCORD_SVG}Đăng nhập với Discord</a>
      </div>
      <span class="k-more k-bob" aria-hidden="true"></span>
    </div>`;
}

document.getElementById('kata-refresh')?.addEventListener('click', loadKata);

document.getElementById('kata-search')?.addEventListener('input', (e) => {
  const q = e.target.value.trim().toLowerCase();
  for (const el of document.querySelectorAll('[data-name]')) {
    el.style.display = !q || el.dataset.name.includes(q) ? '' : 'none';
  }
});

// Make this configurable per deploy — Vercel env or inline. Falls back to the
// KataS production app id used in PLAN.md / Discord Developer Portal.
window.KATA_BOT_CLIENT_ID = window.KATA_BOT_CLIENT_ID || '1505598795738644701';

loadKata();
</script>

</body>
</html>
