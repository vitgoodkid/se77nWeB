<script>
  // theme bootstrap — apply before paint to avoid FOUC
  (function () {
    var saved = null;
    try { saved = localStorage.getItem('kata.theme'); } catch (e) {}
    var qs = new URLSearchParams(location.search).get('theme');
    var theme = (qs === 'light' || qs === 'dark') ? qs : (saved || 'dark');
    document.documentElement.dataset.theme = theme;
  })();
</script>
<style>
  :root, :root[data-theme="dark"] {

  }
  html, body { background: rgb(var(--c-bg)); color: rgb(var(--c-ink)); font-family: Geist, system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
  .mono { font-family: 'JetBrains Mono', ui-monospace, monospace; }
  @keyframes pulse77 { 0%,100% { opacity:1; transform: scale(1); } 50% { opacity:.55; transform: scale(.82); } }
  .dot-pulse { animation: pulse77 2s ease-in-out infinite; }
  .glow77 { text-shadow: var(--c-glow); }
  .grain { background-image: radial-gradient(var(--c-grain) 1px, transparent 1px); background-size: 3px 3px; }
  .ambient { background-image:

  ::-webkit-scrollbar { width: 8px; height: 8px; }

<script>
const ACCENTS = ['#E04545','#D4A858','#5BA868','#7a9eb5','#9bb4ff','#c46868','#c9a653','#FF6B9D'];
function escapeHtml(s){return String(s ?? '').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function getGuildId(){ return new URL(window.location.href).searchParams.get('guild'); }
function avatarSeed(id){ const s=[...String(id||'')].reduce((a,c)=>a+c.charCodeAt(0),0); return ACCENTS[s%ACCENTS.length]; }
function fmtUsd(v){ const n = Number(v||0); return '$' + (n < 0.01 ? n.toFixed(4) : n.toFixed(2)); }
function fmtCount(n){ if (n == null) return '0'; if (n >= 1e6) return (n/1e6).toFixed(1) + 'M'; if (n >= 1e3) return (n/1e3).toFixed(1) + 'k'; return String(n); }
function showToast(msg, kind){
  const colors={ok:'#5BA868',err:'#c46868',info:'#7a9eb5'}; const c=colors[kind||'ok']||colors.ok;
  const el=document.createElement('div');
  el.className='mono text-[12px] px-4 py-2.5 rounded-[10px] mb-2 pointer-events-auto';
  el.style.cssText='background:'+c+'18;border:1px solid '+c+'55;color:'+c+';box-shadow:0 16px 40px -16px '+c+'99';
  el.textContent=msg; document.getElementById('toast').appendChild(el);
  setTimeout(function(){el.style.opacity='0';el.style.transition='opacity 200ms';setTimeout(function(){el.remove();},220);},3000);
}

let CURRENT_RANGE = '30d';

function renderRangePicker(){
  for (const btn of document.querySelectorAll('#range-picker [data-range]')){
    const active = btn.dataset.range === CURRENT_RANGE;
    btn.classList.toggle('text-ink', active);
    btn.classList.toggle('text-mute', !active);
    btn.style.background = active ? 'rgb(var(--c-panel2))' : 'transparent';
  }
  const labelMap = { '7d': '7 ngày', '30d': '30 ngày', '90d': '90 ngày' };
  document.getElementById('cost-range-label').textContent = 'total · ' + labelMap[CURRENT_RANGE];
}

async function loadGuildBootstrap(){
  const guildId = getGuildId();
  if (!guildId){ window.location.href = 'servers.html'; return false; }

  fetch('/api/auth/me', { credentials:'same-origin' }).then(r=>r.json()).then(({user}) => {
    if (!user) return;
    const chip = document.getElementById('kata-user-chip');
    const initial = (user.displayName || user.username || '?').slice(0,1).toUpperCase();
    const img = user.avatarUrl
      ? '<img src="'+user.avatarUrl+'" alt="" style="width:26px;height:26px;border-radius:9999px;object-fit:cover;border:1px solid rgba(255,255,255,0.08)" />'
      : '<span class="w-[26px] h-[26px] rounded-full grid place-items-center text-[11px] font-extrabold" style="background:#E0454522;color:#E04545">'+initial+'</span>';
    chip.innerHTML = img + '<span class="max-w-[96px] truncate">'+escapeHtml(user.displayName || user.username || '—')+'</span><span class="text-mute text-[9px]">▾</span>';
  }).catch(()=>{});

  const navMap = [
    ['nav-overview', 'overview.html'],
    ['nav-logs', 'logs-image.html'],
  ];
  for (const [id, sub] of navMap){
    const el = document.getElementById(id);
    if (el) el.href = sub + (sub.includes('?') ? '&' : '?') + 'guild=' + encodeURIComponent(guildId);
  }
  document.getElementById('bc-guild').href = 'overview.html?guild=' + encodeURIComponent(guildId);

  let r;
  try { r = await fetch('/api/kata/server/' + encodeURIComponent(guildId) + '?lite=1', { credentials:'same-origin' }); }
  catch { showToast('Lỗi mạng', 'err'); return false; }
  if (r.status === 401 || r.status === 403){
    document.querySelector('main').innerHTML = '<div class="rounded-[14px] border border-line bg-panel p-10 text-center max-w-xl mx-auto mt-20"><div class="text-[16px] font-medium text-ink mb-3">Cần đăng nhập với Discord (admin của server).</div><a href="/api/auth/discord/start" class="mono inline-flex items-center gap-2 h-10 px-5 rounded-[10px] uppercase tracking-label text-[11px] font-bold text-bg mt-3" style="background:#5865F2">đăng nhập với Discord</a><a href="servers.html" class="mono inline-flex items-center gap-2 h-10 px-5 rounded-[10px] uppercase tracking-label text-[11px] text-mute hover:text-ink mt-3 ml-2 border border-line">← danh sách server</a></div>';
    return false;
  }
  if (r.status === 404){ document.querySelector('main').innerHTML = '<div class="text-mute mt-20 text-center">Bot không có trong server này.</div>'; return false; }
  if (!r.ok){ showToast('Lỗi tải (HTTP ' + r.status + ')', 'err'); return false; }

  const data = await r.json();
  document.getElementById('kata-guild-name').textContent = data.guild.name;
  document.getElementById('bc-guild').textContent = data.guild.name;
  document.getElementById('kata-guild-meta').textContent = 'id · ' + data.guild.id;
  const st = data.stats || {};
  const navLogsMeta = document.getElementById('nav-logs-meta');
  if (navLogsMeta && st.events30d != null) navLogsMeta.textContent = Number(st.events30d).toLocaleString('vi-VN');
  const guildIcon = document.getElementById('kata-guild-icon');
  if (data.guild.iconUrl){
    guildIcon.innerHTML = '<img src="'+data.guild.iconUrl+'" alt="" style="width:74px;height:74px;border-radius:20px;object-fit:cover" />';
    guildIcon.style.background = 'transparent';
    guildIcon.style.border = 'none';
  } else {
    const initials = data.guild.name.replace(/[^A-Za-z0-9À-ỹ]/g,'').slice(0,2).toUpperCase() || '??';
    guildIcon.textContent = initials;
    const accent = avatarSeed(data.guild.id);
    guildIcon.style.background = 'linear-gradient(135deg,'+accent+','+accent+'55)';
  }
  return true;
}

// Per Server Detail design: TOTAL card + BY SERVICE + COMMANDS grid.
const SERVICE_COLORS = { fal: '#D4A858', yunwu: '#5BA868', nanogpt: '#8a7f78', '9router': '#E04545' };

function renderCostV2(data){
  // ── total ──
  document.getElementById('cost-total').textContent = fmtUsd(data.total);
  const events = data.byCommand.reduce((a,b)=>a+b.count,0);
  const d = data.totalDelta;
  const deltaEl = document.getElementById('cost-delta');
  if (d === 0){ deltaEl.textContent = events.toLocaleString('vi-VN') + ' events · ±0%'; deltaEl.className = 'mono text-[11px] mt-2.5 text-mute'; }
  else if (d > 0){ deltaEl.innerHTML = events.toLocaleString('vi-VN') + ' events · <span class="text-warn">▲ ' + d + '%</span>'; deltaEl.className = 'mono text-[11px] mt-2.5 text-mute'; }
  else { deltaEl.innerHTML = events.toLocaleString('vi-VN') + ' events · <span class="text-green">▼ ' + Math.abs(d) + '%</span>'; deltaEl.className = 'mono text-[11px] mt-2.5 text-mute'; }
  const avgPerCall = events > 0 ? data.total / events : 0;
  document.getElementById('cost-prior-note').textContent = 'avg ' + fmtUsd(avgPerCall) + ' / call · vs ' + data.range + ' trước';

  // ── by service (fold byModel → service) ──
  const svcMap = {};
  for (const m of data.byModel){
    const key = m.service || '—';
    if (!svcMap[key]) svcMap[key] = { name: key, cost: 0, count: 0 };
    svcMap[key].cost += m.cost; svcMap[key].count += m.count;
  }
  const services = Object.values(svcMap).sort((a,b)=>b.cost-a.cost);
  const svcTotal = Math.max(data.total, 0.0001);
  document.getElementById('byservice-total').textContent = fmtUsd(data.total) + ' · ' + services.length + ' services';
  document.getElementById('byservice-rows').innerHTML = services.length === 0
    ? '<div class="mono text-[11px] text-mute2 py-2">Chưa có chi phí</div>'
    : services.map((s)=>{
        const pct = Math.max(2, Math.round((s.cost / svcTotal) * 100));
        const color = SERVICE_COLORS[s.name] || '#8a7f78';
        return '<div style="margin-bottom:14px"><div class="flex items-baseline" style="gap:10px">'
          + '<span class="mono text-[12.5px] text-ink" style="font-weight:700">' + escapeHtml(s.name) + '</span>'
          + '<span class="flex-1"></span>'
          + '<span class="mono text-[12.5px] text-gold" style="font-weight:800">' + fmtUsd(s.cost) + '</span>'
          + '<span class="mono text-[10.5px] text-mute2">· ' + s.count.toLocaleString('vi-VN') + '</span></div>'
          + '<div style="height:5px;border-radius:99px;background:rgb(var(--c-panel2));margin-top:8px;overflow:hidden"><div style="height:100%;border-radius:99px;width:' + pct + '%;background:' + color + ';transition:width .5s ease"></div></div></div>';
      }).join('');

  // ── commands (2-col grid, bar relative to max) ──
  const rows = data.byCommand;
  const maxCmd = Math.max(0.0001, ...rows.map(r=>r.cost));
  document.getElementById('bycommand-grid').innerHTML = rows.length === 0
    ? '<div class="mono text-[11px] text-mute2 py-2">Chưa có lệnh nào chạy</div>'
    : rows.map((r)=>{
        const pct = Math.max(1, Math.round((r.cost / maxCmd) * 100));
        return '<div style="padding:8px 0"><div class="flex items-baseline" style="gap:10px">'
          + '<span class="mono text-[12px] text-ink" style="font-weight:700">' + escapeHtml(r.command || '—') + '</span>'
          + '<span class="flex-1"></span>'
          + '<span class="mono text-[11.5px] text-gold" style="font-weight:800">' + fmtUsd(r.cost) + '</span>'
          + '<span class="mono text-[10px] text-mute2" style="width:40px;text-align:right">· ' + r.count.toLocaleString('vi-VN') + '</span></div>'
          + '<div style="height:3px;border-radius:99px;background:rgb(var(--c-panel2));margin-top:6px;overflow:hidden"><div style="height:100%;border-radius:99px;width:' + pct + '%;background:color-mix(in srgb, #D4A858 75%, transparent)"></div></div></div>';
      }).join('');
}

async function loadCost(){
  const guildId = getGuildId();
  let r;
  try { r = await fetch('/api/kata/server/' + encodeURIComponent(guildId) + '/cost?range=' + CURRENT_RANGE, { credentials:'same-origin' }); }
  catch { showToast('Lỗi mạng', 'err'); return; }
  if (!r.ok){ showToast('Lỗi tải (HTTP ' + r.status + ')', 'err'); return; }
  const data = await r.json();
  renderCostV2(data);
}

document.getElementById('range-picker').addEventListener('click', (e) => {
  const btn = e.target.closest('[data-range]');
  if (!btn || btn.dataset.range === CURRENT_RANGE) return;
  CURRENT_RANGE = btn.dataset.range;
  renderRangePicker();
  loadCost();
});
document.getElementById('btn-refresh').addEventListener('click', () => loadCost());

(async () => {
  renderRangePicker();
  const ok = await loadGuildBootstrap();
  if (ok) await loadCost();
})();
</script>
