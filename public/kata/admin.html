    colors: { bg:'#0d0a08', panel:'#15110d', panel2:'#1c1813', line:'rgba(255,255,255,0.08)', line2:'rgba(255,255,255,0.14)', ink:'#f5ede0', mute:'rgba(245,237,224,0.5)', mute2:'rgba(245,237,224,0.3)', red:'#E04545', green:'#5BA868', gold:'#D4A858' },
    fontFamily: { sans:['Geist','system-ui','sans-serif'], mono:['"JetBrains Mono"','ui-monospace','monospace'] },
    letterSpacing: { kicker:'0.22em', label:'0.18em', tag:'0.12em' },
  }}};

<style>
  html, body { background: #0d0a08; color: #ece6df; font-family: 'JetBrains Mono', ui-monospace, monospace; -webkit-font-smoothing: antialiased; }
  .mono { font-family: 'JetBrains Mono', ui-monospace, monospace; }
  .glow77 { text-shadow: 0 0 6px color-mix(in srgb, var(--accent, #E04545) 80%, transparent), 0 0 18px color-mix(in srgb, var(--accent, #E04545) 40%, transparent); }
  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-thumb { background: #2a2422; border-radius: 99px; border: 2px solid #0d0a08; }
  ::-webkit-scrollbar-track { background: transparent; }
  textarea::placeholder, input::placeholder { color: #57504b; }
  textarea:focus, input:focus { outline: none; }

  @keyframes ddIn { from { opacity: 0; transform: translateY(-6px); } to { opacity: 1; transform: translateY(0); } }
  @keyframes toastIn { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }
  @keyframes pageIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
  .page-in { animation: pageIn .25s ease; }

  /* ── cards ─────────────────────────────────────────────── */
  .card { background: #131010; border: 1px solid #272120; border-radius: 13px; transition: border-color .2s, transform .2s, box-shadow .2s; }
  .card:hover { border-color: #3a302c; }
  .card-lift:hover { transform: translateY(-2px); }
  .card-row:hover { transform: translateY(-2px); box-shadow: 0 14px 36px rgba(0,0,0,.35); }
  .card-log:hover { transform: translateX(4px); }

  /* ── nav ───────────────────────────────────────────────── */
  .navitem { display: flex; align-items: center; justify-content: space-between; padding: 11px 12px; border-radius: 8px; font-size: 10.5px; letter-spacing: .18em; font-weight: 800; text-transform: uppercase; color: #8a7f78; cursor: pointer; background: transparent; border-left: 2px solid transparent; transition: all .18s; }
  .navitem:hover { background: #15100f; color: #ece6df; transform: translateX(3px); }
  .navitem.on { color: #f3ede6; background: #1a1312; border-left-color: var(--accent); }
  .navitem .navdot { width: 6px; height: 6px; border-radius: 99px; background: transparent; }
  .navitem.on .navdot { background: var(--accent); }

  /* ── chips (filter pills) ──────────────────────────────── */
  .chip { padding: 9px 18px; border-radius: 99px; font-family: inherit; font-size: 10px; letter-spacing: .18em; font-weight: 800; cursor: pointer; border: 1px solid #2c2522; background: transparent; color: #8a7f78; transition: all .18s; }
  .chip:hover { transform: translateY(-2px); color: #ece6df; }
  .chip.on { background: color-mix(in srgb, var(--accent) 12%, transparent); color: var(--accent); border-color: color-mix(in srgb, var(--accent) 45%, transparent); }

  /* ── buttons ───────────────────────────────────────────── */
  .btn-accent { background: var(--accent); color: var(--accent-fg, #fff); padding: 15px 32px; border-radius: 11px; font-family: inherit; font-weight: 800; letter-spacing: .18em; font-size: 11.5px; border: none; cursor: pointer; transition: transform .18s, box-shadow .18s, background .6s; }
  .btn-accent:hover { transform: translateY(-2px); box-shadow: 0 12px 32px color-mix(in srgb, var(--accent) 35%, transparent); }
  .btn-accent:active { transform: translateY(0); }
  .btn-ghost { background: transparent; color: #8a7f78; padding: 15px 28px; border-radius: 11px; font-family: inherit; font-weight: 800; letter-spacing: .18em; font-size: 11.5px; border: 1px solid #2c2522; cursor: pointer; transition: all .18s; }
  .btn-ghost:hover { border-color: #57504b; color: #ece6df; transform: translateY(-2px); }
  .btn-manage { padding: 11px 18px; border-radius: 9px; background: transparent; border: 1px solid color-mix(in srgb, var(--accent) 40%, transparent); color: var(--accent); font-family: inherit; font-size: 10px; font-weight: 800; letter-spacing: .16em; cursor: pointer; transition: all .18s; white-space: nowrap; text-decoration: none; display: inline-block; }
  .btn-manage:hover { background: var(--accent); color: var(--accent-fg, #fff); transform: translateX(3px); box-shadow: 0 8px 24px color-mix(in srgb, var(--accent) 35%, transparent); }
  .btn-join { padding: 11px 16px; border-radius: 9px; background: transparent; border: 1px solid #2c2522; color: #8a7f78; font-family: inherit; font-size: 10px; font-weight: 800; letter-spacing: .16em; cursor: pointer; transition: all .18s; white-space: nowrap; }
  .btn-join:hover { border-color: color-mix(in srgb, var(--accent) 50%, transparent); color: #ece6df; transform: translateY(-1px); }
  .btn-join:disabled { opacity: .5; cursor: default; transform: none; }
  .btn-step { width: 40px; height: 40px; border-radius: 10px; background: #0e0b0a; border: 1px solid #2c2522; color: #8a7f78; font-family: inherit; font-size: 17px; cursor: pointer; transition: all .15s; }
  .btn-step:hover { border-color: color-mix(in srgb, var(--accent) 50%, transparent); color: #ece6df; transform: translateY(-1px); }
  .btn-use { padding: 0 18px; border-radius: 8px; border: none; color: #0b0908; font-family: inherit; font-size: 10.5px; font-weight: 800; letter-spacing: .16em; cursor: pointer; transition: transform .15s, box-shadow .15s; }
  .btn-use:hover { transform: translateY(-1px); box-shadow: 0 6px 18px rgba(0,0,0,.4); }

  /* ── settings fields ───────────────────────────────────── */
  .fld-head { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 18px 22px; border-bottom: 1px solid #1d1817; }
  .fld-title { font-size: 14.5px; font-weight: 800; letter-spacing: .14em; color: #f3ede6; }
  .fld-desc { font-size: 11.5px; color: #6b6058; margin-top: 6px; }
  .fld-status { font-size: 9px; letter-spacing: .16em; font-weight: 800; border-radius: 99px; padding: 3px 9px; border: 1px solid #332a26; color: #6b5f58; transition: all .25s; }
  .fld-status.on { color: var(--accent); border-color: var(--accent); }
  .fld-body { padding: 18px 22px 20px; opacity: .4; pointer-events: none; transition: opacity .25s; }
  .fld-body.on { opacity: 1; pointer-events: auto; }
  .tgl { width: 46px; height: 25px; flex: none; border-radius: 99px; border: 1px solid #332a26; background: #1f1a18; position: relative; cursor: pointer; transition: all .25s; }
  .tgl-knob { position: absolute; top: 3px; left: 3px; width: 17px; height: 17px; border-radius: 99px; background: #6b5f58; transform: translateX(0); transition: transform .25s cubic-bezier(.4,0,.2,1), background .25s; }
  .tgl.on { background: var(--accent); border-color: var(--accent); }
  .tgl.on .tgl-knob { transform: translateX(21px); background: var(--accent-fg, #fff); }

  .inp { width: 100%; background: #0e0b0a; border: 1px solid #2c2522; border-radius: 10px; padding: 14px 16px; font-family: inherit; font-size: 12.5px; line-height: 1.7; color: #ddd6cf; transition: border-color .2s, box-shadow .2s; }
  .inp:focus { border-color: color-mix(in srgb, var(--accent) 50%, transparent); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 8%, transparent); }
  textarea.inp { resize: vertical; }

  /* ── model dropdown ────────────────────────────────────── */
  .dd-trigger { width: 100%; display: flex; align-items: center; justify-content: space-between; gap: 12px; background: #0e0b0a; border: 1px solid #2c2522; border-radius: 10px; padding: 14px 16px; font-family: inherit; font-size: 13.5px; color: #ece6df; cursor: pointer; transition: border-color .2s, box-shadow .2s; text-align: left; }
  .dd-trigger:hover { border-color: color-mix(in srgb, var(--accent) 45%, transparent); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 7%, transparent); }
  .dd-panel { position: absolute; top: calc(100% + 8px); left: 0; right: 0; z-index: 40; background: #100d0c; border: 1px solid #332a26; border-radius: 12px; box-shadow: 0 28px 70px rgba(0,0,0,.65); animation: ddIn .16s ease; overflow: hidden; }
  .dd-panel.up { top: auto; bottom: calc(100% + 8px); }
  .dd-tab { padding: 7px 16px; border-radius: 8px; font-family: inherit; font-size: 10px; letter-spacing: .18em; font-weight: 800; cursor: pointer; border: 1px solid #2c2522; background: transparent; color: #6b5f58; transition: all .15s; }
  .dd-tab:hover { color: #ece6df; }
  .dd-item { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 11px 13px; border-radius: 8px; border: 1px solid transparent; color: #ddd6cf; font-size: 12.5px; cursor: pointer; transition: background .12s, transform .12s; }
  .dd-item:hover { background: #1c1614; transform: translateX(3px); }

  .provider-pill { font-size: 9px; color: #57504b; letter-spacing: .16em; flex: none; border: 1px solid #2c2522; border-radius: 99px; padding: 3px 8px; }
  .ovr-pill { font-size: 10px; letter-spacing: .14em; font-weight: 800; color: var(--accent); background: color-mix(in srgb, var(--accent) 10%, transparent); border: 1px solid color-mix(in srgb, var(--accent) 30%, transparent); border-radius: 99px; padding: 7px 14px; }

  .tag-pill { font-size: 8.5px; letter-spacing: .18em; font-weight: 800; border-radius: 99px; padding: 3px 9px; border: 1px solid #2c2522; }

  .bar-track { height: 4px; border-radius: 99px; background: #1d1817; margin-top: 7px; overflow: hidden; }
  .bar-fill { height: 100%; border-radius: 99px; transition: width .5s ease; }

  .stat-label { font-size: 9.5px; letter-spacing: .22em; color: #8a7f78; font-weight: 800; }
  .micro-label { font-size: 8.5px; letter-spacing: .2em; color: #57504b; font-weight: 800; }

  #toast-wrap { position: fixed; bottom: 24px; right: 24px; z-index: 90; }
  .toast { background: #102019; border: 1px solid #2c5a44; color: #5BA868; padding: 13px 20px; border-radius: 11px; font-size: 12px; font-weight: 700; animation: toastIn .22s ease; box-shadow: 0 18px 44px rgba(0,0,0,.55); }
  .toast.warn { background: #201210; border-color: #5a342c; color: #E04545; }

  .guild-chip { display: inline-flex; align-items: center; gap: 7px; border: 1px solid #2c2522; border-radius: 99px; padding: 4px 11px; min-width: 0; }

  /* ===================== MOBILE (≤768px) =====================
     The .hdr-logo class on the header logo opts this page OUT of
     _shell.js's generic drawer chrome — we render our own phone layout:
     sidebar → horizontal tab-chip bar, single-column content. */
  @media (max-width: 768px) {
    header { padding-left: 14px !important; padding-right: 14px !important; }
    .adm-sub, .adm-bc { display: none !important; }
    #kata-header-actions { gap: 6px !important; }
    #kata-header-actions > * { transform: scale(0.9); transform-origin: right center; }
    #kata-user-name { display: none !important; }
    #kata-theme-btn button > span:nth-child(2) { display: none !important; }

    /* sidebar → sticky horizontal tab-chip rail under the header */
    aside {
      top: 58px !important; left: 0 !important; right: 0 !important; bottom: auto !important;
      width: auto !important; height: auto !important;
      border-right: none !important; border-bottom: 1px solid #1d1817 !important;
      overflow-x: auto !important; overflow-y: hidden !important; -webkit-overflow-scrolling: touch;
    }
    aside::-webkit-scrollbar { height: 0; }
    aside nav { flex-direction: row !important; padding: 12px 14px 11px !important; gap: 8px !important; min-height: 0 !important; }
    .navitem { flex: 0 0 auto; justify-content: center; white-space: nowrap;
      border-left: none !important; border: 1px solid #2c2522 !important; border-radius: 999px !important;
      padding: 10px 16px !important; font-size: 10px !important; }
    .navitem.on { background: color-mix(in srgb, var(--accent) 14%, transparent) !important;
      border-color: color-mix(in srgb, var(--accent) 45%, transparent) !important; color: var(--accent) !important; transform: none !important; }
    .navitem:hover { transform: none !important; }
    .navitem .navdot { display: none !important; }
    aside > div { display: none !important; }   /* MY SERVERS footer */

    /* main: drop sidebar offset, clear fixed header + tab rail */
    main { padding-left: 0 !important; padding-top: 116px !important; }
    main > div { padding: 16px 16px 96px !important; max-width: 100% !important; }
    main > div > div:first-child { margin-bottom: 18px !important; }
    main h1.mono { font-size: 27px !important; margin: 8px 0 6px !important; }
    #page-counts { font-size: 11px !important; }

    /* collapse multi-column grids; keep the 3 stat tiles compact 3-up */
    main .grid { grid-template-columns: 1fr !important; gap: 12px !important; }
    main .grid.grid-cols-3 { grid-template-columns: 1fr 1fr 1fr !important; gap: 9px !important; }
    main .grid.grid-cols-3 .card { padding: 13px 12px !important; }
    main .grid.grid-cols-3 .card > div:last-child { font-size: 22px !important; margin-top: 6px !important; }
    main .grid.grid-cols-3 .stat-label { font-size: 8px !important; letter-spacing: .14em !important; }

    /* logs (v2 conversation): let bubbles use the full width on phones so the
       member/bot text isn't crammed into a narrow column */
    .log-thread .log-side { max-width: 100% !important; }

    /* settings: action buttons stretch full-width */
    #settings-save, #settings-reload { flex: 1; padding: 14px 0 !important; text-align: center; }

    .btn-accent:hover, .btn-ghost:hover, .card-row:hover, .card-log:hover, .card-lift:hover { transform: none !important; }
  }
</style>
</head>

<script>
const TABS = ['servers','logs','cost','settings'];
const params = new URLSearchParams(location.search);
let currentTab = TABS.includes(params.get('tab')) ? params.get('tab') : 'servers';
const IS_MOBILE = window.matchMedia('(max-width: 768px)').matches;

const PAGE_META = {
  servers:  { title: 'All Servers',     tag: 'SERVERS' },
  logs:     { title: 'Global Logs',     tag: 'LOGS' },
  cost:     { title: 'Global Cost',     tag: 'COST' },
  settings: { title: 'Global Settings', tag: 'SETTINGS' },
};

const elTag = document.getElementById('page-tag');
const elTitle = document.getElementById('page-title');
const elBcTab = document.getElementById('bc-tab');
const elCounts = document.getElementById('page-counts');
const elContent = document.getElementById('content');
const elAuthWarn = document.getElementById('auth-warning');
const elAuthMsg = document.getElementById('auth-warning-msg');
const elAuthLogin = document.getElementById('auth-login-btn');

// --accent-fg: text color sitting ON the accent (dark for gold/white themes,
// white for red/green). Shell only sets --accent, so derive here.
function applyAccentFg() {
  const hex = (getComputedStyle(document.documentElement).getPropertyValue('--accent') || '#E04545').trim();
  const m = /^#?([0-9a-f]{6})$/i.exec(hex);
  let fg = '#ffffff';
  if (m) {
    const n = parseInt(m[1], 16);
    const r = (n >> 16) & 255, g = (n >> 8) & 255, b = n & 255;
    const lum = (0.2126 * r + 0.7152 * g + 0.0722 * b) / 255;
    fg = lum > 0.62 ? '#1a1408' : '#ffffff';
  }
  document.documentElement.style.setProperty('--accent-fg', fg);
}
applyAccentFg();
document.addEventListener('kata:theme-change', applyAccentFg);

function setTabUI() {
  document.querySelectorAll('[data-tab]').forEach(a => a.classList.toggle('on', a.dataset.tab === currentTab));
  const meta = PAGE_META[currentTab];
  elTag.textContent = meta.tag;
  elTitle.textContent = meta.title;
  elBcTab.textContent = meta.tag;
}

function escapeHtml(s) {
  return String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
}

function fmtTime(d) {
  if (!d) return '—';
  const date = new Date(d);
  const diff = (Date.now() - date.getTime()) / 1000;
  if (diff < 60) return `${Math.floor(diff)}s`;
  if (diff < 3600) return `${Math.floor(diff/60)}m`;
  if (diff < 86400) return `${Math.floor(diff/3600)}h`;
  if (diff < 604800) return `${Math.floor(diff/86400)}d`;
  return date.toISOString().slice(0,10);
}

function fmtUSD(n) { return `$${Number(n ?? 0).toFixed(4)}`; }
function fmtUSD2(n) { return `$${Number(n ?? 0).toFixed(2)}`; }
function fmtNum(n) { return Number(n ?? 0).toLocaleString(); }

// Deterministic muted tile color per id — same trick the design used with
// hardcoded swatches, derived from the snowflake so it's stable.
const TILE_COLORS = ['#4a3358','#2e4438','#50392b','#56303a','#2b3d52','#583636','#403328','#43314f','#23404f','#3a3a30'];
function tileColor(id) {
  let h = 0;
  const s = String(id ?? '?');
  for (let i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) >>> 0;
  return TILE_COLORS[h % TILE_COLORS.length];
}

function avatarTile(url, name, id, size, radius) {
  const ini = escapeHtml(String(name ?? '?').slice(0, 2).toUpperCase());
  const fallback = `<span style="width:${size}px;height:${size}px;border-radius:${radius}px;background:${tileColor(id)};display:none;place-items:center;font-size:${Math.round(size*0.3)}px;font-weight:800;color:rgba(255,255,255,.85);flex:none">${ini}</span>`;
  if (url) {
    return `<img src="${escapeHtml(url)}" alt="" style="width:${size}px;height:${size}px;border-radius:${radius}px;object-fit:cover;flex:none" onerror="this.style.display='none';this.nextElementSibling.style.display='grid'" />` +
      fallback;
  }
  return `<span style="width:${size}px;height:${size}px;border-radius:${radius}px;background:${tileColor(id)};display:grid;place-items:center;font-size:${Math.round(size*0.3)}px;font-weight:800;color:rgba(255,255,255,.85);flex:none">${ini}</span>`;
}

async function fetchJson(url) {
  const r = await fetch(url, { credentials: 'include' });
  let body = null;
  try { body = await r.json(); } catch {}
  if (!r.ok) {
    if (body?.error === 'unauthenticated') {
      elAuthMsg.textContent = 'Cần đăng nhập Discord để vào admin.';
      elAuthLogin.classList.remove('hidden');
    } else if (body?.error === 'forbidden') {
      elAuthMsg.textContent = 'Owner only — bạn không có quyền vào trang này.';
    } else {
      elAuthMsg.textContent = body?.error ?? `lỗi ${r.status}`;
    }
    elAuthWarn.classList.remove('hidden');
    return null;
  }
  return body;
}

function clearAuthWarn() {
  elAuthWarn.classList.add('hidden');
  elAuthLogin.classList.add('hidden');
}

let toastTimer = null;
function showToast(msg, warn) {
  clearTimeout(toastTimer);
  const wrap = document.getElementById('toast-wrap');
  wrap.innerHTML = `<div class="toast mono${warn ? ' warn' : ''}">${escapeHtml(msg)}</div>`;
  toastTimer = setTimeout(() => { wrap.innerHTML = ''; }, 2600);
}

const TAG_STYLE = {
  chat:    { color: '#8a7f78', border: '#2c2522' },
  image:   { color: '#D4A858', border: 'rgba(212,168,88,.4)' },
  video:   { color: '#E04545', border: 'rgba(224,69,69,.4)' },

};

async function renderLogs() {
  const type = params.get('logtype') || 'chat';
  const chips = ['chat','image','video','command'].map(t =>
    `<button data-logtype="${t}" class="chip mono${t===type?' on':''}">${t.toUpperCase()}</button>`
  ).join('');
  elContent.innerHTML = `<div class="page-in">
    <div class="flex" style="gap:8px;margin-bottom:22px">${chips}</div>
    <div id="log-list" class="mono" style="font-size:11px;color:#57504b">loading…</div>
  </div>`;
  elContent.querySelectorAll('[data-logtype]').forEach(b => b.addEventListener('click', () => {
    const u = new URL(location.href); u.searchParams.set('logtype', b.dataset.logtype); history.replaceState(null, '', u);
    params.set('logtype', b.dataset.logtype);
    renderLogs();
  }));

  // Chat: pull assistant rows too (the API hides them unless role=all) so the
  // bot bubble can carry KataS's real reply, not a synthesized stub.
  const url = `/api/kata/admin/logs?type=${encodeURIComponent(type)}` + (type === 'chat' ? '&role=all' : '');
  const data = await fetchJson(url);
  if (!data) return;
  clearAuthWarn();
  elCounts.textContent = `${data.items.length} loaded · realtime feed`;
  const listEl = document.getElementById('log-list');
  if (!listEl) return;

  if (data.items.length === 0) {
    listEl.outerHTML = '<div class="mono" style="font-size:12px;letter-spacing:.18em;color:#57504b;padding:32px 0;text-align:center">— NO EVENTS —</div>';
    return;
  }

  let rowsHtml;
  if (type === 'chat') {
    // Real two-sided exchange: user message ↔ KataS's full reply.
    rowsHtml = pairChatItems(data.items).map((b) => {
      const left = b.user ? logMemberSide(b.user, 'chat') : '';
      let right = '';
      if (b.bot) {
        const reply = escapeHtml(b.bot.content ?? '') || '<span style="color:#57504b">—</span>';
        right = logBotSide(reply, logMetaArr(b.bot));
      }
      return `<div class="log-thread">${left}${right}</div>`;
    }).join('');
  } else {
    // image / video / command: one event row → member prompt + synthesized
    // outcome (these collections store a result, not assistant prose).
    rowsHtml = data.items.map((r) => {
      const thumbUrl = (type === 'image' || type === 'video') ? r.outputUrl : null;
      const thumbHtml = thumbUrl
        ? `<img src="${escapeHtml(thumbUrl)}" alt="" style="display:block;margin-top:9px;max-width:180px;max-height:120px;border-radius:9px;object-fit:cover" onerror="this.style.display='none'" />`
        : '';
      const reply = escapeHtml(logBotReply(type, r)) + thumbHtml;
      return `<div class="log-thread">${logMemberSide(r, type)}${logBotSide(reply, logMetaArr(r))}</div>`;
    }).join('');
  }
  listEl.outerHTML = `<div class="flex flex-col" style="gap:26px">${rowsHtml}</div>`;
}

// Pair each assistant row with the user message that triggered it. Chatlogs has
// no reply-id link, but assistant rows carry the requester's userId — so with
// items newest-first, the trigger is the nearest OLDER user row with the same
// userId + channelId (within 30min). Mirrors the per-server logs page.
function pairChatItems(items) {
  const blocks = [];
  const used = new Array(items.length).fill(false);
  for (let i = 0; i < items.length; i++) {
    if (used[i]) continue;
    const e = items[i];
    used[i] = true;
    if (e.role !== 'assistant') { blocks.push({ user: e, bot: null }); continue; }
    let match = -1;
    for (let j = i + 1; j < items.length; j++) {
      if (used[j]) continue;
      const u = items[j];
      if (u.role !== 'user' || u.userId !== e.userId || u.channelId !== e.channelId) continue;
      const dt = new Date(e.createdAt) - new Date(u.createdAt);
      if (dt >= 0 && dt < 30 * 60 * 1000) match = j;
      break;
    }
    if (match >= 0) { used[match] = true; blocks.push({ user: items[match], bot: e }); }
    else blocks.push({ user: null, bot: e });
  }
  return blocks;
}

function logMetaArr(r) {
  const meta = [];
  if (r.modelUsed) meta.push(`<span style="color:#8a7f78;font-weight:700">${escapeHtml(r.modelUsed)}</span>`);
  if (r.tokensIn != null || r.tokensOut != null) meta.push(`<span>in ${r.tokensIn ?? 0} · out ${r.tokensOut ?? 0}</span>`);
  if (r.durationSec) meta.push(`<span>${r.durationSec}s</span>`);
  if (r.latencyMs) meta.push(`<span>${r.latencyMs}ms</span>`);
  if (r.costUSD != null) meta.push(`<span style="color:#D4A858;font-weight:700">${fmtUSD(r.costUSD)}</span>`);
  return meta;
}

// Member message bubble (left). Body falls back across the per-type field names.
function logMemberSide(r, type) {
  const tag = TAG_STYLE[type] || TAG_STYLE.chat;
  const authorName = r.user?.displayName ?? r.user?.username ?? (r.userId ? r.userId.slice(-6) : 'unknown');
  const body = r.content ?? r.prompt ?? r.input ?? (r.command ? `/${r.command}` : '');
  const tsTitle = r.createdAt ? new Date(r.createdAt).toLocaleString('vi-VN', { hour12: false }) : '';
  const guildLabel = escapeHtml((r.guild?.name ?? '?').toUpperCase());
  const chanLabel = r.channelId ? `#${escapeHtml(r.channelId.slice(-6))}` : '';
  return `<div class="log-side" style="display:flex;align-items:flex-end;gap:11px;max-width:76%">
    ${avatarTile(r.user?.avatarUrl, authorName, r.userId, 32, 99)}
    <div style="min-width:0">
      <div class="flex items-center" style="gap:9px;margin:0 0 6px 4px;flex-wrap:wrap">
        <span style="font-size:12px;font-weight:700;color:#f3ede6;white-space:nowrap">${escapeHtml(authorName)}</span>
        <span style="font-size:8px;letter-spacing:.16em;font-weight:800;color:${tag.color};border:1px solid ${tag.border};border-radius:99px;padding:2px 8px;flex:none">${type.toUpperCase()}</span>
        <span style="font-size:9.5px;color:#57504b;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:200px">${guildLabel}${chanLabel ? ` · ${chanLabel}` : ''}</span>
        <span style="font-size:9.5px;color:#4a423d" title="${escapeHtml(tsTitle)}">· ${escapeHtml(fmtTime(r.createdAt))}</span>
      </div>
      <div style="display:inline-block;background:#1c1614;border:1px solid #2c2522;border-radius:4px 16px 16px 16px;padding:13px 17px;font-size:14px;line-height:1.55;color:#ece6df;word-break:break-word;white-space:pre-wrap">${escapeHtml(body) || '<span style="color:#57504b">—</span>'}</div>
    </div>
  </div>`;
}

// KataS bot reply bubble (right) + the gold "K" avatar. replyHtml is pre-escaped.
function logBotSide(replyHtml, meta) {
  return `<div class="log-side log-bot" style="display:flex;align-items:flex-end;justify-content:flex-end;gap:11px;max-width:80%;margin:12px 0 0 auto">
    <div style="min-width:0;text-align:right">
      <div class="flex items-center" style="justify-content:flex-end;gap:9px;margin:0 4px 6px 0">
        <span style="font-size:8px;letter-spacing:.14em;color:#6b6058;font-weight:800;border:1px solid #2c2522;border-radius:99px;padding:2px 8px">↳ BOT</span>
        <span style="font-size:12px;font-weight:700;color:#D4A858">KataS</span>
      </div>
      <div style="display:inline-block;text-align:left;background:rgba(212,168,88,.08);border:1px solid rgba(212,168,88,.28);border-radius:16px 4px 16px 16px;padding:13px 17px;font-size:13.5px;line-height:1.55;color:#ddd6cf;word-break:break-word;white-space:pre-wrap">${replyHtml}</div>
      ${meta.length > 0 ? `<div class="flex items-center" style="justify-content:flex-end;flex-wrap:wrap;gap:12px;margin:8px 6px 0 0;font-size:10px;color:#57504b">${meta.join('')}</div>` : ''}
    </div>
    <span style="width:32px;height:32px;border-radius:9px;background:linear-gradient(135deg,#D4A858,#8a6a2e);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:800;color:#1a1408;flex:none" title="KataS">K</span>
  </div>`;
}

// Outcome line for non-chat events (image / video / command have no assistant
// prose row — they store a result, so summarize it from the fields we have).
function logBotReply(type, r) {
  if (type === 'image') return r.outputUrl ? 'Đã tạo ảnh.' : 'Đang xử lý ảnh…';
  if (type === 'video') return r.outputUrl ? `Đã tạo video${r.durationSec ? ` · ${r.durationSec}s` : ''}.` : 'Đang xử lý video…';
  if (type === 'command') return r.success === false ? `✗ ${r.errorMessage || 'Lỗi khi chạy lệnh'}` : '✓ Đã thực thi lệnh.';
  return 'Đã trả lời.'; // unreached for chat — chat renders the real reply
}

      </div>
      <div class="card" style="padding:20px 22px">
        <div class="stat-label" style="margin-bottom:14px">COMMANDS (${data.byCommand.length})</div>
        <div class="flex flex-col" style="gap:4px">${cmdRows}</div>
      </div>
    </div>
  </div>`;
}

/* ==================== GLOBAL SETTINGS ==================== */
// Models grouped by provider — synced with the bot's real chains
// (apps/bot pricing + image/video pipelines). Provider keys are UI labels;
// ids that route to a non-default provider carry a `<provider>:` prefix.
const CHAT_MODELS_BY_PROVIDER = {
  YUNWU: [
    'gemini-3.1-flash-lite','gemini-3.1-flash-preview','gemini-3-flash-preview','gemini-3-pro-preview','gemini-3.1-pro-preview',
    'gemini-2.5-flash','gemini-2.5-flash-lite','gemini-2.5-pro',
    'claude-haiku-4-5','claude-sonnet-4-6','claude-opus-4-7',
    'grok-4','grok-4.1','grok-4-fast',
  ],
  '9ROUTER': ['9router:kr/claude-opus-4.7'],
};
const IMAGE_MODELS_BY_PROVIDER = {
  'FAL.AI': ['fal-ai/nano-banana-pro','fal-ai/gpt-image-2','xai/grok-imagine-image/quality/text-to-image'],
  NANOGPT: ['wavespeed-ai/flux-2-klein-base-9b/text-to-image'],
};
const VIDEO_MODELS_BY_PROVIDER = {
  'FAL.AI': [
    'bytedance/seedance-2.0/text-to-video','bytedance/seedance-2.0/image-to-video',
    'alibaba/happy-horse/text-to-video','alibaba/happy-horse/image-to-video',
    'xai/grok-imagine-video/text-to-video','xai/grok-imagine-video/image-to-video',
  ],
};
const PROVIDER_ACCENT = { YUNWU: '#5BA868', '9ROUTER': '#D4A858', 'FAL.AI': '#D4A858', NANOGPT: '#8a7f78' };

const SETTINGS_FIELDS = [
  { key: 'systemPrompt', type: 'textarea', title: 'SYSTEM PROMPT', desc: 'Persona mặc định của bot trên mọi guild', rows: 7, placeholder: '(trống — bot không dùng prompt phụ)' },
  { key: 'chatModel', type: 'model', title: 'CHAT MODEL', desc: 'Model trả lời tin nhắn', byProvider: CHAT_MODELS_BY_PROVIDER },
  { key: 'imageModel', type: 'model', title: 'IMAGE MODEL', desc: 'Primary của pipeline ảnh — fallback chain giữ nguyên phía sau', byProvider: IMAGE_MODELS_BY_PROVIDER },
  { key: 'videoModel', type: 'model', title: 'VIDEO MODEL', desc: 'Primary của pipeline video — fallback chain giữ nguyên phía sau', byProvider: VIDEO_MODELS_BY_PROVIDER, ddUp: true },
  { key: 'rateLimitPerUser', type: 'number', title: 'RATE LIMIT', desc: 'Mentions / user / giờ' },
  { key: 'allowedChannels', type: 'channels', title: 'ALLOWED CHANNELS', desc: 'Snowflake ID, mỗi dòng 1 kênh · trống = allow all', rows: 3, placeholder: '(trống = cho phép tất cả)' },
];

// Settings page state — mirrors the design's CODE ↔ OVERRIDE semantics:
// over[key]=false → PATCH null (bot dùng default trong code), true → PATCH value.
const ST = { cfg: {}, codeDef: {}, over: {}, values: {}, custom: {}, dirty: false, openDd: null, ddTab: {} };

function stripPrefix(v) { return v && v.includes(':') ? v.split(':').slice(1).join(':') : (v || ''); }

function markDirty() {
  ST.dirty = true;
  const el = document.getElementById('dirty-flag');
  if (el) el.style.display = '';
}

function setFieldUI(key) {
  const on = !!ST.over[key];
  const card = document.querySelector(`[data-fld="${key}"]`);
  if (!card) return;
  card.querySelector('.fld-status').textContent = on ? 'OVERRIDE' : 'CODE';
  card.querySelector('.fld-status').classList.toggle('on', on);
  card.querySelector('.tgl').classList.toggle('on', on);
  card.querySelector('.fld-body').classList.toggle('on', on);
  const cnt = Object.keys(ST.over).filter((k) => ST.over[k]).length;
  const pill = document.getElementById('ovr-count');
  if (pill) pill.textContent = `${cnt}/${SETTINGS_FIELDS.length} OVERRIDE`;
}

function closeDd() {
  ST.openDd = null;
  document.querySelectorAll('.dd-panel').forEach((e) => e.remove());
  document.querySelectorAll('[data-chev]').forEach((e) => { e.style.transform = 'rotate(0deg)'; });
}

// Close on outside click. A body-level backdrop can't work here: <main> is its
// own stacking context (relative z-10), so any fixed overlay outside it sits
// ABOVE the panel and eats the item clicks.
document.addEventListener('click', (e) => {
  if (ST.openDd && !e.target.closest('.dd-panel') && !e.target.closest('[data-ddtrigger]')) closeDd();
});

function providerOf(byProvider, value) {
  for (const [p, list] of Object.entries(byProvider)) if (list.includes(value)) return p;
  return Object.keys(byProvider)[0];
}

function openDd(field) {
  closeDd();
  ST.openDd = field.key;
  const anchor = document.querySelector(`[data-ddwrap="${field.key}"]`);
  const chev = anchor.querySelector('[data-chev]');
  if (chev) chev.style.transform = 'rotate(180deg)';

  const panel = document.createElement('div');
  panel.className = 'dd-panel' + (field.ddUp ? ' up' : '');
  anchor.appendChild(panel);

  const providers = Object.keys(field.byProvider);
  if (!ST.ddTab[field.key]) ST.ddTab[field.key] = providerOf(field.byProvider, ST.values[field.key]);

  function renderPanel() {
    const active = ST.ddTab[field.key];
    const accent = PROVIDER_ACCENT[active] || '#D4A858';
    const cur = ST.values[field.key] || '';

    const tabs = providers.map((p) => {
      const on = p === active;
      const pa = PROVIDER_ACCENT[p] || '#D4A858';
      const st = on ? `border-color:color-mix(in srgb, ${pa} 40%, transparent);background:color-mix(in srgb, ${pa} 10%, transparent);color:${pa}` : '';
      return `<button data-ddtab="${escapeHtml(p)}" class="dd-tab mono" style="${st}">${escapeHtml(p)}</button>`;
    }).join('');

    const defLabel = `(use default · ${stripPrefix(String(ST.codeDef[field.key] ?? '—'))})`;
    const items = [{ label: defLabel, value: '', def: true }]
      .concat((field.byProvider[active] || []).map((m) => ({ label: stripPrefix(m), value: m })));
    const itemsHtml = items.map((it) => {
      const sel = it.value === cur || (it.def && !cur);
      const st = sel ? `border-color:${accent}55;background:${accent}18;color:${accent}` : (it.def ? 'color:#7a7068' : '');
      return `<div data-ddpick="${escapeHtml(it.value)}" class="dd-item mono" style="${st}"><span>${escapeHtml(it.label)}</span><span style="color:${accent};font-size:11px">${sel ? '●' : ''}</span></div>`;
    }).join('');

    panel.innerHTML = `
      <div class="flex" style="gap:6px;padding:10px 12px;border-bottom:1px solid #1f1a18">${tabs}</div>
      <div style="max-height:272px;overflow:auto;padding:8px">${itemsHtml}</div>
      <div class="flex" style="gap:8px;padding:11px 12px;border-top:1px solid #1f1a18;background:#0d0a09">
        <input data-ddcustom class="mono" placeholder="custom model id" value="${escapeHtml(ST.custom[field.key] || '')}"
          style="flex:1;background:#0b0908;border:1px solid #2c2522;border-radius:8px;padding:10px 13px;font-family:inherit;font-size:12px;color:#ece6df" />
        <button data-dduse class="btn-use mono" style="background:${accent}">USE</button>
      </div>`;

    panel.querySelectorAll('[data-ddtab]').forEach((b) => b.addEventListener('click', (e) => {
      e.stopPropagation();
      ST.ddTab[field.key] = b.getAttribute('data-ddtab');
      renderPanel();
    }));
    panel.querySelectorAll('[data-ddpick]').forEach((b) => b.addEventListener('click', (e) => {
      e.stopPropagation();
      pickModel(field, b.getAttribute('data-ddpick'));
    }));
    const customInp = panel.querySelector('[data-ddcustom]');
    customInp.addEventListener('input', () => { ST.custom[field.key] = customInp.value; });
    customInp.addEventListener('keydown', (e) => { if (e.key === 'Enter') { e.preventDefault(); useCustom(field); } });
    panel.querySelector('[data-dduse]').addEventListener('click', (e) => { e.stopPropagation(); useCustom(field); });
  }

  function useCustom(field) {
    const v = (ST.custom[field.key] || '').trim();
    if (!v) return;
    ST.custom[field.key] = '';
    pickModel(field, v);
  }

  renderPanel();
}

function pickModel(field, value) {
  ST.values[field.key] = value;
  markDirty();
  closeDd();
  const lbl = document.querySelector(`[data-ddwrap="${field.key}"] [data-ddvalue]`);
  const prov = document.querySelector(`[data-ddwrap="${field.key}"] [data-ddprov]`);
  if (lbl) lbl.textContent = value ? stripPrefix(value) : `(default · ${stripPrefix(String(ST.codeDef[field.key] ?? '—'))})`;
  if (prov) prov.textContent = providerOf(field.byProvider, value);
}

async function renderSettings() {
  elContent.innerHTML = '<div class="mono" style="font-size:11px;color:#57504b">loading…</div>';
  const data = await fetchJson('/api/kata/admin/global-config');
  if (!data) return;
  clearAuthWarn();
  elCounts.textContent = 'Default cho mọi guild — guild muốn khác thì override trong guild drawer.';

  ST.cfg = data.config || {};
  ST.codeDef = data.codeDefaults || {};
  ST.dirty = false;
  ST.custom = {};
  ST.ddTab = {};

  // A field is OVERRIDE when the GlobalConfig doc actually stores a value;
  // otherwise the bot falls through to its code default.
  for (const f of SETTINGS_FIELDS) {
    const stored = ST.cfg[f.key];
    const has = stored !== undefined && stored !== null && !(Array.isArray(stored) && stored.length === 0) && stored !== '';
    ST.over[f.key] = !!has;
    ST.values[f.key] = has ? stored : ST.codeDef[f.key];
  }

  const cards = SETTINGS_FIELDS.map((f) => {
    let body = '';
    if (f.type === 'textarea' || f.type === 'channels') {
      const raw = ST.values[f.key];
      const v = f.type === 'channels' ? (Array.isArray(raw) ? raw.join('\n') : '') : (raw ?? '');
      body = `<textarea data-input="${f.key}" rows="${f.rows}" class="inp mono" placeholder="${escapeHtml(f.placeholder || '')}">${escapeHtml(v)}</textarea>`;
    } else if (f.type === 'number') {
      body = `<div class="flex items-center" style="gap:10px">
        <button data-step="-5" data-stepkey="${f.key}" class="btn-step mono">−</button>
        <input data-input="${f.key}" value="${escapeHtml(String(ST.values[f.key] ?? ''))}" class="inp mono" style="width:80px;text-align:center;font-size:16px;font-weight:800;padding:11px 0" />
        <button data-step="5" data-stepkey="${f.key}" class="btn-step mono">+</button>
      </div>`;
    } else if (f.type === 'model') {
      const cur = ST.values[f.key] || '';
      const prov = providerOf(f.byProvider, cur);
      const provAccent = PROVIDER_ACCENT[prov] || '#D4A858';
      const display = cur ? stripPrefix(cur) : `(default · ${stripPrefix(String(ST.codeDef[f.key] ?? '—'))})`;
      body = `<div data-ddwrap="${f.key}" style="position:relative">
        <button data-ddtrigger="${f.key}" class="dd-trigger mono">
          <span class="flex items-center" style="gap:11px;min-width:0">
            <span style="width:7px;height:7px;border-radius:99px;background:${provAccent};flex:none"></span>
            <span data-ddvalue style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:700">${escapeHtml(display)}</span>
            <span data-ddprov class="provider-pill">${escapeHtml(prov)}</span>
          </span>
          <span data-chev style="color:#8a7f78;font-size:10px;transition:transform .2s">▼</span>
        </button>
      </div>`;
    }

    return `<div data-fld="${f.key}" class="card">
      <div class="fld-head">
        <div>
          <div class="flex items-center" style="gap:10px">
            <span class="fld-title mono">${escapeHtml(f.title)}</span>
            <span class="fld-status mono">CODE</span>
          </div>
          <div class="fld-desc">${escapeHtml(f.desc)}</div>
        </div>
        <div data-toggle="${f.key}" class="tgl"><div class="tgl-knob"></div></div>
      </div>
      <div class="fld-body">${body}</div>
    </div>`;
  });

  // RATE LIMIT + ALLOWED CHANNELS share one grid row per the design.
  const rateCard = cards[4], chanCard = cards[5];
  elContent.innerHTML = `<div class="page-in">
    <div class="flex justify-end" style="margin-bottom:18px"><span id="ovr-count" class="ovr-pill mono">0/${SETTINGS_FIELDS.length} OVERRIDE</span></div>
    <div class="flex flex-col" style="gap:18px">
      ${cards[0]}${cards[1]}${cards[2]}${cards[3]}
      <div class="grid" style="grid-template-columns:1fr 1.4fr;gap:18px">${rateCard}${chanCard}</div>
    </div>
    <div class="flex items-center" style="gap:14px;margin-top:34px">
      <button id="settings-save" class="btn-accent mono">SAVE CHANGES</button>
      <button id="settings-reload" class="btn-ghost mono">RELOAD</button>
      <span id="dirty-flag" class="mono" style="font-size:11px;color:#D4A858;letter-spacing:.1em;display:none">● chưa lưu</span>
    </div>
  </div>`;

  for (const f of SETTINGS_FIELDS) setFieldUI(f.key);

  document.querySelectorAll('[data-toggle]').forEach((t) => t.addEventListener('click', () => {
    const key = t.getAttribute('data-toggle');
    ST.over[key] = !ST.over[key];
    markDirty();
    setFieldUI(key);
  }));
  document.querySelectorAll('[data-input]').forEach((el) => el.addEventListener('input', () => {
    const key = el.getAttribute('data-input');
    const f = SETTINGS_FIELDS.find((x) => x.key === key);
    if (f.type === 'number') {
      el.value = el.value.replace(/[^0-9]/g, '');
      ST.values[key] = el.value === '' ? null : Number(el.value);
    } else if (f.type === 'channels') {
      ST.values[key] = el.value.split('\n').map((s) => s.trim()).filter(Boolean);
    } else {
      ST.values[key] = el.value;
    }
    markDirty();
  }));
  document.querySelectorAll('[data-step]').forEach((b) => b.addEventListener('click', () => {
    const key = b.getAttribute('data-stepkey');
    const inp = document.querySelector(`[data-input="${key}"]`);
    const next = Math.max(0, (parseInt(inp.value, 10) || 0) + Number(b.getAttribute('data-step')));
    inp.value = String(next);
    ST.values[key] = next;
    markDirty();
  }));
  SETTINGS_FIELDS.filter((f) => f.type === 'model').forEach((f) => {
    document.querySelector(`[data-ddtrigger="${f.key}"]`).addEventListener('click', (e) => {
      e.stopPropagation();
      if (ST.openDd === f.key) closeDd(); else openDd(f);
    });
  });

  document.getElementById('settings-reload').addEventListener('click', async () => {
    closeDd();
    await renderSettings();
    showToast('↺ Đã tải lại từ server');
  });
  document.getElementById('settings-save').addEventListener('click', saveSettings);
}

async function saveSettings() {
  closeDd();
  // OVERRIDE on → store the edited value; off → null (bot falls back to code).
  // Only ship keys that differ from what GlobalConfig currently stores.
  const payload = {};
  for (const f of SETTINGS_FIELDS) {
    let v;
    if (!ST.over[f.key]) {
      v = null;
    } else if (f.type === 'channels') {
      const arr = Array.isArray(ST.values[f.key]) ? ST.values[f.key] : [];
      v = arr.length === 0 ? null : arr;
    } else if (f.type === 'number') {
      v = (ST.values[f.key] === null || ST.values[f.key] === undefined || ST.values[f.key] === '') ? null : Number(ST.values[f.key]);
    } else {
      const s = (ST.values[f.key] ?? '').toString();
      v = s.trim() === '' ? null : s;
    }
    const cur = ST.cfg[f.key];
    const curNorm = (cur === undefined || cur === null || (Array.isArray(cur) && cur.length === 0) || cur === '') ? null : cur;
    if (JSON.stringify(v) !== JSON.stringify(curNorm)) payload[f.key] = v;
  }
  if (Object.keys(payload).length === 0) {
    showToast('Không có thay đổi để lưu');
    return;
  }
  const btn = document.getElementById('settings-save');
  btn.disabled = true; btn.style.opacity = '.6';
  try {
    const r = await fetch('/api/kata/admin/global-config', {
      method: 'PATCH',
      credentials: 'include',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload),
    });
    const data = await r.json().catch(() => ({}));
    if (!r.ok) {
      showToast('⚠ ' + (data.error || `lỗi ${r.status}`), true);
      return;
    }
    showToast('✓ Đã lưu — áp dụng cho mọi guild');
    await renderSettings();
  } catch {
    showToast('⚠ Lỗi mạng — chưa lưu được', true);
  } finally {
    btn.disabled = false; btn.style.opacity = '';
  }
}

/* ==================== join server (invite) ==================== */
// Fetch an invite link into a guild the bot is in, then open it. The link is
// minted server-side (stored URL → bot instant invite → guild widget).
async function joinServer(btn) {
  const guildId = btn.getAttribute('data-join');
  if (!guildId || btn.dataset.busy === '1') return;
  btn.dataset.busy = '1';
  const label = btn.textContent;
  btn.textContent = '…';
  if (btn.tagName === 'BUTTON') btn.disabled = true;
  try {
    const r = await fetch(`/api/kata/admin/servers/${encodeURIComponent(guildId)}/invite`, { credentials: 'include' });
    const data = await r.json().catch(() => ({}));
    if (!r.ok || !data.url) {
      showToast('⚠ ' + (data.message || `Không lấy được invite (lỗi ${r.status})`), true);
      return;
    }
    window.open(data.url, '_blank', 'noopener');
    showToast('✓ Mở link invite…');
  } catch {
    showToast('⚠ Lỗi mạng — chưa lấy được invite', true);
  } finally {
    btn.dataset.busy = '';
    btn.textContent = label;
    if (btn.tagName === 'BUTTON') btn.disabled = false;
  }
}

// Delegated so it survives re-renders of the servers list (mobile JOIN sits
// inside the row's <a>, so we must stop it from navigating to overview).
elContent.addEventListener('click', (e) => {
  const j = e.target.closest('[data-join]');
  if (!j) return;
  e.preventDefault();
  e.stopPropagation();
  joinServer(j);
});

/* ==================== tab routing ==================== */
const renderers = { servers: renderServers, logs: renderLogs, cost: renderCost, settings: renderSettings };

function switchTab(tab) {
  if (!TABS.includes(tab)) return;
  currentTab = tab;
  closeDd();
  setTabUI();
  const url = new URL(location.href);
  url.searchParams.set('tab', tab);
  history.replaceState(null, '', url);
  renderers[tab]();
}

document.querySelectorAll('[data-tab]').forEach(a => {
  a.addEventListener('click', (e) => {
    e.preventDefault();
    switchTab(a.dataset.tab);
  });
});

setTabUI();
renderers[currentTab]();
</script>
