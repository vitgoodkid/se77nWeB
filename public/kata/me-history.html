<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<base href="/kata/" />
<title>my history · katas</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700;800&family=Geist:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = { theme: { extend: {
    colors: { bg:'#0d0a08', panel:'#15110d', panel2:'#1c1813', line:'rgba(255,255,255,0.08)', line2:'rgba(255,255,255,0.14)', ink:'#f5ede0', mute:'rgba(245,237,224,0.5)', mute2:'rgba(245,237,224,0.3)', red:'#E04545', green:'#5BA868', gold:'#D4A858' },
    fontFamily: { sans:['Geist','system-ui','sans-serif'], mono:['"JetBrains Mono"','ui-monospace','monospace'] },
    letterSpacing: { kicker:'0.22em', label:'0.18em', tag:'0.12em' },
  }}};
</script>
<style>
  html, body { background: #0d0a08; color: #f5ede0; font-family: Geist, system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
  .mono { font-family: 'JetBrains Mono', ui-monospace, monospace; }
  .glow77 { text-shadow: 0 0 6px #E04545cc, 0 0 18px #E0454566, 0 0 36px #E0454533; }
  @keyframes pulse77 { 0%,100% { opacity:1; transform: scale(1); } 50% { opacity:.55; transform: scale(.82); } }
  .dot-pulse { animation: pulse77 2s ease-in-out infinite; }
  .grain { background-image: radial-gradient(rgba(255,255,255,0.04) 1px, transparent 1px); background-size: 3px 3px; }
  .ambient { background-image:
      radial-gradient(60% 50% at 18% 12%, #E0454520 0%, transparent 65%),
      radial-gradient(50% 45% at 90% 88%, #5BA86820 0%, transparent 70%); }
  ::-webkit-scrollbar { width: 8px; height: 8px; }
  ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.08); border-radius: 4px; }
  ::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,0.15); }
  .tab-active { color: #f5ede0 !important; background: rgba(245,237,224,0.05); }
  .row { transition: background 120ms ease; }
  .row:hover { background: rgba(245,237,224,0.03); }
  .thumb { width: 56px; height: 56px; border-radius: 8px; background-size: cover; background-position: center; flex-shrink: 0; border: 1px solid rgba(255,255,255,0.08); }
  .truncate-2 { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
</style>
</head>
<body class="bg-bg text-ink min-h-screen overflow-x-hidden">
<script src="_strings.js"></script>
<script src="_shell.js"></script>

<div aria-hidden class="fixed inset-0 z-0 pointer-events-none ambient"></div>
<div aria-hidden class="fixed inset-0 z-0 pointer-events-none grain opacity-40"></div>

<header class="fixed top-0 inset-x-0 h-16 z-50 flex items-center justify-between px-6 backdrop-blur-md border-b border-line" style="background:rgba(13,10,8,0.7)">
  <div class="flex items-center gap-5">
    <a href="index.html" class="flex flex-col items-start gap-1 leading-none">
      <div class="mono text-[24px] font-extrabold tracking-[-0.025em]">se<span class="text-red glow77">77</span>n<span class="text-mute font-normal"> / kata</span></div>
      <div class="mono text-[9px] uppercase tracking-kicker text-mute">Experiment <span class="text-red font-bold">007</span> · katas dashboard</div>
    </a>
    <div class="flex items-center gap-2 ml-3 mono text-[10px] tracking-label uppercase">
      <a href="index.html" class="text-mute hover:text-ink">se77n</a><span class="text-mute2">/</span>
      <a href="index.html" class="text-mute hover:text-ink">kata</a><span class="text-mute2">/</span>
      <span class="text-ink">my history · <span id="bc-tab">chat</span></span>
    </div>
  </div>

  <div id="kata-header-actions" class="flex items-center gap-2.5"></div>
</header>

<aside class="fixed top-16 left-0 bottom-0 w-[220px] z-40 border-r border-line backdrop-blur-md overflow-y-auto" style="background:rgba(13,10,8,0.6)">
  <div class="p-5 border-b border-line">
    <div class="mono text-[10px] tracking-label uppercase text-mute mb-2">your activity</div>
    <div class="text-[14px] font-medium tracking-tight text-ink">cross-server</div>
    <div class="mono text-[10px] text-mute mt-1">all guilds bot is in</div>
  </div>
  <nav class="px-3 py-4 mono text-[11px] tracking-label uppercase">
    <div class="px-3 py-2 mb-1 text-ink">▸ history</div>
    <a data-tab="chat" class="block px-3 py-1.5 ml-3 rounded-[8px] text-mute hover:text-ink cursor-pointer">↳ chat</a>
    <a data-tab="image" class="block px-3 py-1.5 ml-3 rounded-[8px] text-mute hover:text-ink cursor-pointer">↳ image</a>
    <a data-tab="video" class="block px-3 py-1.5 ml-3 rounded-[8px] text-mute hover:text-ink cursor-pointer">↳ video</a>
    <a data-tab="command" class="block px-3 py-1.5 ml-3 rounded-[8px] text-mute hover:text-ink cursor-pointer">↳ commands</a>
  </nav>
  <div class="px-5 py-4 border-t border-line">
    <a href="servers.html" class="mono text-[10px] tracking-label uppercase text-mute hover:text-ink flex items-center gap-2" data-i18n="btn.back-my-servers">← my servers</a>
  </div>
</aside>

<main class="relative z-10 pt-20 pb-16 pl-[244px] pr-8">

  <div class="flex items-end justify-between gap-6 mb-6">
    <div>
      <div class="mono text-[10px] uppercase tracking-kicker text-mute mb-2 flex items-center gap-3">
        <span class="dot-pulse w-1.5 h-1.5 rounded-full bg-green"></span>
        <span id="page-tag">TAB · MY HISTORY / —</span>
      </div>
      <h1 class="mono text-[36px] leading-none font-extrabold tracking-[-0.035em] lowercase">my history<span id="page-tab-label" class="text-red font-extrabold"> · —</span><span class="text-red glow77">.</span></h1>
      <div id="page-counts" class="mono text-[11px] text-mute mt-3">—</div>
    </div>
  </div>

  <div id="auth-warning" class="hidden mb-6 p-5 border border-line rounded-[12px] bg-panel">
    <div class="mono text-[10px] uppercase tracking-kicker text-red mb-2">không thể tải dữ liệu</div>
    <div id="auth-warning-msg" class="text-[14px] text-mute">—</div>
    <a id="auth-login-btn" href="/api/auth/discord/start" class="hidden mt-4 inline-block mono h-9 px-4 rounded-full border border-line text-[11px] tracking-label uppercase hover:bg-ink/5" data-i18n="kata.login">đăng nhập discord</a>
  </div>

  <div id="rows-host" class="space-y-2"></div>

  <div id="empty-state" class="hidden text-center py-16 mono text-[12px] tracking-label uppercase text-mute" data-i18n="empty.no-history">— no activity yet —</div>

  <div id="load-more-host" class="hidden flex justify-center mt-8">
    <button id="load-more" class="mono h-10 px-6 rounded-full border border-line text-[11px] tracking-label uppercase hover:bg-ink/5" data-i18n="btn.load-more">load more</button>
  </div>
</main>

<script>
const TABS = ['chat','image','video','command'];
const params = new URLSearchParams(location.search);
let currentTab = TABS.includes(params.get('tab')) ? params.get('tab') : 'chat';
let cursor = null;
let total = null;

const elTag = document.getElementById('page-tag');
const elLabel = document.getElementById('page-tab-label');
const elBcTab = document.getElementById('bc-tab');
const elCounts = document.getElementById('page-counts');
const elRows = document.getElementById('rows-host');
const elEmpty = document.getElementById('empty-state');
const elMore = document.getElementById('load-more');
const elMoreHost = document.getElementById('load-more-host');
const elAuthWarn = document.getElementById('auth-warning');
const elAuthMsg = document.getElementById('auth-warning-msg');
const elAuthLogin = document.getElementById('auth-login-btn');

function setTabUI() {
  document.querySelectorAll('[data-tab]').forEach(a => {
    a.classList.toggle('tab-active', a.dataset.tab === currentTab);
  });
  elTag.textContent = `TAB · MY HISTORY / ${currentTab.toUpperCase()}`;
  elLabel.textContent = ` · ${currentTab}`;
  elBcTab.textContent = currentTab;
}

function fmtTime(d) {
  if (!d) return '—';
  const date = new Date(d);
  const now = Date.now();
  const diff = (now - date.getTime()) / 1000;
  if (diff < 60) return `${Math.floor(diff)}s trước`;
  if (diff < 3600) return `${Math.floor(diff/60)}m trước`;
  if (diff < 86400) return `${Math.floor(diff/3600)}h trước`;
  if (diff < 604800) return `${Math.floor(diff/86400)}d trước`;
  return date.toISOString().slice(0,16).replace('T',' ');
}

function escapeHtml(s) {
  return String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
}

function guildBadge(guild) {
  if (!guild) return '';
  const name = escapeHtml(guild.name ?? '?');
  const initial = escapeHtml((guild.name ?? '?').slice(0,2));
  const icon = guild.iconUrl
    ? `<img src="${escapeHtml(guild.iconUrl)}" alt="" class="w-5 h-5 rounded-md object-cover" />`
    : `<span class="w-5 h-5 rounded-md grid place-items-center mono text-[9px] font-bold" style="background:#E0454522;color:#E04545">${initial}</span>`;
  return `<span class="inline-flex items-center gap-1.5 mono text-[10px] tracking-label uppercase text-mute">${icon}<span class="max-w-[180px] truncate">${name}</span></span>`;
}

function renderChat(r) {
  const cost = r.costUSD ? `$${Number(r.costUSD).toFixed(4)}` : '';
  const tokens = (r.tokensIn || r.tokensOut) ? `${r.tokensIn ?? 0}→${r.tokensOut ?? 0}` : '';
  return `
    <div class="row p-4 border border-line rounded-[10px] bg-panel/40">
      <div class="flex items-center justify-between gap-3 mb-2">
        ${guildBadge(r.guild)}
        <span class="mono text-[10px] text-mute">${escapeHtml(fmtTime(r.createdAt))}</span>
      </div>
      <div class="text-[13px] truncate-2">${escapeHtml(r.content || '(empty)')}</div>
      <div class="flex items-center gap-3 mt-2 mono text-[10px] text-mute2">
        ${r.modelUsed ? `<span>${escapeHtml(r.modelUsed)}</span>` : ''}
        ${tokens ? `<span>${tokens}</span>` : ''}
        ${cost ? `<span>${cost}</span>` : ''}
      </div>
    </div>`;
}

function renderImage(r) {
  const cost = r.costUSD ? `$${Number(r.costUSD).toFixed(4)}` : '';
  const out = r.outputUrl ? `background-image:url('${escapeHtml(r.outputUrl)}')` : '';
  const inUrl = r.inputImageUrl ? `background-image:url('${escapeHtml(r.inputImageUrl)}')` : '';
  return `
    <div class="row p-4 border border-line rounded-[10px] bg-panel/40">
      <div class="flex items-center justify-between gap-3 mb-3">
        ${guildBadge(r.guild)}
        <span class="mono text-[10px] text-mute">${escapeHtml(fmtTime(r.createdAt))}</span>
      </div>
      <div class="flex items-start gap-3">
        ${r.inputImageUrl ? `<div class="thumb" style="${inUrl}" title="input"></div>` : ''}
        ${r.outputUrl ? `<a href="${escapeHtml(r.outputUrl)}" target="_blank" class="thumb" style="${out}" title="output"></a>` : '<div class="thumb"></div>'}
        <div class="flex-1 min-w-0">
          <div class="text-[13px] truncate-2">${escapeHtml(r.prompt || '(no prompt)')}</div>
          <div class="flex items-center gap-3 mt-2 mono text-[10px] text-mute2">
            <span class="px-1.5 py-0.5 rounded border border-line">${escapeHtml(r.command || 'image')}</span>
            ${r.modelUsed ? `<span>${escapeHtml(r.modelUsed)}</span>` : ''}
            ${cost ? `<span>${cost}</span>` : ''}
          </div>
        </div>
      </div>
    </div>`;
}

function renderVideo(r) {
  const cost = r.costUSD ? `$${Number(r.costUSD).toFixed(4)}` : '';
  return `
    <div class="row p-4 border border-line rounded-[10px] bg-panel/40">
      <div class="flex items-center justify-between gap-3 mb-2">
        ${guildBadge(r.guild)}
        <span class="mono text-[10px] text-mute">${escapeHtml(fmtTime(r.createdAt))}</span>
      </div>
      <div class="text-[13px] truncate-2">${escapeHtml(r.prompt || '(no prompt)')}</div>
      <div class="flex items-center gap-3 mt-2 mono text-[10px] text-mute2">
        <span class="px-1.5 py-0.5 rounded border border-line">${escapeHtml(r.command || 'video')}</span>
        ${r.modelUsed ? `<span>${escapeHtml(r.modelUsed)}</span>` : ''}
        ${r.durationSec ? `<span>${r.durationSec}s</span>` : ''}
        ${cost ? `<span>${cost}</span>` : ''}
        ${r.outputUrl ? `<a href="${escapeHtml(r.outputUrl)}" target="_blank" class="text-mute hover:text-ink underline">open</a>` : ''}
      </div>
    </div>`;
}

function renderCommand(r) {
  const ok = r.success !== false;
  const lat = r.latencyMs ? `${r.latencyMs}ms` : '';
  return `
    <div class="row p-4 border border-line rounded-[10px] bg-panel/40">
      <div class="flex items-center justify-between gap-3 mb-2">
        ${guildBadge(r.guild)}
        <span class="mono text-[10px] text-mute">${escapeHtml(fmtTime(r.createdAt))}</span>
      </div>
      <div class="flex items-center gap-2 mb-1">
        <span class="mono text-[11px] px-1.5 py-0.5 rounded border ${ok ? 'border-green/40 text-green' : 'border-red/40 text-red'}">${escapeHtml(r.command || '?')}</span>
        ${r.modelUsed ? `<span class="mono text-[10px] text-mute">${escapeHtml(r.modelUsed)}</span>` : ''}
        ${lat ? `<span class="mono text-[10px] text-mute2">${lat}</span>` : ''}
      </div>
      <div class="text-[13px] text-mute truncate-2">${escapeHtml(r.input ?? '')}</div>
      ${!ok && r.errorMessage ? `<div class="mt-2 mono text-[10px] text-red">${escapeHtml(r.errorMessage)}</div>` : ''}
    </div>`;
}

const renderers = { chat: renderChat, image: renderImage, video: renderVideo, command: renderCommand };

async function load(reset = true) {
  if (reset) {
    cursor = null;
    elRows.innerHTML = '';
    elAuthWarn.classList.add('hidden');
    elEmpty.classList.add('hidden');
    elMoreHost.classList.add('hidden');
  }
  const url = new URL('/api/kata/me/history', location.origin);
  url.searchParams.set('type', currentTab);
  if (cursor) url.searchParams.set('cursor', cursor);

  let res, data;
  try {
    res = await fetch(url.toString(), { credentials: 'include' });
    data = await res.json();
  } catch (e) {
    elAuthMsg.textContent = 'Lỗi mạng. Thử lại sau.';
    elAuthWarn.classList.remove('hidden');
    return;
  }

  if (!res.ok) {
    if (data?.error === 'unauthenticated' || data?.error === 'reauth_required' || data?.error === 'discord_required') {
      elAuthMsg.textContent = data.message || 'Đăng nhập Discord để xem lịch sử.';
      elAuthLogin.classList.remove('hidden');
    } else {
      elAuthMsg.textContent = data?.error || `lỗi ${res.status}`;
    }
    elAuthWarn.classList.remove('hidden');
    return;
  }

  if (reset) total = data.total;
  const renderer = renderers[currentTab] ?? renderChat;
  if (data.items.length === 0 && reset) {
    elEmpty.classList.remove('hidden');
  } else {
    const html = data.items.map(renderer).join('');
    elRows.insertAdjacentHTML('beforeend', html);
  }
  cursor = data.nextCursor;
  if (data.hasMore) elMoreHost.classList.remove('hidden');
  else elMoreHost.classList.add('hidden');

  const totalText = total !== null ? ` · ${total} total` : '';
  elCounts.textContent = `${data.items.length} loaded${totalText}`;
}

function switchTab(tab) {
  if (!TABS.includes(tab)) return;
  currentTab = tab;
  setTabUI();
  const url = new URL(location.href);
  url.searchParams.set('tab', tab);
  history.replaceState(null, '', url);
  load(true);
}

document.querySelectorAll('[data-tab]').forEach(a => {
  a.addEventListener('click', (e) => {
    e.preventDefault();
    switchTab(a.dataset.tab);
  });
});
elMore.addEventListener('click', () => load(false));

// User chip is rendered + hydrated by _shell.js — no per-page boot needed.
setTabUI();
load(true);
</script>
</body>
</html>
