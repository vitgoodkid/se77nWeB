     Port of admin.html's phone layout to the server-detail pages.
     The fixed 232px sidebar + `main pl-[244px]` had no @media, so on a

<script>
const ACCENTS = ['#E04545','#D4A858','#5BA868','#7a9eb5','#9bb4ff','#c46868','#c9a653'];
function escapeHtml(s){return String(s ?? '').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function getGuildId(){ return new URL(window.location.href).searchParams.get('guild'); }
function getInitialTab(){ return new URL(window.location.href).searchParams.get('tab') || 'chat'; }
function avatarSeed(id){ const s=[...String(id||'')].reduce((a,c)=>a+c.charCodeAt(0),0); return ACCENTS[s%ACCENTS.length]; }
function relTime(d){
  const t = new Date(d).getTime(); const s = Math.max(1, Math.round((Date.now() - t) / 1000));
  if (s < 60) return s + 's trước';
  if (s < 3600) return Math.floor(s/60) + 'p trước';
  if (s < 86400) return Math.floor(s/3600) + 'g trước';
  return Math.floor(s/86400) + 'd trước';
}
function showToast(msg, kind='ok'){
  const colors={ok:'#5BA868',err:'#c46868',info:'#7a9eb5'}; const c=colors[kind]||colors.ok;
  const el=document.createElement('div');
  el.className='mono text-[12px] px-4 py-2.5 rounded-[10px] mb-2 pointer-events-auto';
  el.style.cssText=`background:${c}18;border:1px solid ${c}55;color:${c};box-shadow:0 16px 40px -16px ${c}99`;
  el.textContent=msg; document.getElementById('toast').appendChild(el);
  setTimeout(()=>{el.style.opacity='0';el.style.transition='opacity 200ms';setTimeout(()=>el.remove(),220);},3000);
}

const TAB_LABELS = {
  chat: { vi: 'chat', tagline: 'TIN NHẮN · TTL 24H' },
  image: { vi: 'image', tagline: 'ẢNH · VĨNH VIỄN' },
  video: { vi: 'video', tagline: 'VIDEO · VĨNH VIỄN' },
  command: { vi: 'commands', tagline: 'COMMAND HISTORY · TẤT CẢ' },
};

let CURRENT_TAB = getInitialTab();
let CURRENT_CURSOR = null;
let CURRENT_GUILD_DATA = null;

function renderTabsActive(){
  for (const btn of document.querySelectorAll('.kata-tab')){
    btn.classList.toggle('on', btn.dataset.tab === CURRENT_TAB);
  }
  document.getElementById('page-tab-label').textContent = ' · ' + TAB_LABELS[CURRENT_TAB].vi;
  document.getElementById('page-tag').textContent = `TAB · LOGS / ${TAB_LABELS[CURRENT_TAB].vi.toUpperCase()} · ${TAB_LABELS[CURRENT_TAB].tagline}`;
  document.getElementById('bc-tab').textContent = TAB_LABELS[CURRENT_TAB].vi;
  document.title = `logs · ${TAB_LABELS[CURRENT_TAB].vi} · katas`;
}

function authorName(e){
  return (e.user && (e.user.displayName || e.user.username)) || e.userId.slice(-4);
}
// Avatar tile: real Discord avatar when katasusers has one, letter fallback
// otherwise. onerror covers stale CDN hashes (user changed avatar since the
// bot last saw them) — swap to the hidden letter tile instead of a broken img.
function avatarTile(e, name, useImg = true){
  const accent = avatarSeed(e.userId);
  const letter = escapeHtml(String(name).slice(0,1).toUpperCase());
  const letterTile = (display) => `<span class="w-7 h-7 rounded-full place-items-center text-[12px] font-bold flex-shrink-0" style="display:${display};background:${accent}22;color:${accent}">${letter}</span>`;
  const url = useImg && e.user && e.user.avatarUrl;
  if (!url) return letterTile('grid');
  return `<img src="${escapeHtml(url)}" alt="" class="w-7 h-7 rounded-full object-cover flex-shrink-0" loading="lazy" onerror="this.style.display='none';this.nextElementSibling.style.display='grid'" />${letterTile('none')}`;
}
function chatContentHtml(e){
  return `${escapeHtml(e.content)}${e.contentTruncated?'<span class="text-mute2"> …</span>':''}`;
}
function chatMetaHtml(e){
  const bits = [];
  if (e.modelUsed) bits.push(`<span class="text-mute">${escapeHtml(e.modelUsed)}</span>`);
  if (e.tokensIn != null) bits.push(`<span>in · ${e.tokensIn}</span>`);
  if (e.tokensOut != null) bits.push(`<span>out · ${e.tokensOut}</span>`);
  if (e.costUSD != null) bits.push(`<span class="text-gold">$${e.costUSD.toFixed(4)}</span>`);
  return bits.join('');
}
// Pair each bot reply with the user message that triggered it. Chatlogs has
// no reply-id link, but assistant rows carry the requester's userId and are
// written right after the user row — so with items sorted newest-first, the
// trigger is the nearest OLDER user row with the same userId + channelId
// (within 30min to avoid latching onto an unrelated earlier message).
function pairChatItems(items){
  const blocks = [];
  const used = new Array(items.length).fill(false);
  for (let i = 0; i < items.length; i++){
    if (used[i]) continue;
    const e = items[i];
    used[i] = true;
    if (e.role !== 'assistant'){ blocks.push({ user: e, bot: null }); continue; }
    let match = -1;
    for (let j = i + 1; j < items.length; j++){
      if (used[j]) continue;
      const u = items[j];
      if (u.role !== 'user' || u.userId !== e.userId || u.channelId !== e.channelId) continue;
      const dt = new Date(e.createdAt) - new Date(u.createdAt);
      if (dt >= 0 && dt < 30 * 60 * 1000) match = j;
      break;
    }
    if (match >= 0){ used[match] = true; blocks.push({ user: items[match], bot: e }); }
    else blocks.push({ user: null, bot: e });
  }
  return blocks;
}
// v2 conversation layout: the member message is a left-aligned speech bubble,
// the bot reply a right-aligned gold bubble carrying KataS's full response —
// plus the gold "K" bot avatar. Orphans (reply older than the page window, or
// a message the bot never answered) render their half alone.
function chatBlockHtml(b){
  const u = b.user, bot = b.bot;
  let userPart = '';
  if (u){
    const name = authorName(u);
    userPart = `
    <div class="log-side" style="display:flex;align-items:flex-end;gap:11px;max-width:76%">
      ${avatarTile(u, name)}
      <div style="min-width:0">
        <div class="flex items-center flex-wrap" style="gap:9px;margin:0 0 6px 4px">
          <span class="text-[13px] text-ink font-medium whitespace-nowrap">${escapeHtml(name)}</span>
          <span class="mono text-[10px] px-2 py-0.5 rounded-full flex-shrink-0" style="background:#E0454518;border:1px solid #E0454540;color:#E04545">user</span>
          <span class="mono text-[11px] text-mute">#${u.channelId.slice(-6)}</span>
          <span class="mono text-[11px] text-mute2" title="${escapeHtml(new Date(u.createdAt).toLocaleString('vi-VN', { hour12: false }))}">· ${relTime(u.createdAt)}</span>
        </div>
        <div class="text-[14px] leading-[1.55] whitespace-pre-wrap break-words" style="display:inline-block;background:#1c1614;border:1px solid #2c2522;border-radius:4px 16px 16px 16px;padding:13px 17px;color:#ece6df">${chatContentHtml(u)}</div>
      </div>
    </div>`;
  }
  let botPart = '';
  if (bot){
    const botMeta = chatMetaHtml(bot);
    botPart = `
    <div class="log-side log-bot" style="display:flex;align-items:flex-end;justify-content:flex-end;gap:11px;max-width:80%;margin:${u ? '12px' : '0'} 0 0 auto">
      <div style="min-width:0;text-align:right">
        <div class="flex items-center flex-wrap" style="justify-content:flex-end;gap:9px;margin:0 4px 6px 0">
          ${u ? '' : `<span class="mono text-[11px] text-mute">#${bot.channelId.slice(-6)}</span>`}
          <span class="mono text-[10px] px-2 py-0.5 rounded-full flex-shrink-0" style="background:#D4A85818;border:1px solid #D4A85840;color:#D4A858">↳ bot</span>
          <span class="text-[13px] font-medium" style="color:#D4A858">KataS</span>
          <span class="mono text-[11px] text-mute2" title="${escapeHtml(new Date(bot.createdAt).toLocaleString('vi-VN', { hour12: false }))}">· ${relTime(bot.createdAt)}</span>
        </div>
        <div class="text-[14px] leading-[1.55] whitespace-pre-wrap break-words" style="display:inline-block;text-align:left;background:rgba(212,168,88,0.08);border:1px solid rgba(212,168,88,0.28);border-radius:16px 4px 16px 16px;padding:13px 17px;color:#ddd6cf">${chatContentHtml(bot)}</div>
        ${botMeta ? `<div class="flex items-center flex-wrap mono text-[11px] text-mute2" style="justify-content:flex-end;gap:12px;margin:8px 6px 0 0">${botMeta}</div>` : ''}
      </div>
      <span class="w-7 h-7 grid place-items-center mono text-[12px] font-bold flex-shrink-0" style="border-radius:9px;background:linear-gradient(135deg,#D4A858,#8a6a2e);color:#1a1408">K</span>
    </div>`;
  }
  return `<div class="log-thread" style="margin-bottom:14px">${userPart}${botPart}</div>`;
}

          : `<div class="w-[88px] h-[88px] rounded-[10px] grid place-items-center border border-line" style="background:#0a0807"><span class="mono text-[10px] text-mute2">no input</span></div>`
        }
        <span class="text-mute2 text-xl">→</span>
        ${outputUrl
          ? `<a href="${escapeHtml(outputUrl)}" target="_blank" rel="noopener"><img src="${escapeHtml(outputUrl)}" loading="lazy" alt="output" class="w-[88px] h-[88px] rounded-[10px] object-cover border border-line" /></a>`
          : `<div class="w-[88px] h-[88px] rounded-[10px] border border-line" style="background:#0a0807"></div>`

      </div>
      <div class="flex-1 min-w-0">
        <header class="flex items-center justify-between gap-3 mb-3 flex-wrap">
          <div class="flex items-center gap-2.5 min-w-0">
            ${avatarTile(e, name)}
            <span class="text-[14px] text-ink font-medium">${escapeHtml(name)}</span>
            <span class="mono text-[11px] px-2 py-0.5 rounded-full" style="background:#E0454518;border:1px solid #E0454540;color:#E04545">${escapeHtml(e.command)}</span>
            <span class="mono text-[12px] text-mute">#${e.channelId.slice(-6)}</span>
            ${fallback ? `<span class="mono text-[10px] tracking-label uppercase px-2 py-0.5 rounded-full" style="background:#c9a65318;border:1px solid #c9a65340;color:#c9a653">fallback · ${escapeHtml(fallback.model.split('/').pop())}</span>` : ''}
          </div>
          <span class="mono text-[12px] text-mute" title="${escapeHtml(new Date(e.createdAt).toLocaleString('vi-VN', { hour12: false }))}">${relTime(e.createdAt)}</span>

    </div>

function rowCommand(e){
  const name = authorName(e);
  const failed = e.success === false;
  const wrapStyle = failed ? 'background:#c4686808;border-color:#c4686844' : '';
  return `<article class="rounded-[14px] border bg-panel p-5" style="border-color:rgba(255,255,255,0.08);${wrapStyle}">
    <header class="flex items-center justify-between gap-3 mb-3 flex-wrap">
      <div class="flex items-center gap-2.5 min-w-0">
        ${avatarTile(e, name)}

        <span class="mono text-[11px] px-2 py-0.5 rounded-full" style="background:${failed?'#c4686818':'#E0454518'};border:1px solid ${failed?'#c4686844':'#E0454540'};color:${failed?'#c46868':'#E04545'}">${escapeHtml(e.command)}${failed?' · fail':''}</span>

const ROW_RENDERERS = { image: rowImage, video: rowVideo, command: rowCommand };
// Chat keeps the full item list across "load more" and re-renders the whole
// pane — pairing needs to see both halves of an exchange even when the page
// boundary fell between them.
let CHAT_ITEMS = [];

async function loadGuildBootstrap(){
  const guildId = getGuildId();
  if (!guildId){ window.location.href = 'servers.html'; return false; }

  // user chip
  fetch('/api/auth/me', { credentials:'same-origin' }).then(r=>r.json()).then(({user}) => {
    if (!user) return;
    const chip = document.getElementById('kata-user-chip');
    const initial = (user.displayName || user.username || '?').slice(0,1).toUpperCase();
    chip.innerHTML = (user.avatarUrl
      ? `<img src="${user.avatarUrl}" alt="" style="width:26px;height:26px;border-radius:9999px;object-fit:cover;border:1px solid rgba(255,255,255,0.08)" />`
      : `<span class="w-[26px] h-[26px] rounded-full grid place-items-center text-[11px] font-extrabold" style="background:#E0454522;color:#E04545">${initial}</span>`)
      + `<span class="max-w-[96px] truncate">${escapeHtml(user.displayName || user.username || '—')}</span>`
      + `<span class="text-mute text-[9px]">▾</span>`;
  }).catch(()=>{});

  const gq = encodeURIComponent(guildId);
  document.getElementById('nav-overview').href = `overview.html?guild=${gq}`;
  document.getElementById('nav-cost').href = `cost.html?guild=${gq}`;
  document.getElementById('bc-guild').href = `overview.html?guild=${gq}`;

  // Pull guild meta from /api/kata/server/:id (also serves as auth probe)
  let r;
  try {
    r = await fetch(`/api/kata/server/${encodeURIComponent(guildId)}?lite=1`, { credentials:'same-origin' });
  } catch {
    showToast('Lỗi mạng', 'err'); return false;
  }
  if (r.status === 401 || r.status === 403){
    document.querySelector('main').innerHTML = `
      <div class="rounded-[14px] border border-line bg-panel p-10 text-center max-w-xl mx-auto mt-20">
        <div class="text-[16px] font-medium text-ink mb-3">Cần đăng nhập với Discord (admin của server).</div>
        <a href="/api/auth/discord/start" class="mono inline-flex items-center gap-2 h-10 px-5 rounded-[10px] uppercase tracking-label text-[11px] font-bold text-bg mt-3" style="background:#5865F2">đăng nhập với Discord</a>
        <a href="servers.html" class="mono inline-flex items-center gap-2 h-10 px-5 rounded-[10px] uppercase tracking-label text-[11px] text-mute hover:text-ink mt-3 ml-2 border border-line">← danh sách server</a>
      </div>`;
    return false;
  }
  if (r.status === 404){
    document.querySelector('main').innerHTML = `<div class="text-mute mt-20 text-center">Bot không có trong server này.</div>`;
    return false;
  }
  if (!r.ok){ showToast(`Lỗi tải (HTTP ${r.status})`, 'err'); return false; }

  const data = await r.json();
  CURRENT_GUILD_DATA = data.guild;
  document.getElementById('kata-guild-name').textContent = data.guild.name;
  document.getElementById('bc-guild').textContent = data.guild.name;
  document.getElementById('kata-guild-meta').textContent = `id · ${data.guild.id}`;
  // Sidebar nav meta counts (shared with the overview design).
  const st = data.stats || {};
  const navLogsMeta = document.getElementById('nav-logs-meta');
  if (navLogsMeta && st.events30d != null) navLogsMeta.textContent = Number(st.events30d).toLocaleString('vi-VN');
  const navCostMeta = document.getElementById('nav-cost-meta');
  if (navCostMeta && st.kpis?.cost30d) navCostMeta.textContent = '$' + (st.kpis.cost30d.value || 0).toFixed(2);
  const guildIcon = document.getElementById('kata-guild-icon');
  if (data.guild.iconUrl){
    guildIcon.innerHTML = `<img src="${data.guild.iconUrl}" alt="" style="width:74px;height:74px;border-radius:20px;object-fit:cover" />`;
    guildIcon.style.background = 'transparent';
    guildIcon.style.border = 'none';
  } else {
    const initials = data.guild.name.replace(/[^A-Za-z0-9À-ỹ]/g,'').slice(0,2).toUpperCase() || '??';
    guildIcon.textContent = initials;
    const accent = avatarSeed(data.guild.id);
    guildIcon.style.background = `linear-gradient(135deg,${accent},${accent}55)`;
  }
  return true;
}

async function loadLogs({ append = false } = {}){
  const guildId = getGuildId();
  if (!append){
    document.getElementById('log-list').innerHTML = '';
    CURRENT_CURSOR = null;
    CHAT_ITEMS = [];
    document.getElementById('empty-state').classList.add('hidden');
  }
  const params = new URLSearchParams({ type: CURRENT_TAB, limit: '20', count: '0' });
  // Chat: include bot replies too — the API hides them unless role=all.
  if (CURRENT_TAB === 'chat') params.set('role', 'all');
  if (CURRENT_CURSOR) params.set('cursor', CURRENT_CURSOR);
  const userId = document.getElementById('f-userId').value.trim();
  const channelId = document.getElementById('f-channelId').value.trim();
  const command = document.getElementById('f-command').value.trim();
  if (userId) params.set('userId', userId);
  if (channelId) params.set('channelId', channelId);
  if (command) params.set('command', command);

  const btnMore = document.getElementById('btn-more');
  btnMore.classList.add('hidden');
  if (!append){
    document.getElementById('log-list').innerHTML = `<div class="mono text-[11px] text-mute2 py-10 text-center">Đang tải…</div>`;
  }

  let r;
  try { r = await fetch(`/api/kata/server/${encodeURIComponent(guildId)}/logs?${params}`, { credentials:'same-origin' }); }
  catch { showToast('Lỗi mạng', 'err'); return; }
  if (!r.ok){
    document.getElementById('log-list').innerHTML = `<div class="text-err mono text-[12px] py-10 text-center">Lỗi tải (HTTP ${r.status})</div>`;
    return;
  }
  const data = await r.json();
  if (!append){
    document.getElementById('log-list').innerHTML = '';
    if (data.total != null){
      document.getElementById('page-counts').textContent = `${data.total.toLocaleString('vi-VN')} entries`;
    } else {
      const loaded = Number(data.items?.length || 0);
      document.getElementById('page-counts').textContent = loaded ? `${loaded.toLocaleString('vi-VN')}${data.nextCursor ? '+' : ''} entries` : '';
    }
  }
  if (data.items.length === 0 && !append){
    document.getElementById('log-list').innerHTML = `<div class="rounded-[14px] border border-line bg-panel/40 p-10 text-center"><div class="mono text-[11px] text-mute">Chưa có entry nào.</div></div>`;
  } else if (CURRENT_TAB === 'chat'){
    CHAT_ITEMS = CHAT_ITEMS.concat(data.items);
    document.getElementById('log-list').innerHTML = pairChatItems(CHAT_ITEMS).map(chatBlockHtml).join('');
  } else {
    const renderer = ROW_RENDERERS[CURRENT_TAB];
    document.getElementById('log-list').insertAdjacentHTML('beforeend', data.items.map(renderer).join(''));
  }

  CURRENT_CURSOR = data.nextCursor;
  if (CURRENT_CURSOR){
    btnMore.classList.remove('hidden');
  } else {
    document.getElementById('empty-state').classList.remove('hidden');
  }
}

function switchTab(tab){
  if (!TAB_LABELS[tab] || tab === CURRENT_TAB) return;
  CURRENT_TAB = tab;
  const url = new URL(window.location.href);
  url.searchParams.set('tab', tab);
  window.history.replaceState(null, '', url);
  renderTabsActive();
  loadLogs();
}

document.addEventListener('click', (e) => {
  const tabBtn = e.target.closest('[data-tab]');
  if (tabBtn && tabBtn.dataset.tab){ switchTab(tabBtn.dataset.tab); return; }
});
document.getElementById('btn-more').addEventListener('click', () => loadLogs({ append: true }));
document.getElementById('btn-refresh').addEventListener('click', () => loadLogs());
document.getElementById('btn-apply').addEventListener('click', () => loadLogs());
document.getElementById('btn-clear').addEventListener('click', () => {
  document.getElementById('f-userId').value = '';
  document.getElementById('f-channelId').value = '';
  document.getElementById('f-command').value = '';
  loadLogs();
});
for (const id of ['f-userId','f-channelId','f-command']){
  document.getElementById(id).addEventListener('keydown', (e) => { if (e.key === 'Enter') loadLogs(); });
}

(async () => {
  renderTabsActive();
  const ok = await loadGuildBootstrap();
  if (ok) await loadLogs();
})();
</script>
