<!-- toast -->
<div id="toast" class="fixed top-20 right-6 z-[110] pointer-events-none"></div>

<script>
const ACCENTS = ['#E04545','#D4A858','#5BA868','#7a9eb5','#9bb4ff','#c46868','#c9a653'];
function escapeHtml(s){return String(s ?? '').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function getGuildId(){ return new URL(window.location.href).searchParams.get('guild'); }
function getInitialTab(){ return new URL(window.location.href).searchParams.get('tab') || 'chat'; }
function avatarSeed(id){ const s=[...String(id||'')].reduce((a,c)=>a+c.charCodeAt(0),0); return ACCENTS[s%ACCENTS.length]; }
function relTime(d){
  const t = new Date(d).getTime(); const s = Math.max(1, Math.round((Date.now() - t) / 1000));
  if (s < 60) return s + 's trước';
  if (s < 3600) return Math.floor(s/60) + 'p trước';
  if (s < 86400) return Math.floor(s/3600) + 'g trước';
  return Math.floor(s/86400) + 'd trước';
}
function showToast(msg, kind='ok'){
  const colors={ok:'#5BA868',err:'#c46868',info:'#7a9eb5'}; const c=colors[kind]||colors.ok;
  const el=document.createElement('div');
  el.className='mono text-[12px] px-4 py-2.5 rounded-[10px] mb-2 pointer-events-auto';
  el.style.cssText=`background:${c}18;border:1px solid ${c}55;color:${c};box-shadow:0 16px 40px -16px ${c}99`;
  el.textContent=msg; document.getElementById('toast').appendChild(el);
  setTimeout(()=>{el.style.opacity='0';el.style.transition='opacity 200ms';setTimeout(()=>el.remove(),220);},3000);
}

const TAB_LABELS = {
  chat: { vi: 'chat', tagline: 'TIN NHẮN · TTL 24H' },
  image: { vi: 'image', tagline: 'ẢNH · VĨNH VIỄN' },
  video: { vi: 'video', tagline: 'VIDEO · VĨNH VIỄN' },
  command: { vi: 'commands', tagline: 'COMMAND HISTORY · TẤT CẢ' },
};

let CURRENT_TAB = getInitialTab();
let CURRENT_CURSOR = null;
let CURRENT_GUILD_DATA = null;

function renderTabsActive(){
  for (const btn of document.querySelectorAll('.kata-tab')){
    const active = btn.dataset.tab === CURRENT_TAB;
    btn.classList.toggle('text-red', active);
    btn.classList.toggle('font-bold', active);
    btn.classList.toggle('text-mute', !active);
    let underline = btn.querySelector('.tab-underline');
    if (active && !underline){
      underline = document.createElement('span');
      underline.className = 'tab-underline absolute left-2 right-2 bottom-[-1px] h-[2px] bg-red';
      btn.appendChild(underline);
    } else if (!active && underline){
      underline.remove();
    }
  }
  for (const a of document.querySelectorAll('aside [data-tab]')){
    const active = a.dataset.tab === CURRENT_TAB;
    a.classList.toggle('text-red', active);
    a.classList.toggle('text-mute', !active);
    a.style.background = active ? '#E0454510' : 'transparent';
    a.style.borderLeft = active ? '2px solid #E04545' : 'none';
  }
  document.getElementById('page-tab-label').textContent = ' · ' + TAB_LABELS[CURRENT_TAB].vi;
  document.getElementById('page-tag').textContent = `TAB · LOGS / ${TAB_LABELS[CURRENT_TAB].vi.toUpperCase()} · ${TAB_LABELS[CURRENT_TAB].tagline}`;
  document.getElementById('bc-tab').textContent = TAB_LABELS[CURRENT_TAB].vi;
  document.title = `logs · ${TAB_LABELS[CURRENT_TAB].vi} · katas`;
}

function rowChat(e){
  const accent = avatarSeed(e.userId); const short = e.userId.slice(-4);
  const isAssistant = e.role === 'assistant';
  return `<article class="rounded-[14px] border border-line bg-panel p-4">
    <div class="flex items-center gap-3 mb-2 mono text-[11px]">
      <span class="flex items-center gap-2"><span class="w-5 h-5 rounded-full grid place-items-center text-[9px] font-extrabold" style="background:${accent}22;color:${accent}">${short.slice(0,1)}</span><span class="text-mute">${short}</span></span>
      <span class="text-mute2">·</span>
      <span class="text-${isAssistant?'gold':'red'} text-[10px] tracking-label uppercase">${isAssistant?'bot':'user'}</span>
      <span class="text-mute2">·</span>
      <span class="text-mute">#${e.channelId.slice(-6)}</span>
      <span class="text-mute2">·</span>
      <span class="text-mute">${relTime(e.createdAt)}</span>
      ${e.modelUsed ? `<span class="text-mute2">·</span><span class="mono text-[9px] tracking-label uppercase text-mute2">${escapeHtml(e.modelUsed)}</span>` : ''}
    </div>
    <div class="text-[13px] text-ink leading-[1.55] whitespace-pre-wrap break-words">${escapeHtml(e.content)}${e.contentTruncated?'<span class="text-mute2"> …</span>':''}</div>
    <div class="flex items-center gap-3 mono text-[10px] tracking-label uppercase mt-3 flex-wrap text-mute2">
      ${e.tokensIn != null ? `<span>in · ${e.tokensIn}</span>` : ''}
      ${e.tokensOut != null ? `<span>out · ${e.tokensOut}</span>` : ''}
      ${e.costUSD != null ? `<span class="text-gold">cost · $${e.costUSD.toFixed(4)}</span>` : ''}
    </div>
  </article>`;
}

function rowImage(e){
  const accent = avatarSeed(e.userId); const short = e.userId.slice(-4);
  const inputUrl = e.inputImageUrl;
  const outputUrl = e.outputUrl;
  const fallback = Array.isArray(e.fallbackChain) ? e.fallbackChain.find(f => f.status === 'fallback') : null;
  return `<article class="rounded-[14px] border border-line bg-panel">
    <div class="p-5 flex gap-5">
      <div class="flex items-center gap-3 flex-shrink-0">
        ${inputUrl
          ? `<a href="${escapeHtml(inputUrl)}" target="_blank" rel="noopener"><img src="${escapeHtml(inputUrl)}" loading="lazy" alt="input" class="w-[72px] h-[72px] rounded-[8px] object-cover border border-line" /></a>`
          : `<div class="w-[72px] h-[72px] rounded-[8px] grid place-items-center border border-line" style="background:#0a0807"><span class="mono text-[9px] text-mute2 tracking-label uppercase">no input</span></div>`
        }
        <span class="text-mute2 text-lg">→</span>
        ${outputUrl
          ? `<a href="${escapeHtml(outputUrl)}" target="_blank" rel="noopener"><img src="${escapeHtml(outputUrl)}" loading="lazy" alt="output" class="w-[72px] h-[72px] rounded-[8px] object-cover border border-line" /></a>`
          : `<div class="w-[72px] h-[72px] rounded-[8px] border border-line" style="background:#0a0807"></div>`
        }
      </div>
      <div class="flex-1 min-w-0">
        <div class="flex items-center gap-4 mb-3 mono text-[11px] flex-wrap">
          <span class="flex items-center gap-2"><span class="w-5 h-5 rounded-full grid place-items-center text-[9px] font-extrabold" style="background:${accent}22;color:${accent}">${short.slice(0,1)}</span><span class="text-mute">${short}</span></span>
          <span class="text-mute2">·</span>
          <span class="text-red text-[10px] tracking-label uppercase">${escapeHtml(e.command)}</span>
          <span class="text-mute2">·</span>
          <span class="text-mute">#${e.channelId.slice(-6)}</span>
          <span class="text-mute2">·</span>
          <span class="text-mute">${relTime(e.createdAt)}</span>
          ${fallback ? `<span class="mono text-[9px] tracking-label uppercase px-2 py-0.5 rounded-full" style="background:#c9a65318;border:1px solid #c9a65340;color:#c9a653">FALLBACK · ${escapeHtml(fallback.model.split('/').pop())}</span>` : ''}
        </div>
        <div class="text-[13px] text-mute leading-[1.55] mb-3">
          ${e.prompt ? `<span class="text-mute2 mono text-[10px] uppercase tracking-label mr-2">prompt</span><span class="text-ink">${escapeHtml(e.prompt)}</span>` : `<span class="italic text-mute2">— no prompt</span>`}
        </div>
        <div class="flex items-center gap-3 mono text-[10px] tracking-label uppercase flex-wrap">
          ${e.modelUsed ? `<span class="px-2 py-1 rounded-full bg-ink/[0.05] border border-line">model · ${escapeHtml(e.modelUsed.split('/').slice(-2).join('/'))}</span>` : ''}
          ${e.costUSD != null ? `<span class="text-gold">cost · $${e.costUSD.toFixed(4)}</span>` : ''}
        </div>
      </div>
      ${outputUrl ? `<div class="flex flex-col gap-1.5 flex-shrink-0"><a href="${escapeHtml(outputUrl)}" target="_blank" rel="noopener" class="mono h-7 px-2.5 rounded-[6px] border border-line text-mute hover:text-ink text-[9px] tracking-label uppercase grid place-items-center">↗ open</a></div>` : ''}
    </div>
  </article>`;
}

function rowVideo(e){
  const accent = avatarSeed(e.userId); const short = e.userId.slice(-4);
  const outputUrl = e.outputUrl;
  return `<article class="rounded-[14px] border border-line bg-panel">
    <div class="p-5 flex gap-5">
      <div class="flex items-center gap-3 flex-shrink-0">
        ${outputUrl
          ? `<a href="${escapeHtml(outputUrl)}" target="_blank" rel="noopener" class="block w-[120px] h-[72px] rounded-[8px] border border-line overflow-hidden grid place-items-center" style="background:#0a0807"><span class="mono text-[10px] text-red tracking-label uppercase">▸ open mp4</span></a>`
          : `<div class="w-[120px] h-[72px] rounded-[8px] border border-line grid place-items-center" style="background:#0a0807"><span class="mono text-[9px] text-mute2 tracking-label uppercase">no output</span></div>`
        }
      </div>
      <div class="flex-1 min-w-0">
        <div class="flex items-center gap-4 mb-3 mono text-[11px] flex-wrap">
          <span class="flex items-center gap-2"><span class="w-5 h-5 rounded-full grid place-items-center text-[9px] font-extrabold" style="background:${accent}22;color:${accent}">${short.slice(0,1)}</span><span class="text-mute">${short}</span></span>
          <span class="text-mute2">·</span>
          <span class="text-red text-[10px] tracking-label uppercase">${escapeHtml(e.command)}</span>
          <span class="text-mute2">·</span>
          <span class="text-mute">#${e.channelId.slice(-6)}</span>
          <span class="text-mute2">·</span>
          <span class="text-mute">${relTime(e.createdAt)}</span>
        </div>
        <div class="text-[13px] text-mute leading-[1.55] mb-3">
          ${e.prompt ? `<span class="text-mute2 mono text-[10px] uppercase tracking-label mr-2">prompt</span><span class="text-ink">${escapeHtml(e.prompt)}</span>` : `<span class="italic text-mute2">— no prompt</span>`}
        </div>
        <div class="flex items-center gap-3 mono text-[10px] tracking-label uppercase flex-wrap">
          ${e.modelUsed ? `<span class="px-2 py-1 rounded-full bg-ink/[0.05] border border-line">model · ${escapeHtml(e.modelUsed.split('/').slice(-2).join('/'))}</span>` : ''}
          ${e.durationSec != null ? `<span class="text-mute2">duration · ${e.durationSec}s</span>` : ''}
          ${e.costUSD != null ? `<span class="text-gold">cost · $${e.costUSD.toFixed(4)}</span>` : ''}
        </div>
      </div>
    </div>
  </article>`;
}

function rowCommand(e){
  const accent = avatarSeed(e.userId); const short = e.userId.slice(-4);
  const failed = e.success === false;
  const wrapStyle = failed ? 'background:#c4686808;border-color:#c4686844' : '';
  return `<article class="rounded-[14px] border bg-panel" style="border-color:rgba(255,255,255,0.08);${wrapStyle}">
    <div class="p-4">
      <div class="flex items-center gap-4 mb-2 mono text-[11px] flex-wrap">
        <span class="flex items-center gap-2"><span class="w-5 h-5 rounded-full grid place-items-center text-[9px] font-extrabold" style="background:${accent}22;color:${accent}">${short.slice(0,1)}</span><span class="text-mute">${short}</span></span>
        <span class="text-mute2">·</span>
        <span class="text-${failed?'err':'red'} text-[10px] tracking-label uppercase">${escapeHtml(e.command)}${failed?' · fail':''}</span>
        <span class="text-mute2">·</span>
        <span class="text-mute">#${e.channelId.slice(-6)}</span>
        <span class="text-mute2">·</span>
        <span class="text-mute">${relTime(e.createdAt)}</span>
        ${failed ? `<span class="mono text-[9px] tracking-label uppercase px-2 py-0.5 rounded-full" style="background:#c4686818;border:1px solid #c4686844;color:#c46868">FAIL</span>` : ''}
      </div>
      <div class="text-[13px] text-mute leading-[1.55] mb-2">
        <span class="text-mute2 mono text-[10px] uppercase tracking-label mr-2">input</span>
        <span class="text-ink">${escapeHtml((e.input||'').slice(0, 400))}</span>
      </div>
      ${failed && e.errorMessage ? `<div class="text-[12px] mono mt-1" style="color:#c46868">${escapeHtml(e.errorMessage)}</div>` : ''}
      <div class="flex items-center gap-3 mono text-[10px] tracking-label uppercase mt-2 flex-wrap text-mute2">
        ${e.modelUsed ? `<span>model · ${escapeHtml(e.modelUsed)}</span>` : ''}
        ${e.latencyMs != null ? `<span>latency · ${(e.latencyMs/1000).toFixed(1)}s</span>` : ''}
        ${e.costUSD != null ? `<span class="text-gold">cost · $${e.costUSD.toFixed(4)}</span>` : ''}
      </div>
    </div>
  </article>`;
}

const ROW_RENDERERS = { chat: rowChat, image: rowImage, video: rowVideo, command: rowCommand };

async function loadGuildBootstrap(){
  const guildId = getGuildId();
  if (!guildId){ window.location.href = 'servers.html'; return false; }

  // user chip
  fetch('/api/auth/me', { credentials:'same-origin' }).then(r=>r.json()).then(({user}) => {
    if (!user) return;
    const chip = document.getElementById('kata-user-chip');
    const initial = (user.displayName || user.username || '?').slice(0,1).toUpperCase();
    chip.innerHTML = (user.avatarUrl
      ? `<img src="${user.avatarUrl}" alt="" style="width:26px;height:26px;border-radius:9999px;object-fit:cover;border:1px solid rgba(255,255,255,0.08)" />`
      : `<span class="w-[26px] h-[26px] rounded-full grid place-items-center text-[11px] font-extrabold" style="background:#E0454522;color:#E04545">${initial}</span>`)
      + `<span class="max-w-[96px] truncate">${escapeHtml(user.displayName || user.username || '—')}</span>`
      + `<span class="text-mute text-[9px]">▾</span>`;
  }).catch(()=>{});

  document.getElementById('nav-overview').href = `overview.html?guild=${encodeURIComponent(guildId)}`;
  document.getElementById('nav-cost').href = `cost.html?guild=${encodeURIComponent(guildId)}`;
  document.getElementById('bc-guild').href = `overview.html?guild=${encodeURIComponent(guildId)}`;

  // Pull guild meta from /api/kata/server/:id (also serves as auth probe)
  let r;
  try {
    r = await fetch(`/api/kata/server/${encodeURIComponent(guildId)}`, { credentials:'same-origin' });
  } catch {
    showToast('Lỗi mạng', 'err'); return false;
  }
  if (r.status === 401 || r.status === 403){
    document.querySelector('main').innerHTML = `
      <div class="rounded-[14px] border border-line bg-panel p-10 text-center max-w-xl mx-auto mt-20">
        <div class="text-[16px] font-medium text-ink mb-3">Cần đăng nhập với Discord (admin của server).</div>
        <a href="/api/auth/discord/start" class="mono inline-flex items-center gap-2 h-10 px-5 rounded-[10px] uppercase tracking-label text-[11px] font-bold text-bg mt-3" style="background:#5865F2">đăng nhập với Discord</a>
        <a href="servers.html" class="mono inline-flex items-center gap-2 h-10 px-5 rounded-[10px] uppercase tracking-label text-[11px] text-mute hover:text-ink mt-3 ml-2 border border-line">← danh sách server</a>
      </div>`;
    return false;
  }
  if (r.status === 404){
    document.querySelector('main').innerHTML = `<div class="text-mute mt-20 text-center">Bot không có trong server này.</div>`;
    return false;
  }
  if (!r.ok){ showToast(`Lỗi tải (HTTP ${r.status})`, 'err'); return false; }

  const data = await r.json();
  CURRENT_GUILD_DATA = data.guild;
  document.getElementById('kata-guild-name').textContent = data.guild.name;
  document.getElementById('bc-guild').textContent = data.guild.name;
  document.getElementById('kata-guild-meta').textContent = `id · ${data.guild.id}`;
  const guildIcon = document.getElementById('kata-guild-icon');
  if (data.guild.iconUrl){
    guildIcon.innerHTML = `<img src="${data.guild.iconUrl}" alt="" style="width:48px;height:48px;border-radius:10px;object-fit:cover" />`;
    guildIcon.style.background = 'transparent';
  } else {
    const initials = data.guild.name.replace(/[^A-Za-z0-9À-ỹ]/g,'').slice(0,2).toUpperCase() || '??';
    guildIcon.textContent = initials;
    const accent = avatarSeed(data.guild.id);
    guildIcon.style.background = `linear-gradient(135deg,${accent},${accent}55)`;
  }
  return true;
}

async function loadLogs({ append = false } = {}){
  const guildId = getGuildId();
  if (!append){
    document.getElementById('log-list').innerHTML = '';
    CURRENT_CURSOR = null;
    document.getElementById('empty-state').classList.add('hidden');
  }
  const params = new URLSearchParams({ type: CURRENT_TAB, limit: '20' });
  if (CURRENT_CURSOR) params.set('cursor', CURRENT_CURSOR);
  const userId = document.getElementById('f-userId').value.trim();
  const channelId = document.getElementById('f-channelId').value.trim();
  const command = document.getElementById('f-command').value.trim();
  if (userId) params.set('userId', userId);
  if (channelId) params.set('channelId', channelId);
  if (command) params.set('command', command);

  const btnMore = document.getElementById('btn-more');
  btnMore.classList.add('hidden');
  if (!append){
    document.getElementById('log-list').innerHTML = `<div class="mono text-[11px] text-mute2 py-10 text-center">Đang tải…</div>`;
  }

  let r;
  try { r = await fetch(`/api/kata/server/${encodeURIComponent(guildId)}/logs?${params}`, { credentials:'same-origin' }); }
  catch { showToast('Lỗi mạng', 'err'); return; }
  if (!r.ok){
    document.getElementById('log-list').innerHTML = `<div class="text-err mono text-[12px] py-10 text-center">Lỗi tải (HTTP ${r.status})</div>`;
    return;
  }
  const data = await r.json();
  if (!append){
    document.getElementById('log-list').innerHTML = '';
    if (data.total != null){
      document.getElementById('page-counts').textContent = `${data.total.toLocaleString('vi-VN')} entries`;
    } else {
      document.getElementById('page-counts').textContent = '';
    }
  }
  if (data.items.length === 0 && !append){
    document.getElementById('log-list').innerHTML = `<div class="rounded-[14px] border border-line bg-panel/40 p-10 text-center"><div class="mono text-[11px] text-mute">Chưa có entry nào.</div></div>`;
  } else {
    const renderer = ROW_RENDERERS[CURRENT_TAB];
    document.getElementById('log-list').insertAdjacentHTML('beforeend', data.items.map(renderer).join(''));
  }

  CURRENT_CURSOR = data.nextCursor;
  if (CURRENT_CURSOR){
    btnMore.classList.remove('hidden');
  } else {
    document.getElementById('empty-state').classList.remove('hidden');
  }
}

function switchTab(tab){
  if (!TAB_LABELS[tab] || tab === CURRENT_TAB) return;
  CURRENT_TAB = tab;
  const url = new URL(window.location.href);
  url.searchParams.set('tab', tab);
  window.history.replaceState(null, '', url);
  renderTabsActive();
  loadLogs();
}

document.addEventListener('click', (e) => {
  const tabBtn = e.target.closest('[data-tab]');
  if (tabBtn && tabBtn.dataset.tab){ switchTab(tabBtn.dataset.tab); return; }
});
document.getElementById('btn-more').addEventListener('click', () => loadLogs({ append: true }));
document.getElementById('btn-refresh').addEventListener('click', () => loadLogs());
document.getElementById('btn-apply').addEventListener('click', () => loadLogs());
document.getElementById('btn-clear').addEventListener('click', () => {
  document.getElementById('f-userId').value = '';
  document.getElementById('f-channelId').value = '';
  document.getElementById('f-command').value = '';
  loadLogs();
});
for (const id of ['f-userId','f-channelId','f-command']){
  document.getElementById(id).addEventListener('keydown', (e) => { if (e.key === 'Enter') loadLogs(); });
}

(async () => {
  renderTabsActive();
  const ok = await loadGuildBootstrap();
  if (ok) await loadLogs();
})();
</script>
